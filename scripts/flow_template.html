<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pinwheel-llm 数据流</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&display=swap">
<style>
/* VOICE work: a lab figure for the person who trains this model
   IDEA a metro line through one training step: stations from batch to optimizer, one token riding it
   PICTURE the route itself; every station draws the real tensor it produces for the tracked token
   COLOUR salmon paper shared with tree.html, ink, a teal route, claret and oxford blue for signed values
   TYPE Libre Franklin with the system CJK face, monospace for shapes and token ids
   LAYOUT header strip; recipe and comparison sticky on the left, the route on the right; one column on a phone */
:root{color-scheme:light dark;--bg:light-dark(#fbe9df,#191512);--card:light-dark(#fffaf6,#231e1b);--sub:light-dark(#f4e0d5,#2e2622);--ink:light-dark(#1a1817,#f2e8e1);--ink2:light-dark(#4a4441,#cdc1b9);--muted:light-dark(#7a706b,#9c9089);--line:light-dark(#e6cfc3,#3b322d);--teal:light-dark(#0d7680,#3cb4bd);--teal2:light-dark(#dbefed,#173337);--pos:light-dark(#990f3d,#ec6a91);--neg:light-dark(#0f5499,#6aa6ea);--amber:light-dark(#a86400,#e3a64a);--on:light-dark(#ffffff,#10201f);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:"Libre Franklin",-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4{margin:0;line-height:1.15;letter-spacing:-.01em}
p{margin:6px 0}
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;max-width:1360px;margin:0 auto;padding:28px max(3vw,16px) 18px}
.top h1{font-size:clamp(28px,3.4vw,42px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.lede{max-width:68ch;color:var(--ink2);font-size:16px;margin-top:10px}
.kpi{text-align:right}
.top-ctl{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-bottom:10px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{border:0;background:var(--card);padding:3px 12px;font-size:13px;min-height:30px}
.lang button.on{background:var(--ink);color:var(--bg);font-weight:700}
.kpi .big{font-size:clamp(34px,4vw,52px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .lab{color:var(--muted);font-size:14px}
.kpi .run{font:14px var(--mono);color:var(--ink2)}
.delta{display:inline-block;font-weight:700;font-variant-numeric:tabular-nums;padding:1px 8px;border-radius:999px;font-size:14px}
.delta.good{background:var(--teal2);color:var(--teal)}
.delta.bad{background:color-mix(in srgb,var(--pos) 14%,transparent);color:var(--pos)}
.delta.flat{background:var(--sub);color:var(--ink2)}
.wrap{display:grid;grid-template-columns:312px minmax(0,1fr);gap:22px;max-width:1360px;margin:0 auto;padding:0 max(3vw,16px) 80px}
aside{position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);overflow:auto;display:grid;gap:12px;padding-bottom:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.panel h2{font-size:16px;font-weight:700;margin-bottom:8px}
.slot{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;align-items:start;margin:7px 0}
.slot>span{font-size:14px;color:var(--ink2);padding-top:5px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{min-height:32px;padding:3px 9px;border:1px solid var(--line);background:var(--card);border-radius:6px;font-size:14px;white-space:nowrap}
.seg button:hover{border-color:var(--teal)}
.seg button.on{background:var(--teal);border-color:var(--teal);color:var(--on);font-weight:700}
.seg sup{color:var(--amber);font-weight:700;margin-left:2px}
.seg button.on sup{color:var(--on)}
.hint,.note,.cap{color:var(--muted);font-size:13px}
.cap{margin:4px 0 0}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
.tokbar{position:sticky;top:0;z-index:6;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tokbar .row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.toks{display:flex;flex-wrap:wrap;gap:3px}
.toks button{border:1px solid var(--line);background:var(--card);border-radius:5px;padding:2px 6px;font:14px var(--mono);white-space:pre;min-height:28px}
.toks button:hover{border-color:var(--teal)}
.toks button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toks button.tgt{border-color:var(--pos);border-width:2px}
.sp{color:var(--muted);font-style:normal}
.on .sp{color:inherit;opacity:.6}
.track{font-size:14px;color:var(--ink2);margin-top:6px}
.track b{font-family:var(--mono);white-space:pre}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ctl button,.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:4px 10px;font-size:14px;min-height:32px}
.ctl button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.play{background:var(--teal)!important;color:var(--on)!important;border-color:var(--teal)!important;font-weight:700}
.st{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px 14px 46px;transition:box-shadow .3s}
.st::before{content:"";position:absolute;left:20px;top:0;bottom:0;border-left:4px solid var(--teal)}
.st>.dot{position:absolute;left:13px;top:16px;width:18px;height:18px;border-radius:50%;border:4px solid var(--teal);background:var(--card);transition:background .2s,transform .2s}
.st.go{box-shadow:0 0 0 3px var(--teal)}
.st.go>.dot{background:var(--teal);transform:scale(1.25)}
.st.changed{box-shadow:0 0 0 2px var(--amber)}
.st-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-bottom:6px}
.st-h h3{font-size:20px;font-weight:800}
.io{font:13px var(--mono);color:var(--ink2);background:var(--sub);border-radius:4px;padding:1px 6px}
.tag{font-size:13px;font-weight:700;color:var(--amber)}
.swap{border:1.5px solid var(--teal);color:var(--muted);background:transparent;border-radius:999px;padding:2px;font-size:13px;min-height:28px}
.swap:hover{background:var(--teal2)}
.swap b,.swap i{font-style:normal;border-radius:999px;padding:1px 8px}
.swap b{background:var(--teal);color:var(--on)}
.edge{margin-left:20px;border-left:4px solid var(--teal);padding:7px 0 7px 22px;font:13px var(--mono);color:var(--ink2)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px 20px}
.sub{position:relative;border-left:2px dashed var(--line);margin-left:2px;padding:4px 0 14px 16px}
.sub h4{font-size:16px;font-weight:700;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.sub h4 .io{font-weight:400}
.heat{position:relative;margin-top:6px}
.heat canvas{display:block;width:100%;height:calc(var(--rows) * 6px);image-rendering:pixelated;border:1px solid var(--line);cursor:pointer}
.selrow{position:absolute;left:0;right:0;outline:2px solid var(--ink);pointer-events:none}
.heads{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:6px;max-width:560px}
.heads button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:4px;font-size:13px;text-align:center}
.heads button.on{border:2px solid var(--ink)}
.heads canvas{display:block;width:100%;aspect-ratio:1;image-rendering:pixelated}
.bigatt canvas{display:block;max-width:100%;cursor:pointer}
.scroll{overflow-x:auto}
.bars{display:grid;gap:3px;margin-top:6px}
.bars .r{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr) 5.2em;gap:8px;align-items:center;font-size:14px}
.bars .r>span:first-child{font-family:var(--mono);white-space:pre;overflow:hidden;text-overflow:ellipsis}
.bars .r>span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:11px;background:var(--teal);border-radius:2px;min-width:1px}
.bars .r.hit .bar{background:var(--pos)}
.bars .r.hit>span:first-child{color:var(--pos);font-weight:700}
.lrows{display:grid;gap:2px;margin-top:8px}
.lrow{display:grid;grid-template-columns:5.5em minmax(0,1fr) minmax(0,9em) 4.6em;gap:10px;align-items:center;border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 6px;text-align:left;font-size:14px}
.lrow:hover{border-color:var(--line)}
.lrow.on{border-color:var(--ink);background:var(--sub)}
.lrow .t{font-family:var(--mono);white-space:pre;overflow:hidden;text-overflow:ellipsis}
.lrow .t.hit{color:var(--pos);font-weight:700}
.lrow .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.lrow .bar{background:var(--neg)}
table.grid{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.grid th,table.grid td{padding:3px 6px;border:1px solid var(--line);text-align:right;white-space:nowrap}
table.grid th{color:var(--ink2);font-weight:600;background:var(--sub)}
table.grid td.tk,table.grid th.tk{font-family:var(--mono);white-space:pre;text-align:left}
table.grid td.hit{outline:2px solid var(--pos);outline-offset:-2px;font-weight:700}
table.grid td.sel,table.grid th.sel{box-shadow:inset 0 0 0 2px var(--ink)}
table.xy td{font:14px var(--mono);white-space:pre;padding:2px 6px;border:1px solid var(--line);background:var(--card)}
table.xy th{padding-right:8px;color:var(--ink2)}
table.xy{border-collapse:collapse}
.lossbars{display:flex;align-items:flex-end;gap:3px;height:170px;padding-top:6px;min-width:max-content}
.lossbars button{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;width:30px;height:100%;border:0;background:transparent;padding:0}
.lossbars .b{width:20px;background:var(--neg);border-radius:2px 2px 0 0}
.lossbars button.on .b{background:var(--pos)}
.lossbars small{font:13px var(--mono);writing-mode:vertical-rl;white-space:pre;max-height:5.5em;overflow:hidden;margin-top:3px;color:var(--ink2)}
.hist{display:flex;align-items:flex-end;gap:1px;height:70px;margin-top:6px;border-bottom:1px solid var(--line)}
.hist i{flex:1;background:var(--neg)}
.hist i.mid{background:var(--ink)}
.fig{position:relative;height:230px;margin-top:6px}
.fig svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fig svg text{font:13px var(--sans);fill:var(--ink2);paint-order:stroke;stroke:var(--card);stroke-width:4px}
.formula{font:14px var(--mono);background:var(--sub);border-radius:6px;padding:8px 10px;margin:6px 0;overflow-x:auto;white-space:pre;line-height:1.7}
.pill{display:inline-block;border-radius:999px;padding:0 8px;font-size:13px;font-weight:700}
.pill.ok{background:var(--teal2);color:var(--teal)}
.pill.warn{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.mats{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.mats button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:2px 8px;font:13px var(--mono);min-height:28px}
.mats button.on{background:var(--ink);color:var(--bg)}
details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--teal)}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font:13px var(--mono);padding:4px 8px;border-radius:4px;display:none;z-index:30;white-space:pre}
#tip.wide{white-space:normal;max-width:min(340px,90vw);font:14px/1.5 var(--sans);padding:8px 10px}
#probe{position:absolute;width:0;height:0;overflow:hidden}
.two .bars{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px}
.two .bars .r{grid-template-columns:4.8em minmax(0,1fr) 3em}
.gist{font-size:17px;font-weight:600;color:var(--ink);margin:2px 0 8px;max-width:70ch}
.how,.see{border-radius:8px;padding:8px 12px;margin:10px 0 4px;font-size:14px;line-height:1.55;max-width:90ch}
.how{background:var(--teal2)}
.see{background:color-mix(in srgb,var(--amber) 13%,transparent)}
.how>b,.see>b{display:block;font-size:13px;margin-bottom:2px}
.how>b{color:var(--teal)}
.see>b{color:var(--amber)}
.see ul{margin:0;padding-left:18px}
.term{border-bottom:1.5px dotted var(--teal);cursor:help}
.guide{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:14px}
.guide h3{font-size:16px;font-weight:800;margin-bottom:4px}
.guide ul{margin:4px 0 0;padding-left:18px}
.guide li{margin:3px 0}
.nohints .how,.nohints .see,.nohints .guide{display:none}
@media (max-width:980px){.wrap{grid-template-columns:minmax(0,1fr)}aside{position:static;max-height:none}.top{grid-template-columns:minmax(0,1fr)}.kpi{text-align:left}.top-ctl{justify-content:flex-start}}
@media (max-width:600px){.st{padding:12px 12px 12px 38px}.st::before{left:15px}.st>.dot{left:8px}.edge{margin-left:15px;padding-left:16px}.lrow{grid-template-columns:4.6em minmax(0,1fr) minmax(0,7em) 3.6em;gap:6px}.bars .r{grid-template-columns:minmax(0,7em) minmax(0,1fr) 4.4em}}
@media (prefers-reduced-motion:reduce){.st,.st>.dot{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1 id="h1"></h1>
    <p class="lede" id="lede"></p>
  </div>
  <div class="kpi"><div class="top-ctl"><div class="lang" id="lang"></div><div class="lang" id="hints"></div></div><div id="kpi"></div></div>
</header>
<div class="wrap">
  <aside>
    <section class="panel"><h2 id="recipe-h"></h2><div id="slots"></div><p class="hint" id="hint"></p></section>
    <section class="panel" id="cmp"></section>
    <section class="panel" id="info"></section>
  </aside>
  <main>
    <div class="tokbar" id="tokbar"></div>
    <div id="route"></div>
  </main>
</div>
<div id="tip"></div><span id="probe"></span>
<script id="data" type="application/json">__PINWHEEL_FLOW_DATA__</script>
<script>
{
const D = JSON.parse(document.getElementById('data').textContent);
const V = D.variants, VOC = D.vocab, T = D.ids.length - 1;
const INP = D.ids.slice(0, -1), TGT = D.ids.slice(1);
const SP = D.spectra;
const KEY = {lang: 'pinwheel-flow-lang', hints: 'pinwheel-flow-hints'};
const load = k => { try { return localStorage.getItem(KEY[k]); } catch (e) { return null; } };
const store = (k, v) => { try { localStorage.setItem(KEY[k], v); } catch (e) { /* file:// pages may refuse storage */ } };
const S = {v: Math.max(0, V.findIndex(v => v.run !== 'init')), prev: null, pos: T - 1, layer: 0, head: 0, mat: 'wv', big: false,
  open: {}, changed: new Set(), lang: load('lang') === 'en' ? 'en' : 'zh', hints: load('hints') !== '0'};
const L = (zh, en) => S.lang === 'en' ? en : zh;

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const tok = id => VOC[id] === '<|bos|>' ? '<bos>' : VOC[id];
const tokH = id => esc(tok(id)).replace(/ /g, '<i class="sp">·</i>').replace(/\n/g, '<i class="sp">↵</i>');
const q = id => `‹${tokH(id)}›`;
const f = (x, d = 3) => x == null ? '—' : Number(x).toFixed(d);
const pct = p => p >= 0.1 ? (p * 100).toFixed(0) + '%' : p >= 0.01 ? (p * 100).toFixed(1) + '%' : (p * 100).toPrecision(1) + '%';
const fTok = n => n == null ? '—' : n === 0 ? '0' : n >= 1e9 ? +(n / 1e9).toPrecision(2) + 'B' : +(n / 1e6).toPrecision(3) + 'M';
const fLR = x => x == null ? '—' : x.toExponential(1).replace('.0e', 'e');
const fB = n => n == null ? '—' : n / 1024 + 'k';
const fM = n => (n / 1e6).toFixed(2) + 'M';
const fInt = n => Number(n).toLocaleString('en-US');
const numel = s => s.reduce((a, b) => a * b, 1);
const sum = a => a.reduce((x, y) => x + y, 0);
const mean = a => sum(a) / a.length;
const DS = {'fineweb-edu': 'FineWeb-Edu', tinystories: 'TinyStories'};
const onOff = v => v ? L('开', 'on') : L('关', 'off');

// ---------- glossary: dotted terms show these on hover or tap ----------
const GL = {
  token: ['token', 'token', '模型读写文字的最小单位：一个词、半个词或一个标点。', 'The smallest unit the model reads and writes: a word, part of a word, or a punctuation mark.'],
  bpe: ['BPE', 'BPE', '一种切词方法：从单个字节开始，反复把语料里最常挨在一起的两块合并，合到 8192 块为止。常见词是一整块，生僻词会被拆开。', 'A way of cutting text: start from single bytes and keep merging the two pieces that most often sit together in the corpus, until there are 8192. Common words become one piece; rare words get split.'],
  bos: ['<bos>', '<bos>', '每篇文档开头的特殊 token，意思是“新的一篇开始了”。', 'A special token at the start of every document, meaning "a new document starts here".'],
  shape: ['形状', 'shape', '(B, T, 640) 表示 B 段文字 × 每段 T 个 token × 每个 token 用 640 个数表示。', '(B, T, 640) means B pieces of text × T tokens each × 640 numbers per token.'],
  batch: ['batch', 'batch', '一步用多少 token 来估计“该往哪改”。越大方向越准，但每个 token 换来的进步越少。', 'How many tokens one step uses to estimate which way to move. Bigger gives a more accurate direction, but less progress per token.'],
  accum: ['梯度累积', 'gradient accumulation', '显存一次放不下整个 batch，就分几次算，把梯度加起来再更新一次，效果等于一个大 batch。', 'The whole batch does not fit in GPU memory, so it is computed in several passes and the gradients are added up before one update; the effect is the same as one big batch.'],
  emb: ['嵌入表', 'embedding table', '一张 8192 行 × 640 列的表，每个 token 一行。查表 = 把编号换成这一行的 640 个数。', 'An 8192-row × 640-column table, one row per token. Looking up = replacing the id with that row of 640 numbers.'],
  tied: ['权重共享', 'tied weights', '输入的嵌入表和最后的输出头是同一张表，省下一整张表的参数。', 'The input embedding table and the final output head are the same table, which saves a whole table of parameters.'],
  channel: ['通道', 'channel', '640 个数里的某一个位置（某一维）。', 'One of the 640 positions (dimensions) in a token’s vector.'],
  residual: ['残差流', 'residual stream', '每个 token 一块写着 640 个数的“黑板”。每层读黑板、算出一点修改、加回去（不擦掉），再交给下一层。', 'A 640-number "blackboard" for each token. Every layer reads it, works out a small change and adds it on (nothing is erased), then hands it on.'],
  rms: ['RMS', 'RMS', '一组数的典型大小：平方、取平均、再开根号。用来比较向量有多“响”。', 'The typical size of a set of numbers: square them, average, take the square root. Used to compare how "loud" vectors are.'],
  norm: ['归一化', 'normalization', '像调音量：先把 x 缩放到固定大小，再乘 640 个可学习的“音量旋钮”（增益 γ），然后才交给注意力或 MLP。', 'Like a volume control: scale x to a fixed size, then multiply by 640 learnable volume knobs (the gain γ), before handing it to attention or the MLP.'],
  attention: ['注意力', 'attention', '每个 token 给它前面的每个 token 打分，按分数加权，把它们的信息搬到自己身上。', 'Every token scores each token before it, and pulls their information over, weighted by those scores.'],
  qkv: ['q、k、v', 'q, k, v', 'q：我在找什么；k：我这里有什么（像书脊上的目录）；v：真正被搬走的内容（像书的正文）。q·k 越大，越关注。', 'q: what I am looking for; k: what I hold (like the title on a book’s spine); v: the content that actually gets moved (the book itself). The larger q·k, the more attention.'],
  head: ['头', 'head', '注意力分成 10 组同时做，每组 64 维，各学一种“看哪里”：看前一个词、看主语、照抄……', 'Attention is split into 10 groups run side by side, 64 dims each, and each learns its own idea of where to look: the previous word, the subject, copying…'],

function pick(k, val) {
  const cur = V[S.v].recipe;
  let best = null, bs = Infinity;
  V.forEach((v, i) => {
    if (v.recipe[k] !== val) return;
    let sc = 0;
    for (const s of SLOTS) {
      if (s.k === k) continue;
      const a = cur[s.k], b = v.recipe[s.k];

function ticks(a, b, n = 4) {
  const s0 = (b - a) / n || 1, mag = 10 ** Math.floor(Math.log10(s0)), st = [1, 2, 2.5, 5, 10].map(k => k * mag).find(s => s >= s0);
  const out = []; for (let v = Math.ceil(a / st) * st; v <= b + st * 1e-9; v += st) out.push(+v.toPrecision(6));
  return out;
}
function logTicks(a, b) {
  const out = [], e0 = Math.floor(Math.log10(a)), e1 = Math.ceil(Math.log10(b)), ks = e1 - e0 > 3 ? [1] : [1, 2, 5];
  for (let e = e0; e <= e1; e++) for (const k of ks) { const v = k * 10 ** e; if (v >= a * 0.999 && v <= b * 1.001) out.push(v); }
  return out;
}

function drawChart(id, series, o) {
  const el = document.getElementById(id); if (!el) return;
  series = series.filter(s => s.pts && s.pts.length);
  const W = el.clientWidth, H = el.clientHeight, m = {l: 54, r: o.r ?? 96, t: 10, b: 30};
  if (!series.length) { el.innerHTML = `<p class="note">${L('没有曲线（初始化的模型还没训练）。', 'No curves: the initialized model has not been trained.')}</p>`; return; }
  const all = series.flatMap(s => s.pts);
  const [x0, x1] = o.xd || [Math.min(...all.map(p => p[0])), Math.max(...all.map(p => p[0]))];
  const [y0, y1] = o.yd || [Math.min(...all.map(p => p[1])), Math.max(...all.map(p => p[1]))];
  const fx = o.xlog ? Math.log10 : x => x, fy = o.ylog ? Math.log10 : y => y;
  const X = x => m.l + (fx(x) - fx(x0)) / ((fx(x1) - fx(x0)) || 1) * (W - m.l - m.r);
  const Y = y => H - m.b - (fy(y) - fy(y0)) / ((fy(y1) - fy(y0)) || 1) * (H - m.t - m.b);
  const xt = o.xlog ? logTicks(x0, x1) : ticks(x0, x1, W < 520 ? 3 : 5), yt = o.ylog ? logTicks(y0, y1) : ticks(y0, y1, 4);
  let s = `<line x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}" stroke="var(--line)"/>`;
  s += yt.map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end">${esc((o.yf || String)(v))}</text>`).join('');
  s += xt.map(v => `<text x="${X(v)}" y="${H - m.b + 18}" text-anchor="middle">${esc((o.xf || String)(v))}</text>`).join('');
  for (const mk of o.marks || []) s += `<line x1="${X(mk.x)}" x2="${X(mk.x)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--amber)" stroke-dasharray="4 3"/><text x="${X(mk.x) + 4}" y="${m.t + 12}">${esc(mk.label)}</text>`;
  const ends = [];
  for (const se of series) {
    const pts = se.pts.filter(p => p[1] >= y0 && p[1] <= y1 && p[0] >= x0 && p[0] <= x1 && (!o.ylog || p[1] > 0));
    if (!pts.length) continue;
    s += `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join('')}" fill="none" stroke="${se.color}" stroke-width="${se.w || 2}"${se.dash ? ` stroke-dasharray="${se.dash}"` : ''} stroke-linejoin="round"/>`;
    const lp = pts[pts.length - 1];
    if (se.label) ends.push({x: X(lp[0]) + 6, y: Y(lp[1]) + 4, label: se.label, color: se.color});
  }
  ends.sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 15) ends[i].y = ends[i - 1].y + 15;
  s += ends.map(e => `<text x="${e.x}" y="${e.y}" style="fill:${e.color};font-weight:700">${esc(e.label)}</text>`).join('');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${s}</svg>`;
}

    + `<p>${desc}${L(` 峰值学习率 ${fLR(v.lr)}${muon}，每步 ${fB(r.batch)} token。`, ` Peak learning rate ${fLR(v.lr)}${muon}, ${fB(r.batch)} tokens per step.`)}</p>
    <div class="cols"><div><p>${g('lr')}</p>${chart(lrS, {xd, xf: fTok, yf: fLR, marks, r: 58})}</div><div><p>${g('valbpb')}</p>${chart(vs, {xd, xf: fTok, yf: x => x.toFixed(2), yd, marks, r: 58})}</div></div>`
    + how(L('横轴都是“已经训练了多少 token”。左：每一步的学习率；右：验证集上的 BPB，越低越好。青色是现在的实验，灰色是切换前的。', 'Both x axes are "tokens trained so far". Left: the learning rate at each step; right: BPB on the validation set, lower is better. Teal is the current run, grey the one before the swap.'))
    + see([cool && L(`最后 ${cd}% 的退火让 val BPB 从 ${f(cool[0], 3)} 降到 ${f(cool[1], 3)}（${f(cool[1] - cool[0], 3)}）：步子一变小，模型就落进了谷底。`,
      `The final ${cd}% cooldown takes val BPB from ${f(cool[0], 3)} to ${f(cool[1], 3)} (${f(cool[1] - cool[0], 3)}): once the steps shrink, the model settles into the valley floor.`)]);
  return station('sched', L('学习率调度', 'LR schedule'), L('第几步 → 迈多大', 'step n → step size'), body, '', swap('schedule', {}));
}
function stNext() {
  const v = cur(), r = v.recipe;
  const steps = r.tokens && r.batch ? Math.round(r.tokens / r.batch) : 0;
  const body = gist(L('换下一批数据，重复成千上万次。', 'Take the next batch and repeat, thousands of times.'))
    + (steps ? `<p>${L(`回到「取一个 batch」，这次实验一共重复了 ${fInt(steps)} 步、${fTok(r.tokens)} token，最后 val BPB ${f(v.val_bpb, 4)}。`, `Back to "Sample a batch": this run repeated it ${fInt(steps)} times, ${fTok(r.tokens)} tokens in all, and ended at val BPB ${f(v.val_bpb, 4)}.`)}</p>`
      : `<p>${L('回到「取一个 batch」开始第 1 步。', 'Back to "Sample a batch" for step 1.')}</p>`);
  return station('next', L('下一步', 'Next step'), 'step + 1', body, '');
}

function render() {
  AFTER = []; UID = 0;
  for (const k in TIPS) delete TIPS[k];
  renderStatic(); renderKPI(); renderSlots(); renderCmp(); renderInfo(); renderTokbar();
  const c = cur().cfg;
  document.getElementById('route').innerHTML = [
    guide(),
    stTok(), edge(L('token 编号 · 提前存成 train.bin', 'token ids · stored ahead of time in train.bin')),
    stData(), edge(L(`x ${shp('B', 'T')} 进模型，y 留到算损失时再用`, `x ${shp('B', 'T')} goes into the model; y waits for the loss`)),
    stEmb(), edge(`${L('黑板（残差流）', 'blackboard (residual stream)')} x ${shp('B', 'T', 'D')}`),
    stBlocks(), edge(L(`放大 Block ${S.layer + 1} 看里面`, `zoom into block ${S.layer + 1}`)),
    stBlock(), edge(L(`第 ${c.n_layer} 层之后的黑板 ${shp('B', 'T', 'D')}`, `blackboard after layer ${c.n_layer} ${shp('B', 'T', 'D')}`)),
    stHead(), edge(L(`每个位置 ${c.vocab_size} 个打分 ${shp('B', 'T', 'V')}`, `${c.vocab_size} scores per position ${shp('B', 'T', 'V')}`)),
    stLoss(), edge(L('loss（一个数）', 'loss (one number)')),
    stBack(), edge(L('梯度（和参数一样的形状）', 'gradients (same shapes as the parameters)')),
    stOpt(), edge(L('改过的参数', 'updated parameters')),
    stSched(), edge('↺'),
    stNext(),
  ].join('');
  AFTER.forEach(fn => fn());
}

function induction() {
  const v = cur(), i = S.pos, prevSame = i > 0 ? INP.lastIndexOf(INP[i], i - 1) : -1;
  if (prevSame < 0) return;
  let best = [S.layer, S.head, -1];
  v.trace.layers.forEach((x, l) => { const a = probsOf(x); for (let h = 0; h < v.cfg.n_head; h++) { const p = a[(h * T + i) * T + prevSame + 1]; if (p > best[2]) best = [l, h, p]; } });
  S.layer = best[0]; S.head = best[1];
}

document.addEventListener('click', e => {
  const t = e.target.closest('.term');
  if (t) return termTip(t, e);  // a tap on a phone shows the explanation
  const cv = e.target.closest('.heat canvas, .bigatt canvas');
  if (cv) {  // every row of these pictures is a token: clicking one tracks it
    const r = cv.getBoundingClientRect(), row = Math.floor((e.clientY - r.top) / r.height * T);
    if (row >= 0 && row < T && row !== S.pos) { S.pos = row; render(); }
    return;
  }
  const b = e.target.closest('[data-go],[data-pos],[data-layer],[data-head],[data-big],[data-mat],[data-lang],[data-hints],#play');
  if (!b) return tip(null);
  if (b.id === 'play') return play();
  if (b.dataset.go != null) return go(+b.dataset.go);
  if (b.dataset.lang != null) { S.lang = b.dataset.lang; store('lang', S.lang); }
  if (b.dataset.hints != null) { S.hints = b.dataset.hints === '1'; store('hints', S.hints ? '1' : '0'); }
  if (b.dataset.pos != null) S.pos = +b.dataset.pos;
  if (b.dataset.layer != null) S.layer = +b.dataset.layer;
  if (b.dataset.head != null) S.head = Math.min(+b.dataset.head, cur().cfg.n_head - 1);
  if (b.dataset.big != null) S.big = b.dataset.big === '1';
  if (b.dataset.mat != null) S.mat = b.dataset.mat;
  render();
});
// charts inside a folded <details> have no width yet: draw again once it opens
document.addEventListener('toggle', e => {
  const k = e.target.dataset && e.target.dataset.k;
  if (k && !!S.open[k] !== e.target.open) { S.open[k] = e.target.open; render(); }
}, true);
let timer = null;
function play() {
  clearTimeout(timer);
  const sts = [...document.querySelectorAll('.st')], smooth = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stepTo = i => {
    sts.forEach(s => s.classList.remove('go'));
    if (i >= sts.length) return;
    sts[i].classList.add('go');
    sts[i].scrollIntoView({block: 'start', behavior: smooth ? 'smooth' : 'auto'});
    timer = setTimeout(() => stepTo(i + 1), 1100);
  };
  stepTo(0);
}
let rt = null;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 150); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);

const fromHash = V.findIndex(v => v.run === decodeURIComponent(location.hash.slice(1)));
if (fromHash >= 0) S.v = fromHash;
induction();
render();
}
</script>
</body>
</html>
