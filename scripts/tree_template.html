  pills.forEach((pl, i) => {
    const w = widths[i];
    const pg = elNS("g", { class: "leaf-pill", transform: `translate(${cx}, ${y})` });
    pg.appendChild(elNS("rect", {
      x: 0, y: 0, width: w, height: 16, rx: 8,
      fill: pl.ok ? "#1f1b15" : "#161411",
      stroke: pl.ok ? pl.fg : "#342d23",
      "stroke-width": 0.75, opacity: pl.ok ? 0.92 : 0.55,
    }));
    pg.appendChild(elNS("text", {
      x: w / 2, y: 11.2, "text-anchor": "middle",
      "font-size": 9, "font-weight": 400, fill: pl.fg, "font-family": "var(--mono)",
    }, pl.label));
    pg.addEventListener("click", (ev) => {
      ev.stopPropagation();
      selectNode(n.id, pl.tab);
    });
    g.appendChild(pg);
    cx += w + 4;
  });
}

function drawDeltaTag(g, n, x, y) {
  const L = t();
  let text = "", bg = "#f2f1ec", fg = "#6d6b65";
  if (n.is_placeholder) {
    text = L.placeholderCardTag; bg = "#f2eefc"; fg = "#6250d6";
  } else if (n.delta_bpb != null) {
    text = fmtDelta(n.delta_bpb);
    if (n.in_noise) { bg = "#f0efe9"; fg = "#7a7872"; text += " " + L.deltaNoiseShort; }
    else if (n.delta_bpb < 0) { bg = "#e6f7ef"; fg = "#0e7a53"; }
    else { bg = "#fdeeee"; fg = "#c73534"; }
  } else if (n.compare_to && DATA.nodes[n.compare_to]?.is_placeholder) {
    text = L.placeholderRefPending; bg = "#f2f1ec"; fg = "#7a7872";
  } else if (n.status === "adopted" && n.parent === DATA.meta.root_id && DATA.nodes[DATA.meta.root_id]?.cross_compare) {
    text = L.deltaSeeArc; bg = "#eef5fd"; fg = "#2a78d6";
  } else if (n.compare_to == null && n.status !== "root") {
    text = L.deltaStandalone; bg = "#f2f1ec"; fg = "#7a7872";
  }
  if (!text) return;
  const w = Math.max(60, Math.round(text.length * 7.1 + 14));
  g.appendChild(elNS("rect", { x, y, width: w, height: 18, rx: 9, fill: bg }));
  g.appendChild(elNS("text", {
    x: x + w / 2, y: y + 12.5, "text-anchor": "middle",
    "font-size": 10.5, "font-weight": 700, fill: fg, "font-family": "var(--mono)",
  }, text));
}

function drawLeafPills(g, n, startX, y) {
  const a = n.artifacts;
  const hasT2 = n.bench && n.bench.tier === "tier2";
  const hasBench = Boolean(n.bench);
  const pills = [
    {
      label: a.ckpt_exists ? "ckpt" : "no-ckpt",
      ok: a.ckpt_exists,
      tab: "artifacts",
      bg: a.ckpt_exists ? "#edf5ef" : "#f4f3ee",
      fg: a.ckpt_exists ? "#1c6b48" : "#9c9a92",
    },
    {
      label: hasT2 ? "T2" : (hasBench ? "T1" : "no-eval"),
      ok: hasBench,
      tab: "bench",
      bg: hasT2 ? "#eaf2fc" : (hasBench ? "#f0f4fa" : "#f4f3ee"),
      fg: hasT2 ? "#1f5fb0" : (hasBench ? "#4a6fa0" : "#9c9a92"),
    },
    {
      label: "samples",
      ok: a.samples_exists,
      tab: "artifacts",
      bg: a.samples_exists ? "#f5f0fb" : "#f4f3ee",
      fg: a.samples_exists ? "#5b44b8" : "#9c9a92",
    },
  ];
  let cx = startX;
  for (const pl of pills) {
    const w = Math.max(32, Math.round(pl.label.length * 6.4 + 18));
    const pg = elNS("g", { class: "leaf-pill", transform: `translate(${cx}, ${y})` });
    pg.appendChild(elNS("rect", {
      x: 0, y: 0, width: w, height: 17, rx: 8.5, fill: pl.bg,
      stroke: pl.ok ? "rgba(0,0,0,0.06)" : "none",
    }));
    pg.appendChild(elNS("circle", {
      cx: 7, cy: 8.5, r: 2.4, fill: pl.ok ? pl.fg : "#c7c5bc",
    }));
    pg.appendChild(elNS("text", {
      x: 13, y: 12, "font-size": 10, "font-weight": 600, fill: pl.fg, "font-family": "var(--mono)",
    }, pl.label));
    pg.addEventListener("click", (ev) => {
      ev.stopPropagation();
      selectNode(n.id, pl.tab);
    });
    g.appendChild(pg);
    cx += w + 5;
  }
}

function selectNode(id, tab = null) {
  if (!DATA.nodes[id]) return;
  state.selectedRefId = null;
  state.selectedId = id;
  if (tab) state.activeTab = tab;
  let cur = DATA.nodes[id].parent;
  while (cur) {
    if (state.collapsed[cur]) state.collapsed[cur] = false;
    cur = DATA.nodes[cur].parent;
  }
  renderTree();
  renderDrawer();
}

function selectRef(rid) {
  if (!DATA.refs || !DATA.refs[rid]) return;
  state.selectedRefId = rid;
  if (!state.showRefs) {
    state.showRefs = true;
    renderChrome();
  }
  renderTree();
  renderDrawer();
}

function clearSelection() {
  if (state.selectedId === null && state.selectedRefId === null) return;
  state.selectedId = null;
  state.selectedRefId = null;
  renderTree();
  renderDrawer();
}

function renderOverviewDrawer() {
  const L = t();
  document.getElementById("d-badges").innerHTML = `<span class="badge badge-branch">${esc(L.badgeOverview)}</span>`;
  document.getElementById("d-title").textContent = L.overviewTitle;
  document.getElementById("d-runid").innerHTML = `<span>${esc(L.overviewSubtitle)}</span>`;
  document.getElementById("d-tabs").style.display = "none";

  const head = DATA.nodes[DATA.meta.head_id];
  const trunkRows = (DATA.meta.trunk || []).map(tid => {
    const tn = DATA.nodes[tid];
    if (!tn) return "";
    const bpb = tn.is_placeholder && tn.val_bpb != null ? `~${fmtBpb(tn.val_bpb)}` : fmtBpb(tn.val_bpb);
    const delta = tn.delta_bpb != null ? fmtDelta(tn.delta_bpb) : (tn.is_placeholder ? L.placeholderShort : "—");
    return `<tr>
      <td><button class="link-btn" data-jump="${esc(tid)}">${esc(nodeLabel(tn))}</button></td>
      <td style="font-family:var(--mono)">${esc(bpb)}</td>
      <td style="font-family:var(--mono)">${esc(delta)}</td>
    </tr>`;
  }).join("");

  const body = document.getElementById("d-body");
  body.innerHTML = `
    <div class="takeaway-box branch">${esc(L.overviewHint)}</div>
    <div class="kpi-grid">
      <div class="kpi">
        <div class="kpi-label">${esc(L.overviewKpiHead)}</div>
        <div class="kpi-val">${fmtBpb(head?.val_bpb)}</div>
        <div class="kpi-sub">${head ? `<button class="link-btn" data-jump="${esc(head.id)}">${esc(nodeLabel(head))}</button>` : "—"}</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">${esc(L.overviewKpiRuns)}</div>
        <div class="kpi-val">${DATA.meta.total_runs}</div>
        <div class="kpi-sub">${esc(L.overviewKpiNoise)}: ±${DATA.meta.noise_floor}</div>
      </div>
    </div>
    <div class="section-h">${esc(L.overviewTrunkSection)}</div>
    <table class="data"><thead><tr><th>${L.thNode}</th><th>val BPB</th><th>ΔBPB</th></tr></thead><tbody>${trunkRows}</tbody></table>`;

  body.querySelectorAll("[data-jump]").forEach(el => {
    el.addEventListener("click", () => selectNode(el.dataset.jump));
  });
}

function renderRefDrawer(r) {
  const L = t();
  document.getElementById("d-badges").innerHTML = `<span class="badge badge-ref">📚 ${esc(refKindLabel(r.kind))}</span>`;
  document.getElementById("d-title").textContent = pick(r, "label") || r.id;
  document.getElementById("d-runid").innerHTML = `<span>${esc(r.authors || r.id)}</span>`;
  document.getElementById("d-tabs").style.display = "none";

  const parts = [];
  const summary = pick(r, "summary");
  if (summary) parts.push(`<div class="ref-summary-box">${esc(summary)}</div>`);

  if (r.links && r.links.length) {
    const linksHtml = r.links.map(lk => `
      <a class="ext-link" href="${esc(lk.url)}" target="_blank" rel="noopener noreferrer">
        <span>${esc(lk.label)}</span><span>↗</span>
      </a>`).join("");
    parts.push(`<div class="section-h">${esc(L.sectionRefLinks)}</div><div class="ext-link-list">${linksHtml}</div>`);
  }

  if (r.used_by && r.used_by.length) {
    const items = r.used_by.map(u => {
      const reason = pick(u, "reason");
      const bpb = u.val_bpb != null ? ` · val BPB ${fmtBpb(u.val_bpb)}` : "";
      return `<div class="ref-item">
        → <button class="link-btn" data-jump="${esc(u.id)}">${esc(pick(u, "label") || u.id)}</button><span style="font-family:var(--mono);font-size:11px;color:var(--muted)">${bpb}</span>
        ${reason ? `<span class="reason">${esc(reason)}</span>` : ""}
      </div>`;
    }).join("");
    parts.push(`<div class="section-h">${esc(L.sectionRefUsedBy)}</div><div class="inspire-list">${items}</div>`);
  }

  const body = document.getElementById("d-body");
  body.innerHTML = parts.join("");
  body.querySelectorAll("[data-jump]").forEach(el => {
    el.addEventListener("click", () => selectNode(el.dataset.jump));
  });
  body.querySelectorAll("[data-ref]").forEach(el => {
    el.addEventListener("click", () => selectRef(el.dataset.ref));
  });
}

function renderDrawer() {
  if (state.selectedRefId && DATA.refs && DATA.refs[state.selectedRefId]) {
    renderRefDrawer(DATA.refs[state.selectedRefId]);
    return;
  }
  const n = state.selectedId ? DATA.nodes[state.selectedId] : null;
  if (!n) {
    renderOverviewDrawer();
    return;
  }
  document.getElementById("d-tabs").style.display = "flex";
  const L = t();

  const badges = [];
  if (n.status === "root") badges.push(`<span class="badge badge-root">${L.badgeRoot}</span>`);
  else if (n.is_head) badges.push(`<span class="badge badge-adopted">${L.badgeHead}</span>`);
  else if (n.status === "adopted") badges.push(`<span class="badge badge-adopted">${L.badgeAdopted}</span>`);
  else if (n.is_group) badges.push(`<span class="badge badge-group">${L.badgeGroup}</span>`);
  else if (n.status === "rejected") badges.push(`<span class="badge badge-rejected">${L.badgeRejected}</span>`);
  else badges.push(`<span class="badge badge-branch">${L.badgeBranch}</span>`);
  const ms = nodeMilestone(n);
  if (ms) badges.push(`<span class="badge badge-milestone">★ ${esc(ms)}</span>`);
  if (n.is_placeholder) badges.push(`<span class="badge badge-placeholder">${L.badgePlaceholder}</span>`);
  document.getElementById("d-badges").innerHTML = badges.join("");
  document.getElementById("d-title").textContent = nodeLabel(n);
  document.getElementById("d-runid").innerHTML = n.is_group
    ? `<span>${L.groupCountSubtitle(n.group_stats?.count || 0)}</span>`
    : n.is_placeholder
      ? `<span>${L.placeholderRunId}</span>`
      : `<span>${esc(n.run_id)}</span>${n.date ? `<span>· ${esc(n.date)}</span>` : ""}${n.git_sha ? `<span>· ${esc(n.git_sha)}</span>` : ""}`;

  document.querySelectorAll("#d-tabs .tab").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.tab === state.activeTab);
  });

  const body = document.getElementById("d-body");
  if (state.activeTab === "overview") body.innerHTML = renderOverviewTab(n);
  else if (state.activeTab === "bench") body.innerHTML = renderBenchTab(n);
  else if (state.activeTab === "curve") body.innerHTML = renderCurveTab(n);
  else body.innerHTML = renderArtifactsTab(n);

  body.querySelectorAll("[data-jump]").forEach(el => {
    el.addEventListener("click", () => selectNode(el.dataset.jump));
  });
  body.querySelectorAll("[data-ref]").forEach(el => {
    el.addEventListener("click", () => selectRef(el.dataset.ref));
  });
  const sel = body.querySelector("#sample-select");
  if (sel) {
    sel.addEventListener("change", () => { state.sampleIdx = Number(sel.value); renderDrawer(); });
  }
  const cmpChk = body.querySelector("#sample-cmp-chk");
  if (cmpChk) {
    cmpChk.addEventListener("change", () => { state.compareSamples = cmpChk.checked; renderDrawer(); });
  }
}

function renderInspirationBlocks(n) {
  const L = t();
  const out = [];
  if (n.inspired_by && n.inspired_by.length) {
    const items = n.inspired_by.map(x => {
      const r = pick(x, "reason");
      return `<div class="inspire-item">← <button class="link-btn" data-jump="${esc(x.id)}">${esc(pick(x, "label") || x.id)}</button>${r ? `<span class="reason">${esc(r)}</span>` : ""}</div>`;
    }).join("");
    out.push(`<div class="section-h">${esc(L.sectionInspiredBy)}</div><div class="inspire-list">${items}</div>`);
  }
  if (n.inspired && n.inspired.length) {
    const items = n.inspired.map(x => {
      const r = pick(x, "reason");
      return `<div class="inspire-item">→ <button class="link-btn" data-jump="${esc(x.id)}">${esc(pick(x, "label") || x.id)}</button>${r ? `<span class="reason">${esc(r)}</span>` : ""}</div>`;
    }).join("");
    out.push(`<div class="section-h">${esc(L.sectionInspired)}</div><div class="inspire-list">${items}</div>`);
  }
  if (n.refs && n.refs.length) {
    const items = n.refs.map(x => {
      const r = pick(x, "reason");
      const ext = x.primary_url
        ? `<a class="ext-mini" href="${esc(x.primary_url)}" target="_blank" rel="noopener noreferrer">${esc(L.refOpenPaper)}</a>`
        : "";
      return `<div class="ref-item">📚 <button class="link-btn" style="color:var(--teal-dark)" data-ref="${esc(x.id)}">${esc(pick(x, "label") || x.id)}</button>${ext}${r ? `<span class="reason">${esc(r)}</span>` : ""}</div>`;
    }).join("");
    out.push(`<div class="section-h">${esc(L.sectionExternalRefs)}</div><div class="inspire-list">${items}</div>`);
  }
  return out.join("");
}

function renderOverviewTab(n) {
  const L = t();
  const parts = [];
  const takeaway = nodeTakeaway(n);
  if (takeaway) {
    const cls = n.status === "root" ? "root" : (n.status === "adopted" ? "" : "branch");
    parts.push(`<div class="takeaway-box ${cls}">${esc(takeaway)}</div>`);
  }
  const protocol = nodeProtocol(n);
  if (protocol) {
    parts.push(`<div class="protocol-box"><strong>${L.protocolPrefix}</strong>${esc(protocol)}</div>`);
  }

  if (n.is_group) {
    const gs = n.group_stats || {};
    const bestLbl = (state.lang === "en" && gs.best_label_en) ? gs.best_label_en : gs.best_label;
    parts.push(`<div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">${L.kpiSubRuns}</div><div class="kpi-val">${gs.count || 0}</div></div>
      <div class="kpi"><div class="kpi-label">${L.kpiBestInGroup}</div><div class="kpi-val">${fmtBpb(gs.best_bpb)}</div>
        <div class="kpi-sub">${gs.best_id ? `<button class="link-btn" data-jump="${esc(gs.best_id)}">${esc(bestLbl)}</button>` : "—"}</div>
      </div>
    </div>`);
    const rows = collectDescRuns(n.id).map(r => `
      <tr>
        <td><button class="link-btn" data-jump="${esc(r.id)}">${esc(nodeLabel(r))}</button></td>
        <td>${fmtBpb(r.val_bpb)}</td>
        <td>${r.delta_bpb != null ? fmtDelta(r.delta_bpb) : "—"}</td>
      </tr>`).join("");
    parts.push(`<div class="section-h">${L.sectionIncludedRuns}</div><table class="data"><thead><tr><th>${L.thNode}</th><th>val BPB</th><th>ΔBPB</th></tr></thead><tbody>${rows}</tbody></table>`);
    parts.push(renderInspirationBlocks(n));
    return parts.join("");
  }

  const ref = n.compare_to ? DATA.nodes[n.compare_to] : null;
  let deltaCls = "delta-noise", deltaSub = L.noDirectRef;
  if (ref && n.delta_bpb != null) {
    deltaCls = n.in_noise ? "delta-noise" : (n.delta_bpb < 0 ? "delta-good" : "delta-bad");
    const verdict = n.in_noise
      ? L.verdictNoise(DATA.meta.noise_floor)
      : (n.delta_bpb < 0 ? L.verdictBetter : L.verdictWorse);
    deltaSub = `${verdict} · vs <button class="link-btn" data-jump="${esc(ref.id)}">${esc(nodeLabel(ref))}</button>`;
  } else if (ref && ref.is_placeholder) {
    deltaSub = `${L.placeholderDeltaSub} · vs <button class="link-btn" data-jump="${esc(ref.id)}">${esc(nodeLabel(ref))}</button>`;
  } else if (n.compare_to == null && n.parent) {
    deltaSub = L.noSubtractCross;
  }

  const speedText = n.tok_per_s ? `${(n.tok_per_s / 1000).toFixed(1)}k tok/s` : "—";
  const mfuText = n.mfu != null ? `MFU ${(n.mfu * 100).toFixed(1)}%` : "";

  const tokLabel = n.token_offset_m > 0
    ? L.tokensWithOffset(n.tokens || "—", Math.round(n.token_offset_m))
    : `${n.tokens || "—"} tokens`;
  const valKpiMain = n.is_placeholder && n.val_bpb != null ? `~${fmtBpb(n.val_bpb)}` : fmtBpb(n.val_bpb);
  const valKpiSub = n.is_placeholder
    ? `${L.placeholderValSub}${n.tokens ? " · " + n.tokens + " tokens" : ""}`
    : `${tokLabel} · ${n.wall_h != null ? n.wall_h + " h" : "—"}`;

  parts.push(`<div class="kpi-grid">
    <div class="kpi">
      <div class="kpi-label">${L.kpiValBpb}</div>
      <div class="kpi-val">${valKpiMain}</div>
      <div class="kpi-sub">${esc(valKpiSub)}</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">${L.kpiDeltaBpb}</div>
      <div class="kpi-val ${deltaCls}">${fmtDelta(n.delta_bpb)}</div>
      <div class="kpi-sub">${deltaSub}</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">${L.kpiParamsSpeed}</div>
      <div class="kpi-val" style="font-size:15px">${esc(n.params || "—")}</div>
      <div class="kpi-sub">${speedText}${mfuText ? " · " + mfuText : ""}</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">${L.kpiCoreAvg}</div>
      <div class="kpi-val" style="font-size:15px">${n.bench?.core != null ? (n.bench.core >= 0 ? "+" : "") + n.bench.core.toFixed(4) : "—"}</div>
      <div class="kpi-sub">${n.bench ? (n.bench.tier === "tier2" ? L.tier2Label : L.defaultBenchLabel) : L.noBenchShort}</div>
    </div>
  </div>`);

  if (ref) {
    parts.push(`<div class="section-h">${L.sectionDiff(esc(ref.id))}</div>`);
    if (n.config_diff && n.config_diff.length) {
      const rows = n.config_diff.map(d => `
        <tr>
          <td>${esc(pick(d, "label"))}</td>
          <td style="text-align:right"><span class="diff-old">${esc(d.from)}</span> → <span class="diff-new">${esc(d.to)}</span></td>
        </tr>`).join("");
      parts.push(`<table class="data"><tbody>${rows}</tbody></table>`);
    } else {
      parts.push(`<div class="note-small">${L.noConfigDiff}</div>`);
    }
  }

  if (n.compared_by && n.compared_by.length) {
    const items = n.compared_by.map(c => {
      const d = c.delta_from_other;
      const cls = d == null ? "" : (Math.abs(d) < DATA.meta.noise_floor ? "delta-noise" : (d < 0 ? "delta-good" : "delta-bad"));
      return `<tr>
        <td><button class="link-btn" data-jump="${esc(c.id)}">${esc(pick(c, "label") || c.id)}</button></td>
        <td class="${cls}" style="font-family:var(--mono);font-weight:600">${fmtDelta(d)}</td>
      </tr>`;
    }).join("");
    parts.push(`<div class="section-h">${L.sectionComparedBy}</div>
      <table class="data"><thead><tr><th>${L.thOther}</th><th>${L.thThisDelta}</th></tr></thead><tbody>${items}</tbody></table>`);
  }

  parts.push(renderInspirationBlocks(n));

  if (!n.is_placeholder) {
    const cfg = n.config || {};
    parts.push(`<div class="section-h">${L.sectionRunMeta}</div>
      <dl class="meta-list">
        <dt>${L.metaChange}</dt><dd>${esc(n.change || "—")}</dd>
        <dt>${L.metaShape}</dt><dd>${esc(cfg.arch || "—")} · L${cfg.n_layer ?? "?"} d${cfg.d_model ?? "?"} h${cfg.n_head ?? "?"}/${cfg.n_kv_head ?? "?"} ff${cfg.d_ff ?? "?"}</dd>
        <dt>${L.metaRecipe}</dt><dd>${esc(cfg.schedule || "—")} · bs ${cfg.batch_tokens ?? "?"} · lr ${cfg.lr ?? "?"} · wu ${cfg.warmup_steps ?? "?"} · seed ${cfg.seed ?? "?"}</dd>
        <dt>${L.metaDataGit}</dt><dd>${esc(cfg.data || "—")} · ${esc(n.date || "—")} · ${esc(n.git_sha || "—")}</dd>
      </dl>`);
  }
  return parts.join("");
}

function renderBenchTab(n) {
  const L = t();
  if (n.is_group) return `<div class="empty-state">${L.benchGroupEmpty}</div>`;
  if (n.is_placeholder) return `<div class="empty-state">${L.placeholderEmpty}</div>`;
  if (!n.bench) return `<div class="empty-state">${L.benchEmpty}</div>`;

  const ref = n.compare_to ? DATA.nodes[n.compare_to] : null;
  const refScores = ref?.bench?.scores || {};
  const pairedMap = {};
  for (const r of (n.paired_bench || [])) pairedMap[r.task] = r;

  const rows = DATA.meta.bench_tasks.map(tKey => {
    const val = n.bench.scores[tKey];
    if (val == null && refScores[tKey] == null) return "";
    const rval = refScores[tKey];
    const pr = pairedMap[tKey];
    let diffHtml = "—";
    if (pr) {
      const pp = (pr.d_acc * 100).toFixed(2);
      const cls = pr.p_acc != null && pr.p_acc < 0.05 ? (pr.d_acc > 0 ? "delta-good" : "delta-bad") : "delta-noise";
      diffHtml = `<span class="${cls}">${pr.d_acc >= 0 ? "+" : ""}${pp} pp</span><br><span style="font-size:10.5px;color:var(--muted)">p=${fmtP(pr.p_acc)}</span>`;
    } else if (val != null && rval != null) {
      const pp = ((val - rval) * 100).toFixed(2);
      diffHtml = `${val >= rval ? "+" : ""}${pp} pp`;
    }
    let probHtml = "—";
    if (pr) {
      const cls = pr.p_prob != null && pr.p_prob < 0.05 ? (pr.d_prob > 0 ? "delta-good" : "delta-bad") : "delta-noise";
      probHtml = `<span class="${cls}">${pr.d_prob >= 0 ? "+" : ""}${pr.d_prob.toFixed(4)}</span><br><span style="font-size:10.5px;color:var(--muted)">p=${fmtP(pr.p_prob)}</span>`;
    }
    const star = pr?.short_answer ? " *" : "";
    return `<tr>
      <td>${TASK_LABELS[tKey] || tKey}${star}<br><span style="font-size:10.5px;color:var(--muted)">${L.chanceFmt((CHANCE[tKey]*100).toFixed(0))}</span></td>
      <td><strong>${fmtPct(val)}</strong></td>
      <td>${diffHtml}</td>
      <td>${probHtml}</td>
    </tr>`;
  }).filter(Boolean).join("");

  const coreRef = ref?.bench?.core;
  const coreDelta = (n.bench.core != null && coreRef != null) ? (n.bench.core - coreRef) : null;
  let html = `<div class="kpi-grid">
    <div class="kpi">
      <div class="kpi-label">${L.kpiCoreTitle}</div>
      <div class="kpi-val">${n.bench.core != null ? (n.bench.core >= 0 ? "+" : "") + n.bench.core.toFixed(4) : "—"}</div>
      <div class="kpi-sub">${L.kpiCoreSub}</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">${L.kpiDeltaCore}</div>
      <div class="kpi-val ${coreDelta == null ? "" : (coreDelta >= 0 ? "delta-good" : "delta-bad")}">${coreDelta == null ? "—" : (coreDelta >= 0 ? "+" : "") + coreDelta.toFixed(4)}</div>
      <div class="kpi-sub">${ref ? `vs ${esc(nodeLabel(ref))}` : L.noRefShort}</div>
    </div>
  </div>
  <table class="data">
    <thead><tr><th>${L.thTask}</th><th>${L.thScore}</th><th>${L.thDeltaAcc}</th><th>${L.thDeltaProb}</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;

  if (n.paired_bench && n.paired_bench.length) {
    html += `<div class="note-small">${L.benchPairedNote}</div>`;
  } else if (ref) {
    html += `<div class="note-small">${L.benchUnpairedNote}</div>`;
  }
  return html;
}

const SERIES_COLORS = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"];

function renderScalingChart(sc) {
  const L = t();
  const CT = chartTheme();
  const pts = sc.points || [];
  if (!pts.length) return `<div class="empty-state">${L.curveGroupEmpty}</div>`;

  const lrs = sc.lrs || [];
  const bestSet = new Set(sc.best_ids || []);
  const lrColor = lr => CT.series[Math.max(0, lrs.indexOf(lr)) % CT.series.length];
  const fmtLr = lr => lr.toExponential(0).replace("e-0", "e-");

  const logCs = pts.map(p => Math.log10(p.compute));
  const logYs = pts.map(p => Math.log10(p.bpb));
  const minX = Math.min(...logCs) - 0.16;
  const maxX = Math.max(...logCs) + 0.16;
  const minY = Math.min(...logYs) - 0.025;
  const maxY = Math.max(...logYs) + 0.032;

  const W = 388, H = 248, ML = 46, MR = 16, MT = 24, MB = 34;
  const pw = W - ML - MR, ph = H - MT - MB;
  const sx = lc => ML + ((lc - minX) / (maxX - minX)) * pw;
  const sy = ly => MT + (1 - (ly - minY) / (maxY - minY)) * ph;

  let grid = "";
  const bpbTicks = [1.1, 1.2, 1.3, 1.4, 1.5, 1.6].filter(v => {
    const lv = Math.log10(v);
    return lv >= minY - 0.005 && lv <= maxY + 0.005;
  });
  for (const yv of bpbTicks) {
    const yp = sy(Math.log10(yv)).toFixed(1);
    grid += `<line x1="${ML}" y1="${yp}" x2="${W - MR}" y2="${yp}" stroke="${CT.grid}" stroke-width="1"/>`;
    grid += `<text x="${ML - 6}" y="${Number(yp) + 3}" text-anchor="end" font-size="10" fill="${CT.tick}" font-family="var(--mono)">${yv.toFixed(1)}</text>`;
  }
  const minExp = Math.ceil(minX), maxExp = Math.floor(maxX);
  for (let e = minExp; e <= maxExp; e++) {
    const xp = sx(e).toFixed(1);
    grid += `<line x1="${xp}" y1="${MT}" x2="${xp}" y2="${H - MB}" stroke="${CT.gridSub}" stroke-width="1"/>`;
    grid += `<text x="${xp}" y="${H - 14}" text-anchor="middle" font-size="10" fill="${CT.tick}" font-family="var(--mono)">10^${e}</text>`;
  }

  let fitSvg = "";
  if (sc.fit) {
    const x0 = Math.pow(10, minX + 0.04), x1 = Math.pow(10, maxX - 0.04);
    const y0 = sc.fit.a * Math.pow(x0, -sc.fit.b);
    const y1 = sc.fit.a * Math.pow(x1, -sc.fit.b);
    fitSvg = `<line x1="${sx(Math.log10(x0)).toFixed(1)}" y1="${sy(Math.log10(y0)).toFixed(1)}" x2="${sx(Math.log10(x1)).toFixed(1)}" y2="${sy(Math.log10(y1)).toFixed(1)}" stroke="${CT.fit}" stroke-width="1.8" stroke-dasharray="5 4"/>`;
  }

  const bySize = new Map();
  for (const p of pts) {
    if (!bySize.has(p.params)) bySize.set(p.params, []);
    bySize.get(p.params).push(p);
  }
  let sizeLabels = "";
  const bestPts = [];
  for (const [, group] of [...bySize.entries()].sort((a, b) => a[0] - b[0])) {
    const top = group.reduce((a, b) => (a.bpb > b.bpb ? a : b));
    const best = group.reduce((a, b) => (a.bpb < b.bpb ? a : b));
    bestPts.push(best);
    const xp = sx(Math.log10(top.compute)).toFixed(1);
    const yp = Math.max(MT + 2, sy(Math.log10(top.bpb)) - 10).toFixed(1);
    sizeLabels += `<text x="${xp}" y="${yp}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${CT.fit}" font-family="var(--mono)">${top.params_m.toFixed(1)}M</text>`;
  }

  const bestLine = bestPts.length >= 2
    ? `<path d="${bestPts.map((p, i) => `${i === 0 ? "M" : "L"}${sx(Math.log10(p.compute)).toFixed(1)},${sy(Math.log10(p.bpb)).toFixed(1)}`).join(" ")}" fill="none" stroke="${CT.bestLine}" stroke-width="1.6" opacity="0.55"/>`
    : "";

  const dots = pts.map(p => {
    const cx = sx(Math.log10(p.compute)).toFixed(1);
    const cy = sy(Math.log10(p.bpb)).toFixed(1);
    const isBest = bestSet.has(p.id);
    const col = lrColor(p.lr);
    const tip = `${p.id}\n${p.params_m}M params · ${p.tokens_m}M tok\nlr ${fmtLr(p.lr)} · val BPB ${p.bpb.toFixed(4)}`;
    return `${isBest ? `<circle cx="${cx}" cy="${cy}" r="7.2" fill="none" stroke="${CT.bestRing}" stroke-width="1.3" opacity="0.7"/>` : ""}
      <circle cx="${cx}" cy="${cy}" r="${isBest ? 4.8 : 4.0}" fill="${col}" stroke="${CT.dotStroke}" stroke-width="1.5" style="cursor:pointer" data-jump="${esc(p.id)}"><title>${esc(tip)}</title></circle>`;
  }).join("");

  const legend = `<div class="curve-legend">
    ${lrs.map(lr => `<span><span class="curve-dot" style="background:${lrColor(lr)};height:8px;width:8px;border-radius:50%"></span>lr ${fmtLr(lr)}</span>`).join("")}
    ${sc.fit ? `<span><span class="curve-dot" style="background:${CT.fit}"></span>fit</span>` : ""}
  </div>`;

  const fitBanner = sc.fit
    ? `<div class="protocol-box" style="margin-bottom:10px"><strong>${esc(L.scalingFitLabel(sc.fit.a.toPrecision(3), sc.fit.b.toFixed(3), sc.fit.drop_per_2x_pct))}</strong></div>`
    : "";

  const headerCells = lrs.map(lr => `<th>${fmtLr(lr)}</th>`).join("");
  const tableRows = [...bySize.entries()].sort((a, b) => a[0] - b[0]).map(([, group]) => {
    const byLr = {};
    for (const p of group) byLr[p.lr] = p;
    const best = group.reduce((a, b) => (a.bpb < b.bpb ? a : b));
    const cells = lrs.map(lr => {
      const p = byLr[lr];
      if (!p) return `<td style="color:var(--muted)">—</td>`;
      const isBest = p.id === best.id;
      const cls = isBest ? 'style="font-weight:700;color:var(--green-dark)"' : "";
      return `<td><button class="link-btn" ${cls} data-jump="${esc(p.id)}">${p.bpb.toFixed(3)}</button></td>`;
    }).join("");
    return `<tr><td><strong>${best.params_m.toFixed(1)}M</strong></td>${cells}</tr>`;
  }).join("");

  return `${fitBanner}
  <div class="curve-wrap">
    <div style="font-size:12px;font-weight:600;color:var(--ink);margin-bottom:6px">${esc(L.scalingTitle)}</div>
    ${legend}
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      ${grid}
      <line x1="${ML}" y1="${MT}" x2="${ML}" y2="${H - MB}" stroke="${CT.axis}"/>
      <line x1="${ML}" y1="${H - MB}" x2="${W - MR}" y2="${H - MB}" stroke="${CT.axis}"/>
      ${fitSvg}${bestLine}${dots}${sizeLabels}
      <text x="${(ML + W - MR) / 2}" y="${H - 2}" text-anchor="middle" font-size="9.5" fill="${CT.tick}">${esc(L.scalingAxisX)}</text>
    </svg>
    <div class="note-small" style="margin-top:4px">${esc(L.scalingNote)}</div>
  </div>
  <div class="section-h">${esc(L.scalingTableTitle)}</div>
  <table class="data"><thead><tr><th>${esc(L.scalingThSize)}</th>${headerCells}</tr></thead><tbody>${tableRows}</tbody></table>`;
}

function renderGroupCurves(n) {
  const L = t();
  const CT = chartTheme();
  const runs = collectDescRuns(n.id).filter(r => (r.val_curve || []).some(p => p[0] > 0));
  if (!runs.length) return `<div class="empty-state">${L.curveGroupEmpty}</div>`;

  const shown = runs.slice(0, 8);
  const series = shown.map((r, idx) => ({
    run: r,
    color: CT.series[idx % CT.series.length],
    pts: r.val_curve.filter(p => p[0] > 0),
  }));
  const all = series.flatMap(s => s.pts);
  const maxX = Math.max(...all.map(p => p[0]), 1);
  const ys = all.map(p => p[1]);
  const rawMinY = Math.min(...ys), rawMaxY = Math.max(...ys);
  const padY = Math.max((rawMaxY - rawMinY) * 0.12, 0.02);
  const minY = rawMinY - padY, maxY = rawMaxY + padY;

  const W = 384, H = 224, ML = 44, MR = 16, MT = 14, MB = 30;
  const pw = W - ML - MR, ph = H - MT - MB;
  const sx = x => ML + (x / maxX) * pw;
  const sy = y => MT + (1 - (y - minY) / (maxY - minY)) * ph;
  const pathOf = pts => pts.map((p, i) => `${i === 0 ? "M" : "L"}${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join(" ");

  let grid = "";
  for (let i = 0; i <= 4; i++) {
    const yv = minY + (maxY - minY) * (i / 4);
    const yp = sy(yv).toFixed(1);
    grid += `<line x1="${ML}" y1="${yp}" x2="${W - MR}" y2="${yp}" stroke="${CT.grid}" stroke-width="1"/>`;
    grid += `<text x="${ML - 6}" y="${Number(yp) + 3}" text-anchor="end" font-size="10" fill="${CT.tick}" font-family="var(--mono)">${yv.toFixed(2)}</text>`;
  }
  for (let i = 0; i <= 4; i++) {
    const xv = maxX * (i / 4);
    grid += `<text x="${sx(xv).toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="10" fill="${CT.tick}" font-family="var(--mono)">${Math.round(xv)}M</text>`;
  }

  const lines = series.map(s =>
    `<path d="${pathOf(s.pts)}" fill="none" stroke="${s.color}" stroke-width="1.9"/>` +
    s.pts.map(p => `<circle cx="${sx(p[0]).toFixed(1)}" cy="${sy(p[1]).toFixed(1)}" r="2.4" fill="${s.color}"><title>${esc(s.run.id)} @ ${p[0]}M tok: ${p[1]}</title></circle>`).join("")
  ).join("");

  const legend = `<div class="curve-legend">${series.map(s =>
    `<span><span class="curve-dot" style="background:${s.color}"></span><button class="link-btn" style="color:inherit;text-decoration:none" data-jump="${esc(s.run.id)}">${esc(nodeLabel(s.run))} (${fmtBpb(s.run.val_bpb)})</button></span>`
  ).join("")}</div>`;

  return `<div class="curve-wrap">${legend}
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      ${grid}
      <line x1="${ML}" y1="${MT}" x2="${ML}" y2="${H - MB}" stroke="${CT.axis}"/>
      <line x1="${ML}" y1="${H - MB}" x2="${W - MR}" y2="${H - MB}" stroke="${CT.axis}"/>
      ${lines}
    </svg>
    <div class="note-small" style="margin-top:4px">${esc(L.curveGroupNote)}</div>
  </div>`;
}

function renderCurveTab(n) {
  const L = t();
  const CT = chartTheme();
  if (n.scaling_chart) return renderScalingChart(n.scaling_chart);
  if (n.is_group) return renderGroupCurves(n);
  if (n.is_placeholder) return `<div class="empty-state">${L.placeholderEmpty}</div>`;
  const curPts = (n.val_curve || []).filter(p => p[0] > 0);
  const ref = n.compare_to ? DATA.nodes[n.compare_to] : null;
  const refPts = ref ? (ref.val_curve || []).filter(p => p[0] > 0) : [];
  if (!curPts.length) return `<div class="empty-state">${L.curveEmpty}</div>`;

  const all = curPts.concat(refPts);
  const minX = 0, maxX = Math.max(...all.map(p => p[0]), 1);
  const ys = all.map(p => p[1]);
  const rawMinY = Math.min(...ys), rawMaxY = Math.max(...ys);
  const padY = Math.max((rawMaxY - rawMinY) * 0.12, 0.02);
  const minY = rawMinY - padY, maxY = rawMaxY + padY;

  const W = 384, H = 220, ML = 44, MR = 16, MT = 14, MB = 30;
  const pw = W - ML - MR, ph = H - MT - MB;
  const sx = x => ML + ((x - minX) / (maxX - minX)) * pw;
  const sy = y => MT + (1 - (y - minY) / (maxY - minY)) * ph;

  const pathOf = pts => pts.map((p, i) => `${i === 0 ? "M" : "L"}${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join(" ");

  let grid = "";
  for (let i = 0; i <= 4; i++) {
    const yv = minY + (maxY - minY) * (i / 4);
    const yp = sy(yv).toFixed(1);
    grid += `<line x1="${ML}" y1="${yp}" x2="${W - MR}" y2="${yp}" stroke="${CT.grid}" stroke-width="1"/>`;
    grid += `<text x="${ML - 6}" y="${Number(yp) + 3}" text-anchor="end" font-size="10" fill="${CT.tick}" font-family="var(--mono)">${yv.toFixed(2)}</text>`;
  }
  for (let i = 0; i <= 4; i++) {
    const xv = maxX * (i / 4);
    const xp = sx(xv).toFixed(1);
    grid += `<text x="${xp}" y="${H - 10}" text-anchor="middle" font-size="10" fill="${CT.tick}" font-family="var(--mono)">${Math.round(xv)}M</text>`;
  }

  const refSvg = refPts.length
    ? `<path d="${pathOf(refPts)}" fill="none" stroke="${CT.refLine}" stroke-width="1.8" stroke-dasharray="4 3"/>`
      + refPts.map(p => `<circle cx="${sx(p[0]).toFixed(1)}" cy="${sy(p[1]).toFixed(1)}" r="2.2" fill="${CT.refLine}"><title>${esc(ref.id)} @ ${p[0]}M tok: ${p[1]}</title></circle>`).join("")
    : "";
  const curSvg = `<path d="${pathOf(curPts)}" fill="none" stroke="${CT.curLine}" stroke-width="2.2"/>`
    + curPts.map(p => `<circle cx="${sx(p[0]).toFixed(1)}" cy="${sy(p[1]).toFixed(1)}" r="3" fill="${CT.curLine}"><title>${esc(n.id)} @ ${p[0]}M tok: ${p[1]}</title></circle>`).join("");

  const offsetM = n.token_offset_m || 0;
  const branchGuide = offsetM > 0
    ? `<line x1="${sx(offsetM).toFixed(1)}" y1="${MT}" x2="${sx(offsetM).toFixed(1)}" y2="${H - MB}" stroke="${CT.branchLine}" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
       <text x="${sx(offsetM).toFixed(1)}" y="${MT + 10}" text-anchor="middle" font-size="9.5" font-weight="600" fill="${CT.branchLine}">${esc(L.curveBranchMarker(Math.round(offsetM)))}</text>`
    : "";

  const legend = `<div class="curve-legend">
    <span><span class="curve-dot" style="background:${CT.curLine}"></span>${esc(n.id)} (${fmtBpb(n.val_bpb)})</span>
    ${refPts.length ? `<span><span class="curve-dot" style="background:${CT.refLine}"></span>${L.curveRefPrefix} ${esc(ref.id)} (${fmtBpb(ref.val_bpb)})</span>` : ""}
  </div>`;

  const stepRows = curPts.map(p => `<tr><td>${p[0]}M</td><td>${p[1].toFixed(4)}</td></tr>`).join("");
  const curveFootnote = offsetM > 0 ? L.curveBranchNote(Math.round(offsetM)) : L.curveNote;

  return `<div class="curve-wrap">${legend}
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      ${grid}
      ${branchGuide}
      <line x1="${ML}" y1="${MT}" x2="${ML}" y2="${H - MB}" stroke="${CT.axis}"/>
      <line x1="${ML}" y1="${H - MB}" x2="${W - MR}" y2="${H - MB}" stroke="${CT.axis}"/>
      ${refSvg}${curSvg}
    </svg>
    <div class="note-small" style="margin-top:4px">${esc(curveFootnote)}</div>
  </div>
  <div class="section-h">${L.sectionValPoints}</div>
  <table class="data"><thead><tr><th>Tokens</th><th>val BPB</th></tr></thead><tbody>${stepRows}</tbody></table>`;
}

function renderArtifactsTab(n) {
  const L = t();
  if (n.is_group) return `<div class="empty-state">${L.artifactsGroupEmpty}</div>`;
  if (n.is_placeholder) return `<div class="empty-state">${L.placeholderEmpty}</div>`;
  const a = n.artifacts || {};
  const parts = [`<div class="section-h">${L.sectionArtifacts}</div>`];
  parts.push(`<div class="artifact-row">
    <span class="artifact-path">${esc(a.ckpt_path || "—")}</span>
    <span class="artifact-status ${a.ckpt_exists ? "ok" : "miss"}">${a.ckpt_exists ? `✓ ${a.ckpt_mb} MB` : L.notFound}</span>
  </div>`);
  parts.push(`<div class="artifact-row">
    <span class="artifact-path">${esc(a.npz_path || "—")}</span>
    <span class="artifact-status ${a.npz_exists ? "ok" : "miss"}">${a.npz_exists ? L.npzOk : L.npzMiss}</span>
  </div>`);
  parts.push(`<div class="artifact-row">
    <span class="artifact-path">${esc(a.samples_path || "—")}</span>
    <span class="artifact-status ${a.samples_exists ? "ok" : "miss"}">${a.samples_exists ? `✓ step ${n.samples.step}` : L.samplesMiss}</span>
  </div>`);

  if (!a.samples_exists) return parts.join("");

  const items = n.samples.items;
  const idx = Math.min(state.sampleIdx, items.length - 1);
  const curItem = items[idx];
  const ref = n.compare_to ? DATA.nodes[n.compare_to] : null;
  const refItem = (ref && ref.samples && ref.samples.items[idx]) ? ref.samples.items[idx] : null;

  const opts = items.map((it, i) => `<option value="${i}" ${i === idx ? "selected" : ""}>#${i + 1} ${esc(trunc(it.prompt, 46))}</option>`).join("");
  parts.push(`<div class="section-h">${L.sectionSamples(n.samples.step)}</div>
    <div class="sample-controls">
      <select id="sample-select">${opts}</select>
      ${refItem ? `<label><input type="checkbox" id="sample-cmp-chk" ${state.compareSamples ? "checked" : ""}> ${esc(L.compareWith(nodeLabel(ref), ref.id))}</label>` : ""}
    </div>`);

  parts.push(`<div class="sample-card">
    <div class="sample-card-head"><span>${esc(n.id)}</span><span>val BPB ${fmtBpb(n.val_bpb)}</span></div>
    <span class="sample-prompt">${esc(curItem.prompt)}</span>${esc(curItem.text)}
  </div>`);

  if (refItem && state.compareSamples) {
    parts.push(`<div class="sample-card sample-ref">
      <div class="sample-card-head"><span>${esc(L.sampleRefHead(ref.id))}</span><span>val BPB ${fmtBpb(ref.val_bpb)}</span></div>
      <span class="sample-prompt">${esc(refItem.prompt)}</span>${esc(refItem.text)}
    </div>`);
  }
  return parts.join("");
}

function collectDescRuns(id) {
  const out = [];
  for (const cid of (DATA.nodes[id]?.children || [])) {
    const c = DATA.nodes[cid];
    if (c.is_group) out.push(...collectDescRuns(cid));
    else out.push(c);
  }
  return out;
}

function applyTransform() {
  const vp = document.getElementById("viewport");
  vp.setAttribute("transform", `translate(${state.pan.x}, ${state.pan.y}) scale(${state.pan.scale})`);
}

function fitToView() {
  const wrap = document.getElementById("canvas-wrap");
  const pts = Object.values(state.layout).concat(Object.values(state.refLayout || {}));
  if (!pts.length) return;
  const padL = isSephiroth() ? 140 : 24;
  const padR = isSephiroth() ? 140 : 140;
  const minX = Math.min(...pts.map(p => p.x)) - padL;
  const maxX = Math.max(...pts.map(p => p.x + p.w)) + padR;
  const minY = Math.min(...pts.map(p => p.y)) - 34;
  const maxY = Math.max(...pts.map(p => p.y + p.h)) + 44;
  const cw = wrap.clientWidth, ch = wrap.clientHeight;
  const scale = Math.min(1.05, Math.max(0.28, Math.min(cw / (maxX - minX), ch / (maxY - minY))));
  state.pan.scale = scale;
  state.pan.x = (cw - (maxX - minX) * scale) / 2 - minX * scale;
  state.pan.y = (ch - (maxY - minY) * scale) / 2 - minY * scale;
  applyTransform();
}

function applySkinAttr() {
  if (isSephiroth()) document.documentElement.dataset.skin = "sephiroth";
  else delete document.documentElement.dataset.skin;
}

function renderChrome() {
  applySkinAttr();
  const L = t();
  document.documentElement.lang = L.htmlLang;
  const title = pick(DATA.meta, "title");
  document.title = title;
  document.getElementById("page-title").textContent = title;
  document.getElementById("page-subtitle").textContent = pick(DATA.meta, "subtitle");

  const root = DATA.nodes[DATA.meta.root_id];
  const head = DATA.nodes[DATA.meta.head_id];
  const rootBpbStr = root?.is_placeholder
    ? (root.val_bpb != null ? `~${fmtBpb(root.val_bpb)} (${L.placeholderShort})` : L.placeholderShort)
    : fmtBpb(root?.val_bpb);
  document.getElementById("trunk-summary").textContent =
    L.trunkSummary(rootBpbStr, fmtBpb(head?.val_bpb), DATA.meta.total_runs);

  document.getElementById("search-input").placeholder = L.searchPlaceholder;
  document.getElementById("btn-trunk").textContent = L.btnTrunk;
  const btnInspire = document.getElementById("btn-inspire");
  btnInspire.textContent = L.btnInspire;
  btnInspire.classList.toggle("active", state.showInspiration);
  const btnRefs = document.getElementById("btn-refs");
  btnRefs.textContent = L.btnRefs;
  btnRefs.classList.toggle("active", state.showRefs);
  document.getElementById("btn-expand").textContent = L.btnExpand;
  document.getElementById("btn-collapse").textContent = L.btnCollapse;
  document.getElementById("btn-fit").textContent = L.btnFit;

  document.getElementById("skin-lab").textContent = L.skinLab;
  document.getElementById("skin-sephiroth").textContent = L.skinSephiroth;
  document.getElementById("skin-lab").classList.toggle("active", state.skin === "lab");
  document.getElementById("skin-sephiroth").classList.toggle("active", state.skin === "sephiroth");

  document.getElementById("tab-overview").textContent = L.tabOverview;
  document.getElementById("tab-bench").textContent = L.tabBench;
  document.getElementById("tab-curve").textContent = L.tabCurve;
  document.getElementById("tab-artifacts").textContent = L.tabArtifacts;

  document.getElementById("lang-zh").classList.toggle("active", state.lang === "zh");
  document.getElementById("lang-en").classList.toggle("active", state.lang === "en");

  const swTrunk = isSephiroth() ? "#c9a66b" : "#1baf7a";
  const swMile = isSephiroth() ? "#d8a254" : "#d98a00";
  const swBranch = isSephiroth() ? "#6a5c47" : "#c3c2b7";
  const swRej = isSephiroth() ? "#b56354" : "#d39a92";
  document.getElementById("canvas-legend").innerHTML = `
    <span class="legend-item"><span class="swatch" style="background:${swTrunk}"></span>${L.legendTrunk}</span>
    <span class="legend-item"><span class="swatch" style="background:${swMile}"></span>${L.legendMilestone}</span>
    <span class="legend-item"><span class="swatch" style="background:${swBranch}"></span>${L.legendBranch}</span>
    <span class="legend-item"><span class="swatch" style="background:${swRej}"></span>${L.legendRejected}</span>
    <span class="legend-item"><span class="swatch-line"></span>${L.legendArc}</span>
    <span class="legend-item"><span class="swatch-inspire"></span>${L.legendInspire}</span>
    <span class="legend-item"><span class="swatch-ref"></span>${L.legendRef}</span>`;

  const msgs = [];
  if (DATA.uncataloged?.length) {
    msgs.push(L.bannerUncataloged(DATA.uncataloged.length, DATA.uncataloged.map(r => r.run_id).join(", ")));
  }
  if (DATA.in_progress?.length) {
    msgs.push(L.bannerRunning(DATA.in_progress.map(r => `${r.run_id} (${r.tokens_m}M tok)`).join(", ")));
  }
  const b = document.getElementById("status-banner");
  if (msgs.length) {
    b.textContent = msgs.join("   |   ");
    b.classList.add("show");
  } else {
    b.classList.remove("show");
  }
}

function setSkin(skin) {
  if (skin !== "lab" && skin !== "sephiroth") return;
  state.skin = skin;
  try { localStorage.setItem("pinwheel-tree-skin", skin); } catch (_) {}
  renderChrome();
  renderTree();
  renderDrawer();
  fitToView();
}

function setLang(lang) {
  if (lang !== "zh" && lang !== "en") return;
  state.lang = lang;
  try { localStorage.setItem("pinwheel-tree-lang", lang); } catch (_) {}
  renderChrome();
  renderTree();
  renderDrawer();
}

function initInteractions() {
  const wrap = document.getElementById("canvas-wrap");
  let dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0;

  wrap.addEventListener("mousedown", e => {
    if (
      e.target.closest(".node-g")
      || e.target.closest(".ref-node-g")
      || e.target.closest(".legend")
      || e.target.closest("button")
    ) return;
    dragging = true; moved = false; sx = e.clientX; sy = e.clientY; ox = state.pan.x; oy = state.pan.y;
    wrap.classList.add("dragging");
  });
  window.addEventListener("mousemove", e => {
    if (!dragging) return;
    if (Math.hypot(e.clientX - sx, e.clientY - sy) > 4) moved = true;
    state.pan.x = ox + (e.clientX - sx);
    state.pan.y = oy + (e.clientY - sy);
    applyTransform();
  });
  window.addEventListener("mouseup", () => {
    if (dragging && !moved) clearSelection();
    dragging = false; moved = false; wrap.classList.remove("dragging");
  });
  window.addEventListener("keydown", e => {
    if (e.key === "Escape" && document.activeElement?.id !== "search-input") clearSelection();
  });
  wrap.addEventListener("wheel", e => {
    e.preventDefault();
    const rect = wrap.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const factor = e.deltaY < 0 ? 1.12 : 0.89;
    const ns = Math.min(2.2, Math.max(0.28, state.pan.scale * factor));
    state.pan.x = mx - (mx - state.pan.x) * (ns / state.pan.scale);
    state.pan.y = my - (my - state.pan.y) * (ns / state.pan.scale);
    state.pan.scale = ns;
    applyTransform();
  }, { passive: false });

  document.querySelectorAll("#d-tabs .tab").forEach(btn => {
    btn.addEventListener("click", () => { state.activeTab = btn.dataset.tab; renderDrawer(); });
  });

  document.getElementById("btn-trunk").addEventListener("click", e => {
    state.trunkOnly = !state.trunkOnly;
    e.target.classList.toggle("active", state.trunkOnly);
    renderTree(); fitToView();
  });
  document.getElementById("btn-inspire").addEventListener("click", e => {
    state.showInspiration = !state.showInspiration;
    e.target.classList.toggle("active", state.showInspiration);
    renderTree();
  });
  document.getElementById("btn-refs").addEventListener("click", e => {
    state.showRefs = !state.showRefs;
    e.target.classList.toggle("active", state.showRefs);
    if (!state.showRefs && state.selectedRefId) {
      state.selectedRefId = null;
      renderDrawer();
    }
    renderTree();
    fitToView();
  });
  document.getElementById("btn-expand").addEventListener("click", () => {
    for (const id of Object.keys(DATA.nodes)) if (DATA.nodes[id].is_group) state.collapsed[id] = false;
    renderTree(); fitToView();
  });
  document.getElementById("btn-collapse").addEventListener("click", () => {
    for (const id of Object.keys(DATA.nodes)) if (DATA.nodes[id].is_group) state.collapsed[id] = true;
    renderTree(); fitToView();
  });
  document.getElementById("btn-fit").addEventListener("click", fitToView);

  document.querySelectorAll(".skin-switch button").forEach(btn => {
    btn.addEventListener("click", () => setSkin(btn.dataset.skin));
  });
  document.querySelectorAll(".lang-switch button").forEach(btn => {
    btn.addEventListener("click", () => setLang(btn.dataset.lang));
  });

  const search = document.getElementById("search-input");
  search.addEventListener("input", () => {
    state.search = search.value;
    const q = state.search.trim().toLowerCase();
    if (q) {
      const hit = Object.values(DATA.nodes).find(
        n => `${n.id} ${n.label} ${n.label_en} ${n.milestone} ${n.milestone_en}`.toLowerCase().includes(q)
      );
      if (hit) {
        let cur = hit.parent;
        while (cur) { state.collapsed[cur] = false; cur = DATA.nodes[cur].parent; }
      }
    }
    renderTree();
  });
}

renderChrome();
initInteractions();
renderTree();
renderDrawer();
fitToView();
</script>
</body>
</html>
