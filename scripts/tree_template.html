<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pinwheel-llm 实验树</title>
<style>
  :root {
    --surface: #fcfcfb;
    --panel: #ffffff;
    --subtle: #f5f4ef;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --blue: #2a78d6;
    --blue-bg: #eef5fd;
    --green: #1baf7a;
    --green-dark: #0e7a53;
    --green-bg: #eaf8f2;
    --red: #e34948;
    --red-bg: #fdf0f0;
    --amber: #d98a00;
    --amber-bg: #fef7e6;
    --teal: #0f8b8d;
    --teal-dark: #0a5e60;
    --teal-bg: #edf8f8;
    --purple: #6250d6;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--surface); color: var(--ink);
    font-family: var(--sans); font-size: 13px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; flex-direction: column; height: 100vh; }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--grid);
    flex-shrink: 0; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .brand h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .brand .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trunk-pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px;
    background: var(--green-bg); color: var(--green-dark); border: 1px solid #bfead7;
    border-radius: 999px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .controls input[type="search"] {
    width: 170px; padding: 5px 9px; border: 1px solid var(--axis); border-radius: 6px;
    background: var(--surface); color: var(--ink); font-size: 12px; outline: none;
  }
  .controls input[type="search"]:focus { border-color: var(--blue); background: #fff; }
  .btn {
    padding: 5px 10px; border: 1px solid var(--grid); border-radius: 6px;
    background: var(--panel); color: var(--ink-2); font-size: 12px; cursor: pointer;
    transition: background .12s, border-color .12s, color .12s;
  }
  .btn:hover { background: var(--subtle); border-color: var(--axis); color: var(--ink); }
  .btn.active { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); font-weight: 600; }

  .lang-switch, .skin-switch {
    display: inline-flex; border: 1px solid var(--axis); border-radius: 6px; overflow: hidden;
    background: var(--surface); margin-left: 2px;
  }
  .lang-switch button, .skin-switch button {
    border: none; background: transparent; padding: 4px 8px; font-size: 11.5px; font-weight: 600;
    color: var(--ink-2); cursor: pointer;
  }
  .lang-switch button.active, .skin-switch button.active { background: var(--ink); color: var(--panel); }

  /* Alert banner for uncataloged / running runs */
  .banner {
    display: none; padding: 6px 16px; background: var(--amber-bg); border-bottom: 1px solid #f0d799;
    color: #7c4d00; font-size: 12px; align-items: center; gap: 12px; flex-shrink: 0;
  }
  .banner.show { display: flex; }

  /* Main split layout */
  .workspace { display: flex; flex: 1; min-height: 0; position: relative; }
  .canvas-wrap {
    flex: 1; position: relative; overflow: hidden; cursor: grab;
    background-color: var(--surface);
    background-image: radial-gradient(var(--grid) 1px, transparent 1px);
    background-size: 20px 20px;
  }
  .canvas-wrap.dragging { cursor: grabbing; }
  svg#tree-svg { width: 100%; height: 100%; display: block; user-select: none; }

  .legend {
    position: absolute; left: 14px; bottom: 14px; display: flex; gap: 12px; align-items: center;
    padding: 6px 11px; background: rgba(255,255,255,0.92); border: 1px solid var(--grid);
    border-radius: 8px; font-size: 11px; color: var(--ink-2); backdrop-filter: blur(4px);
    pointer-events: none;
  }
  .legend-item { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .swatch-line { width: 16px; height: 0; border-top: 2px dashed var(--blue); display: inline-block; }
  .swatch-inspire { width: 16px; height: 0; border-top: 2px dotted var(--amber); display: inline-block; }
  .swatch-ref { width: 16px; height: 0; border-top: 2px dashed var(--teal); display: inline-block; }

  /* Detail drawer */
  aside.drawer {
    width: 440px; max-width: 44vw; min-width: 340px; background: var(--panel);
    border-left: 1px solid var(--grid); display: flex; flex-direction: column; flex-shrink: 0;
  }
  .drawer-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--grid); }
  .drawer-badges { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 999px;
    font-size: 11px; font-weight: 600;
  }
  .badge-root { background: #f2eefc; color: var(--purple); border: 1px solid #d7cef7; }
  .badge-adopted { background: var(--green-bg); color: var(--green-dark); border: 1px solid #bfead7; }
  .badge-branch { background: var(--subtle); color: var(--ink-2); border: 1px solid var(--grid); }
  .badge-rejected { background: #fdf0ef; color: #a33a2f; border: 1px solid #f0c4bf; }
  .badge-group { background: var(--amber-bg); color: #8c5800; border: 1px solid #f0d799; }
  .badge-milestone { background: var(--amber-bg); color: #8c5800; border: 1px solid #eab954; }
  .badge-placeholder { background: #f7f4ff; color: var(--purple); border: 1px dashed #b4a5e8; }
  .badge-ref { background: var(--teal-bg); color: var(--teal-dark); border: 1px solid #9fd6d7; }
  .drawer-title { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.3; }
  .drawer-runid {
    margin-top: 2px; font-family: var(--mono); font-size: 11.5px; color: var(--muted);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }

  .tabs {
    display: flex; border-bottom: 1px solid var(--grid); padding: 0 12px; gap: 2px;
    background: var(--surface); flex-shrink: 0;
  }
  .tab {
    padding: 8px 11px; border: none; background: none; color: var(--ink-2); font-size: 12.5px;
    font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }

  .drawer-body { flex: 1; overflow-y: auto; padding: 14px 16px 24px; }

  .takeaway-box {
    padding: 10px 12px; background: var(--subtle); border-left: 3px solid var(--green);
    border-radius: 4px; margin-bottom: 12px; color: var(--ink); font-size: 13px;
  }
  .takeaway-box.branch { border-left-color: var(--axis); }
  .takeaway-box.root { border-left-color: var(--purple); }
  .protocol-box {
    padding: 7px 10px; background: var(--blue-bg); border: 1px solid #cfe2f9;
    border-radius: 6px; margin-bottom: 12px; font-size: 12px; color: #194b87;
  }
  .protocol-box strong { color: #103666; }

  .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
  .kpi {
    padding: 9px 10px; border: 1px solid var(--grid); border-radius: 7px; background: var(--surface);
  }
  .kpi-label { font-size: 11px; color: var(--muted); }
  .kpi-val {
    font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 1px;
    font-family: var(--mono);
  }
  .kpi-sub { font-size: 11px; color: var(--ink-2); margin-top: 2px; }
  .delta-good { color: var(--green-dark); }
  .delta-bad { color: var(--red); }
  .delta-noise { color: var(--muted); }

  .section-h {
    font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted); margin: 14px 0 6px;
  }
  .meta-list {
    display: grid; grid-template-columns: 96px 1fr; gap: 4px 10px; font-size: 12px;
    padding: 8px 10px; background: var(--surface); border: 1px solid var(--grid); border-radius: 7px;
  }
  .meta-list dt { color: var(--muted); }
  .meta-list dd { margin: 0; font-family: var(--mono); color: var(--ink); word-break: break-all; }

  table.data {
    width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums;
  }
  table.data th, table.data td {
    padding: 6px 6px; border-bottom: 1px solid var(--grid); text-align: right;
  }
  table.data th:first-child, table.data td:first-child { text-align: left; }
  table.data th { color: var(--muted); font-weight: 600; font-size: 11px; }
  table.data tr:last-child td { border-bottom: none; }
  .diff-old { color: var(--muted); text-decoration: line-through; margin-right: 4px; }
  .diff-new { color: var(--ink); font-weight: 600; }

  .link-btn {
    background: none; border: none; padding: 0; color: var(--blue); cursor: pointer;
    font-size: inherit; font-family: inherit; text-decoration: underline; text-underline-offset: 2px;
  }
  .link-btn:hover { color: #16529c; }

  .note-small { font-size: 11.5px; color: var(--muted); margin-top: 8px; line-height: 1.45; }
  .empty-state { padding: 20px 10px; text-align: center; color: var(--muted); font-size: 12.5px; }

  /* Curve box */
  .curve-wrap {
    border: 1px solid var(--grid); border-radius: 8px; background: var(--surface); padding: 10px;
  }
  .curve-legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--ink-2); margin-bottom: 6px; flex-wrap: wrap; }
  .curve-dot { display: inline-block; width: 10px; height: 3px; vertical-align: middle; margin-right: 5px; border-radius: 2px; }

  /* Samples viewer */
  .sample-controls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .sample-controls select {
    width: 100%; padding: 6px 8px; border: 1px solid var(--axis); border-radius: 6px;
    background: #fff; font-size: 12px; color: var(--ink);
  }
  .sample-controls label { font-size: 12px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .sample-card {
    padding: 10px 12px; border: 1px solid var(--grid); border-radius: 7px; background: var(--surface);
    font-size: 12.5px; white-space: pre-wrap; word-break: break-word; line-height: 1.55; margin-bottom: 10px;
  }
  .sample-card-head {
    font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 5px;
    display: flex; justify-content: space-between; font-family: var(--mono);
  }
  .sample-prompt { font-weight: 700; color: var(--ink); background: #efeee7; padding: 0 3px; border-radius: 3px; }
  .artifact-row {
    display: flex; justify-content: space-between; align-items: center; padding: 7px 10px;
    border: 1px solid var(--grid); border-radius: 6px; margin-bottom: 6px; background: var(--surface);
    font-size: 12px;
  }
  .artifact-path { font-family: var(--mono); color: var(--ink); }
  .artifact-status { font-size: 11px; font-weight: 600; }
  .ok { color: var(--green-dark); }
  .miss { color: var(--muted); }

  /* SVG node styling */
  .edge { fill: none; stroke: var(--axis); stroke-width: 1.6; }
  .edge.trunk { stroke: var(--green); stroke-width: 3.4; }
  .edge.dim { opacity: 0.2; }
  .cross-arc {
    fill: none; stroke: var(--blue); stroke-width: 1.8; stroke-dasharray: 5 4;
    opacity: 0.32; transition: opacity .15s, stroke-width .15s;
  }
  .cross-arc.active { opacity: 0.95; stroke-width: 2.5; }
  .cross-label { font-size: 11px; font-weight: 600; fill: var(--blue); }
  .inspire-arc {
    fill: none; stroke: var(--amber); stroke-width: 2.0; stroke-dasharray: 2.5 4;
    stroke-linecap: round; opacity: 0.92;
  }
  .inspire-label { font-size: 10.5px; font-weight: 600; fill: #9c6100; }
  .inspire-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
  .inspire-item {
    padding: 7px 10px; background: var(--amber-bg); border: 1px solid #f0d799;
    border-radius: 6px; font-size: 12px; color: #5c3a00;
  }
  .inspire-item .reason { display: block; margin-top: 2px; color: var(--ink-2); font-size: 11.5px; }

  .ref-arc {
    fill: none; stroke: var(--teal); stroke-width: 1.9; stroke-dasharray: 6 3 2 3;
    stroke-linecap: round; opacity: 0.9;
  }
  .ref-label { font-size: 10.5px; font-weight: 600; fill: var(--teal-dark); }
  .ref-node-g { cursor: pointer; }
  .ref-node-g.dim { opacity: 0.25; }
  .ref-node-g:hover .node-rect { filter: drop-shadow(0 3px 8px rgba(15,139,141,0.14)); }
  .ref-node-g.selected .node-rect { stroke: var(--teal) !important; stroke-width: 2.5 !important; filter: drop-shadow(0 3px 10px rgba(15,139,141,0.25)); }
  .ref-item {
    padding: 8px 10px; background: var(--teal-bg); border: 1px solid #b8e2e3;
    border-radius: 6px; font-size: 12px; color: var(--teal-dark);
  }
  .ref-item .reason { display: block; margin-top: 3px; color: var(--ink-2); font-size: 11.5px; }
  .ref-summary-box {
    padding: 12px 13px; background: var(--teal-bg); border-left: 3px solid var(--teal);
    border-radius: 5px; margin-bottom: 14px; color: var(--ink); font-size: 13px; line-height: 1.6;
  }
  .ext-link-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .ext-link {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 10px; border: 1px solid #b8e2e3; border-radius: 6px; background: #fff;
    color: var(--teal-dark); text-decoration: none; font-size: 12px; font-weight: 600;
  }
  .ext-link:hover { background: var(--teal-bg); border-color: var(--teal); }
  .ext-mini {
    display: inline-block; margin-left: 6px; font-size: 11px; color: var(--teal);
    text-decoration: none; font-weight: 600;
  }
  .ext-mini:hover { text-decoration: underline; }

  .node-g { cursor: pointer; }
  .node-g.dim { opacity: 0.22; }
  .node-rect { transition: stroke .12s, filter .12s; }
  .node-g:hover .node-rect { filter: drop-shadow(0 3px 8px rgba(0,0,0,0.08)); }
  .node-g.selected .node-rect { stroke: var(--blue) !important; stroke-width: 2.6 !important; filter: drop-shadow(0 3px 10px rgba(42,120,214,0.22)); }
  .leaf-pill { cursor: pointer; }
  .leaf-pill:hover rect { opacity: 0.85; }
  .toggle-btn { cursor: pointer; }
  .toggle-btn:hover rect { fill: #e9e7de; }

  /* ==================== Kabbalah Tree of Life (Sephiroth) Skin ==================== */
  html[data-skin="sephiroth"] {
    --surface: #151310;
    --panel: #1b1814;
    --subtle: #231f19;
    --ink: #e8decb;
    --ink-2: #b9ad97;
    --muted: #887c67;
    --grid: #322b21;
    --axis: #574a37;
    --blue: #7ea8c4;
    --blue-bg: rgba(126, 168, 196, 0.13);
    --green: #c9a66b;
    --green-dark: #e2c48c;
    --green-bg: rgba(201, 166, 107, 0.14);
    --red: #c96f5e;
    --red-bg: rgba(201, 111, 94, 0.14);
    --amber: #d8a254;
    --amber-bg: rgba(216, 162, 84, 0.13);
    --teal: #74aba2;
    --teal-dark: #98cbc2;
    --teal-bg: rgba(116, 171, 162, 0.13);
    --purple: #b196ce;
    --sans: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "Cormorant Garamond", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  html[data-skin="sephiroth"] body {
    font-weight: 300;
    letter-spacing: 0.02em;
  }
  html[data-skin="sephiroth"] header {
    background: linear-gradient(180deg, #1f1b16 0%, #191612 100%);
    border-bottom: 1px solid #383024;
  }
  html[data-skin="sephiroth"] .brand h1 {
    font-weight: 400;
    letter-spacing: 0.12em;
    color: #eadcc3;
  }
  html[data-skin="sephiroth"] .trunk-pill {
    background: rgba(201, 166, 107, 0.12);
    color: #e2c48c;
    border-color: rgba(201, 166, 107, 0.36);
    font-weight: 400;
    letter-spacing: 0.04em;
  }
  html[data-skin="sephiroth"] .controls input[type="search"] {
    background: #14120f;
    border-color: #3d3428;
    color: var(--ink);
    font-weight: 300;
  }
  html[data-skin="sephiroth"] .controls input[type="search"]:focus {
    border-color: #c9a66b;
    background: #181511;
  }
  html[data-skin="sephiroth"] .btn {
    background: #1d1a15;
    border-color: #383024;
    color: var(--ink-2);
    font-weight: 300;
    letter-spacing: 0.04em;
  }
  html[data-skin="sephiroth"] .btn:hover {
    background: #28231c;
    border-color: #6b5b43;
    color: #efe5d3;
  }
  html[data-skin="sephiroth"] .btn.active {
    background: rgba(201, 166, 107, 0.16);
    border-color: #c9a66b;
    color: #e8cb92;
    font-weight: 400;
  }
  html[data-skin="sephiroth"] .lang-switch,
  html[data-skin="sephiroth"] .skin-switch {
    border-color: #4a3f2f;
    background: #151310;
  }
  html[data-skin="sephiroth"] .lang-switch button,
  html[data-skin="sephiroth"] .skin-switch button {
    font-weight: 400;
    letter-spacing: 0.04em;
  }
  html[data-skin="sephiroth"] .lang-switch button.active,
  html[data-skin="sephiroth"] .skin-switch button.active {
    background: #c9a66b;
    color: #16130f;
  }
  html[data-skin="sephiroth"] .banner {
    background: rgba(216, 162, 84, 0.12);
    border-bottom-color: rgba(216, 162, 84, 0.3);
    color: #dfba7a;
  }
  html[data-skin="sephiroth"] .canvas-wrap {
    background-color: #14120f;
    background-image:
      radial-gradient(ellipse at 50% 35%, rgba(201, 166, 107, 0.065) 0%, rgba(20, 18, 15, 0) 68%),
      radial-gradient(rgba(201, 166, 107, 0.14) 0.75px, transparent 0.75px);
    background-size: 100% 100%, 28px 28px;
  }
  html[data-skin="sephiroth"] .legend {
    background: rgba(24, 21, 17, 0.88);
    border-color: #3a3226;
    color: var(--ink-2);
    letter-spacing: 0.04em;
  }
  html[data-skin="sephiroth"] aside.drawer {
    background: linear-gradient(180deg, #1d1914 0%, #171410 100%);
    border-left: 1px solid #3a3124;
  }
  html[data-skin="sephiroth"] .drawer-title {
    font-weight: 400;
    letter-spacing: 0.08em;
    color: #f0e6d4;
  }
  html[data-skin="sephiroth"] .badge { font-weight: 400; letter-spacing: 0.05em; }
  html[data-skin="sephiroth"] .badge-root { background: rgba(177,150,206,0.14); color: #cdb7e6; border-color: rgba(177,150,206,0.38); }
  html[data-skin="sephiroth"] .badge-adopted { background: rgba(201,166,107,0.16); color: #e6c990; border-color: rgba(201,166,107,0.42); }
  html[data-skin="sephiroth"] .badge-branch { background: rgba(136,124,103,0.14); color: #bfb39d; border-color: #3e3529; }
  html[data-skin="sephiroth"] .badge-rejected { background: rgba(201,111,94,0.15); color: #df9081; border-color: rgba(201,111,94,0.4); }
  html[data-skin="sephiroth"] .badge-group { background: rgba(216,162,84,0.14); color: #e2b872; border-color: rgba(216,162,84,0.38); }
  html[data-skin="sephiroth"] .badge-milestone { background: rgba(201,166,107,0.18); color: #ebd099; border-color: rgba(201,166,107,0.48); }
  html[data-skin="sephiroth"] .badge-placeholder { background: rgba(177,150,206,0.12); color: #d6c3ec; border: 1px dashed rgba(177,150,206,0.52); }
  html[data-skin="sephiroth"] .badge-ref { background: rgba(116,171,162,0.15); color: #98cbc2; border-color: rgba(116,171,162,0.4); }
  html[data-skin="sephiroth"] .tabs { background: #161310; border-bottom-color: #342d22; }
  html[data-skin="sephiroth"] .tab { font-weight: 300; letter-spacing: 0.06em; color: var(--muted); }
  html[data-skin="sephiroth"] .tab:hover { color: var(--ink); }
  html[data-skin="sephiroth"] .tab.active { color: #e4c68e; border-bottom-color: #c9a66b; font-weight: 400; }
  html[data-skin="sephiroth"] .takeaway-box {
    background: #211d17; border-left-width: 2px; border-left-color: #c9a66b; color: #e8decb;
  }

function isMilestoneNode(n) {

function nodeBoxSize(n) {
  if (isMilestoneNode(n)) return { w: 272, h: 108 };

}

function visibleChildren(id) {
  const n = DATA.nodes[id];
  if (!n || state.collapsed[id]) return [];
  let kids = n.children.slice();
  if (state.trunkOnly) kids = kids.filter(c => trunkSet.has(c));
  kids.sort((a, b) => {
    const ka = DATA.nodes[a].status === "adopted" ? 0 : 1;
    const kb = DATA.nodes[b].status === "adopted" ? 0 : 1;
    return ka - kb;
  });
  return kids;
}

function sephirothNodeBox(n) {
  const big = isMilestoneNode(n);
  if (big && n.is_group) return { r: 52, w: 128, h: 138 };
  if (big) return { r: 56, w: 146, h: 148 };
  if (n.is_group) return { r: 44, w: 118, h: 120 };
  return { r: 42, w: 122, h: 118 };
}

function computeLayoutSephiroth() {
  // Top-down Kabbalah Tree of Life layout:
  // Middle Pillar (trunk) runs vertically along x = 0; side branches alternate symmetrically
  // to the Left (Severity) and Right (Mercy) pillars with independent waterlines so zero boxes overlap.
  const HGAP = 22;
  const VGAP = 46;
  const PILLAR_GAP = 54;
  const TRUNK_GAP = 64;
  const subW = {};
  const subH = {};

  function measureSub(id) {
    const sz = sephirothNodeBox(DATA.nodes[id]);
    const kids = visibleChildren(id);
    if (!kids.length) {
      subW[id] = sz.w;
      subH[id] = sz.h;
      return;
    }
    let totalW = 0, maxKidH = 0;
    kids.forEach((c, i) => {
      measureSub(c);
      totalW += subW[c] + (i > 0 ? HGAP : 0);
      maxKidH = Math.max(maxKidH, subH[c]);
    });
    subW[id] = Math.max(sz.w, totalW);
    subH[id] = sz.h + VGAP + maxKidH;
  }

  const pos = {};
  function placeSub(id, centerX, topY) {
    const sz = sephirothNodeBox(DATA.nodes[id]);
    pos[id] = {
      x: centerX - sz.w / 2,
      y: topY,
      w: sz.w,
      h: sz.h,
      cx: centerX,
      cy: topY + sz.r + 4,
      r: sz.r,
    };
    const kids = visibleChildren(id);
    if (!kids.length) return;
    let totalW = 0;
    kids.forEach((c, i) => { totalW += subW[c] + (i > 0 ? HGAP : 0); });
    let curX = centerX - totalW / 2;
    const childY = topY + sz.h + VGAP;
    for (const c of kids) {
      placeSub(c, curX + subW[c] / 2, childY);
      curX += subW[c] + HGAP;
    }
  }

  // Walk visible trunk chain from root
  const trunk = [];
  let cur = DATA.meta.root_id;
  while (cur && DATA.nodes[cur]) {
    trunk.push(cur);
    const kids = visibleChildren(cur);
    const next = kids.find(c => DATA.nodes[c].status === "adopted");
    if (!next) break;
    cur = next;
  }

  const hasRefsStrip = state.showRefs && Object.keys(DATA.refs || {}).length > 0;
  let midY = hasRefsStrip ? 168 : 64;
  let leftWater = midY - 24;
  let rightWater = midY - 24;
  const maxTrunkHalf = Math.max(...trunk.map(id => sephirothNodeBox(DATA.nodes[id]).w / 2));

  for (const tid of trunk) {
    const sz = sephirothNodeBox(DATA.nodes[tid]);
    pos[tid] = {
      x: -sz.w / 2,
      y: midY,
      w: sz.w,
      h: sz.h,
      cx: 0,
      cy: midY + sz.r + 4,
      r: sz.r,
    };

    const sideKids = visibleChildren(tid).filter(c => DATA.nodes[c].status !== "adopted");
    const leftKids = [];
    const rightKids = [];
    sideKids.forEach((c, idx) => {
      measureSub(c);
      if (idx % 2 === 0) leftKids.push(c);
      else rightKids.push(c);
    });

    if (leftKids.length) {
      const startY = Math.max(midY + 26, leftWater + 34);
      let cursorX = -(maxTrunkHalf + PILLAR_GAP);
      let maxH = 0;
      for (const c of leftKids) {
        placeSub(c, cursorX - subW[c] / 2, startY);
        cursorX -= subW[c] + HGAP;
        maxH = Math.max(maxH, subH[c]);
      }
      leftWater = startY + maxH;
    }

    if (rightKids.length) {
      const startY = Math.max(midY + 26, rightWater + 34);
      let cursorX = maxTrunkHalf + PILLAR_GAP;
      let maxH = 0;
      for (const c of rightKids) {
        placeSub(c, cursorX + subW[c] / 2, startY);
        cursorX += subW[c] + HGAP;
        maxH = Math.max(maxH, subH[c]);
      }
      rightWater = startY + maxH;
    }

    midY += sz.h + TRUNK_GAP;
  }

  state.layout = pos;

  // Center external reference emblems like the Ain Soph crown above Kether
  const refPos = {};
  if (hasRefsStrip) {
    const REFS = Object.values(DATA.refs || {});
    const RW = 196, RH = 58, RGAP = 18;
    const totalW = REFS.length * RW + Math.max(0, REFS.length - 1) * RGAP;
    let rx = -totalW / 2;
    for (const r of REFS) {
      refPos[r.id] = { x: rx, y: 30, w: RW, h: RH, cx: rx + RW / 2, cy: 30 + RH / 2 };
      rx += RW + RGAP;
    }
  }
  state.refLayout = refPos;
}

function computeLayout() {
  if (isSephiroth()) {
    computeLayoutSephiroth();
    return;
  }
  const X_GAP = 66;
  const Y_GAP = 18;
  const subH = {};
  const depthW = {};

  function measure(id, depth) {
    const sz = nodeBoxSize(DATA.nodes[id]);
    depthW[depth] = Math.max(depthW[depth] || 0, sz.w);
    const kids = visibleChildren(id);
    if (!kids.length) {
      subH[id] = sz.h;
      return sz.h;
    }
    let total = 0;
    kids.forEach((c, i) => {
      total += measure(c, depth + 1);
      if (i > 0) total += Y_GAP;
    });
    subH[id] = Math.max(sz.h, total);
    return subH[id];
  }

  measure(DATA.meta.root_id, 0);

  const colX = {};
  let cx = 36;
  const maxD = Math.max(...Object.keys(depthW).map(Number));
  for (let d = 0; d <= maxD; d++) {
    colX[d] = cx;
    cx += (depthW[d] || 220) + X_GAP;
  }

  const pos = {};
  function place(id, depth, topY) {
    const n = DATA.nodes[id];
    const sz = nodeBoxSize(n);
    const kids = visibleChildren(id);
    let y;
    if (!kids.length) {
      y = topY + (subH[id] - sz.h) / 2;
    } else {
      let curY = topY;
      kids.forEach((c, i) => {
        place(c, depth + 1, curY);
        curY += subH[c] + Y_GAP;
      });
      const first = pos[kids[0]];
      const last = pos[kids[kids.length - 1]];
      if (DATA.nodes[kids[0]].status === "adopted") {
        y = first.y + (first.h - sz.h) / 2;
      } else {
        const mid = (first.y + first.h / 2 + last.y + last.h / 2) / 2;
        y = mid - sz.h / 2;
      }
    }
    pos[id] = { x: colX[depth], y, w: sz.w, h: sz.h, depth };
  }

  const hasRefsStrip = state.showRefs && Object.keys(DATA.refs || {}).length > 0;
  place(DATA.meta.root_id, 0, hasRefsStrip ? 182 : 76);
  state.layout = pos;

  // Position external reference cards in a clean horizontal strip above the trunk,
  // ordered by the average x-coordinate of the experiments that cite them.
  const refPos = {};
  if (hasRefsStrip) {
    const REFS = Object.values(DATA.refs || {});
    const avgX = r => {
      const xs = (r.used_by || []).map(u => {
        let cur = u.id;
        while (cur && !pos[cur]) cur = DATA.nodes[cur]?.parent;
        return cur ? pos[cur].x + pos[cur].w / 2 : 0;
      }).filter(Boolean);
      return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 1e9;
    };
    REFS.sort((a, b) => avgX(a) - avgX(b));
    let rx = 36;
    const RW = 224, RH = 66, RGAP = 18;
    for (const r of REFS) {
      refPos[r.id] = { x: rx, y: 26, w: RW, h: RH };
      rx += RW + RGAP;
    }
  }
  state.refLayout = refPos;
}

function elNS(tag, attrs = {}, text = null) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, String(v));
  if (text !== null) el.textContent = text;
  return el;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtBpb(v) { return v == null ? "—" : v.toFixed(4); }
function fmtDelta(v) { return v == null ? "—" : (v > 0 ? `+${v.toFixed(4)}` : v.toFixed(4)); }
function fmtPct(v) { return v == null ? "—" : `${(v * 100).toFixed(2)}%`; }
function fmtP(p) {
  if (p == null) return "—";
  if (p < 1e-4) return p.toExponential(1);
  return p.toFixed(4);
}
function trunc(s, max) { return s && s.length > max ? s.slice(0, max - 1) + "…" : (s || ""); }

function milestoneIconPath(n) {

  return "M12 2l2.6 6.4L21 11l-6.4 2.6L12 20l-2.6-6.4L3 11l6.4-2.6z";
}

function refKindLabel(kind) {
  const L = t();
  if (kind === "method") return L.refKindMethod;
  if (kind === "post") return L.refKindPost;
  if (kind === "repo") return L.refKindRepo;

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function collectCanvasObstacles(sephiroth) {
  const obs = [];
  const pad = 10;
  for (const [id, p] of Object.entries(state.layout)) {
    if (sephiroth) {
      obs.push({
        id,
        x: p.cx - p.r - pad,
        y: p.cy - p.r - pad,
        w: 2 * (p.r + pad),
        h: 2 * p.r + 30 + 2 * pad,
      });
    } else {
      obs.push({ id, x: p.x - pad, y: p.y - pad, w: p.w + 2 * pad, h: p.h + 2 * pad });
    }
  }
  for (const rp of Object.values(state.refLayout || {})) {
    obs.push({ id: null, x: rp.x - 6, y: rp.y - 6, w: rp.w + 12, h: rp.h + 12 });
  }
  return obs;
}

function isRectClear(rect, obstacles, placedPills) {
  for (const o of obstacles) if (rectsOverlap(rect, o)) return false;
  for (const p of placedPills) if (rectsOverlap(rect, p)) return false;
  return true;
}

function quadPoint(x1, y1, cx, cy, x2, y2, t) {
  const mt = 1 - t;
  return {
    x: mt * mt * x1 + 2 * mt * t * cx + t * t * x2,
    y: mt * mt * y1 + 2 * mt * t * cy + t * t * y2,
  };
}

function cubicPoint(x1, y1, cx1, cy1, cx2, cy2, x2, y2, t) {
  const mt = 1 - t;
  return {
    x: mt * mt * mt * x1 + 3 * mt * mt * t * cx1 + 3 * mt * t * t * cx2 + t * t * t * x2,
    y: mt * mt * mt * y1 + 3 * mt * mt * t * cy1 + 3 * mt * t * t * cy2 + t * t * t * y2,
  };
}

function curveHitsNode(sampleFn, obstacles, ignoreIds) {
  for (let i = 1; i <= 7; i++) {
    const pt = sampleFn(i / 8);
    for (const o of obstacles) {
      if (o.id && ignoreIds.has(o.id)) continue;
      if (pt.x >= o.x && pt.x <= o.x + o.w && pt.y >= o.y && pt.y <= o.y + o.h) return true;
    }
  }
  return false;
}

// Route a Paper-skin horizontal-tree arc and place its pill in guaranteed obstacle-free space.
function routeHorizontalArc({ x1, y1, x2, y2, preferTop, pillW, pillH, obstacles, placedPills, ignoreIds, treeMinY, treeMaxY }) {
  const mx = (x1 + x2) / 2;
  const targetYs = [];
  if (preferTop) {
    const localTop = Math.min(y1, y2);
    for (let k = 0; k < 3; k++) targetYs.push(localTop - 30 - k * 28);
    for (let k = 0; k < 4; k++) targetYs.push(treeMinY - 26 - k * 28);
  } else {
    const localBot = Math.max(y1, y2);
    for (let k = 0; k < 3; k++) targetYs.push(localBot + 30 + k * 28);
  }
  for (let k = 0; k < 14; k++) targetYs.push(treeMaxY + 28 + k * 28);

  const tOrder = [0.5, 0.42, 0.58, 0.34, 0.66];
  const trySelect = (requireCleanCurve) => {
    for (const ty of targetYs) {
      // Exact quadratic Bezier midpoint inversion: y(0.5) = 0.25*(y1+y2) + 0.5*cy = ty
      const cy = 2 * ty - 0.5 * (y1 + y2);
      if (requireCleanCurve && curveHitsNode(t => quadPoint(x1, y1, mx, cy, x2, y2, t), obstacles, ignoreIds)) {
        continue;
      }
      for (const t of tOrder) {
        const pt = quadPoint(x1, y1, mx, cy, x2, y2, t);
        const rect = { x: pt.x - pillW / 2 - 4, y: pt.y - pillH / 2 - 4, w: pillW + 8, h: pillH + 8 };
        if (isRectClear(rect, obstacles, placedPills)) {
          return { d: `M ${x1} ${y1} Q ${mx} ${cy}, ${x2} ${y2}`, lx: pt.x, ly: pt.y, rect };
        }
      }
    }
    return null;
  };

  const chosen = trySelect(true) || trySelect(false) || (() => {
    const ty = treeMaxY + 28 + placedPills.length * 28;
    const cy = 2 * ty - 0.5 * (y1 + y2);
    const pt = quadPoint(x1, y1, mx, cy, x2, y2, 0.5);
    return {
      d: `M ${x1} ${y1} Q ${mx} ${cy}, ${x2} ${y2}`,
      lx: pt.x, ly: pt.y,
      rect: { x: pt.x - pillW / 2 - 4, y: pt.y - pillH / 2 - 4, w: pillW + 8, h: pillH + 8 },
    };
  })();
  return chosen;
}

// Clip straight line segment at the outer perimeter of two Sephiroth circles.
function clippedSegment(p1, p2, pad = 4) {
  const dx = p2.cx - p1.cx, dy = p2.cy - p1.cy;
  const dist = Math.hypot(dx, dy) || 1;
  const ux = dx / dist, uy = dy / dist;
  return {
    x1: p1.cx + ux * (p1.r + pad),
    y1: p1.cy + uy * (p1.r + pad),
    x2: p2.cx - ux * (p2.r + pad),
    y2: p2.cy - uy * (p2.r + pad),
    ux, uy,
  };
}

// Route a Sephiroth-skin vertical-tree arc and place its pill in guaranteed obstacle-free space.
function routeVerticalArc({ a, b, preferRight, pillW, pillH, obstacles, placedPills, ignoreIds, treeMinX, treeMaxX }) {
  const seg = clippedSegment(a, b, 5);
  const mx = (seg.x1 + seg.x2) / 2;
  const my = (seg.y1 + seg.y2) / 2;
  const sides = preferRight ? [1, -1] : [-1, 1];

  // 1. Try a compact local quadratic curve if both the path and pill are completely clear of all nodes.
  for (const sign of sides) {
    for (const mag of [64, 98]) {
      const cx = mx + sign * mag;
      const cy = my;
      if (curveHitsNode(t => quadPoint(seg.x1, seg.y1, cx, cy, seg.x2, seg.y2, t), obstacles, ignoreIds)) {
        continue;
      }
      for (const t of [0.5, 0.42, 0.58]) {
        const pt = quadPoint(seg.x1, seg.y1, cx, cy, seg.x2, seg.y2, t);
        const rect = { x: pt.x - pillW / 2 - 4, y: pt.y - pillH / 2 - 4, w: pillW + 8, h: pillH + 8 };
        if (isRectClear(rect, obstacles, placedPills)) {
          return { d: `M ${seg.x1} ${seg.y1} Q ${cx} ${cy}, ${seg.x2} ${seg.y2}`, lx: pt.x, ly: pt.y, rect };
        }
      }
    }
  }

  // 2. Otherwise swing cleanly outside the left/right tree flank where no nodes exist.
  const tOrder = [0.5, 0.40, 0.60, 0.30, 0.70, 0.22, 0.78];
  for (const sign of sides) {
    const goRight = sign > 0;
    const x1 = goRight ? (a.cx + a.r + 4) : (a.cx - a.r - 4);
    const x2 = goRight ? (b.cx + b.r + 4) : (b.cx - b.r - 4);
    const y1 = a.cy, y2 = b.cy;
    const baseTargetX = goRight
      ? Math.max(treeMaxX + 22 + pillW / 2, Math.max(x1, x2) + 40 + pillW / 2)
      : Math.min(treeMinX - 22 - pillW / 2, Math.min(x1, x2) - 40 - pillW / 2);

    for (let col = 0; col < 10; col++) {
      const targetX = baseTargetX + sign * col * 48;
      // Invert cubic midpoint x(0.5) = 0.75 * outerX + 0.125 * (x1 + x2) = targetX
      const outerX = (targetX - 0.125 * (x1 + x2)) / 0.75;
      for (const t of tOrder) {
        const pt = cubicPoint(x1, y1, outerX, y1, outerX, y2, x2, y2, t);
        const rect = { x: pt.x - pillW / 2 - 4, y: pt.y - pillH / 2 - 4, w: pillW + 8, h: pillH + 8 };
        if (isRectClear(rect, obstacles, placedPills)) {
          return { d: `M ${x1} ${y1} C ${outerX} ${y1}, ${outerX} ${y2}, ${x2} ${y2}`, lx: pt.x, ly: pt.y, rect };
        }
      }
    }
  }

  // Guaranteed fallback far outside the preferred flank
  const goRight = preferRight;
  const sign = goRight ? 1 : -1;
  const x1 = goRight ? (a.cx + a.r + 4) : (a.cx - a.r - 4);
  const x2 = goRight ? (b.cx + b.r + 4) : (b.cx - b.r - 4);
  const y1 = a.cy, y2 = b.cy;
  const targetX = (goRight ? treeMaxX : treeMinX) + sign * (28 + pillW / 2 + placedPills.length * 44);
  const outerX = (targetX - 0.125 * (x1 + x2)) / 0.75;
  const pt = cubicPoint(x1, y1, outerX, y1, outerX, y2, x2, y2, 0.5);
  return {
    d: `M ${x1} ${y1} C ${outerX} ${y1}, ${outerX} ${y2}, ${x2} ${y2}`,
    lx: pt.x, ly: pt.y,
    rect: { x: pt.x - pillW / 2 - 4, y: pt.y - pillH / 2 - 4, w: pillW + 8, h: pillH + 8 },
  };
}

function roundedRowBracket(x1, y1, x2, y2, railY) {
  const dir = x2 >= x1 ? 1 : -1;
  const r = Math.min(12, Math.abs(x2 - x1) / 3, Math.max(4, railY - Math.max(y1, y2) - 2));
  return {
    d: `M ${x1} ${y1} L ${x1} ${railY - r} Q ${x1} ${railY}, ${x1 + dir * r} ${railY} L ${x2 - dir * r} ${railY} Q ${x2} ${railY}, ${x2} ${railY - r} L ${x2} ${y2}`,
    r,
  };
}

function roundedColBracket(x1, y1, x2, y2, railX) {
  const dir = y2 >= y1 ? 1 : -1;
  const r = Math.min(12, Math.abs(y2 - y1) / 3, Math.max(4, railX - Math.max(x1, x2) - 2));
  return {
    d: `M ${x1} ${y1} L ${railX - r} ${y1} Q ${railX} ${y1}, ${railX} ${y1 + dir * r} L ${railX} ${y2 - dir * r} Q ${railX} ${y2}, ${railX - r} ${y2} L ${x2} ${y2}`,
    r, dir,
  };
}

function renderTree() {
  computeLayout();
  const decorLayer = document.getElementById("decor-layer");
  decorLayer.innerHTML = "";
  if (isSephiroth()) {
    renderTreeSephiroth();
    return;
  }
  const L = t();
  const edgesLayer = document.getElementById("edges-layer");
  const arcsBgLayer = document.getElementById("arcs-bg-layer");
  const refsLayer = document.getElementById("refs-layer");
  const arcsFgLayer = document.getElementById("arcs-fg-layer");
  const nodesLayer = document.getElementById("nodes-layer");
  edgesLayer.innerHTML = "";
  arcsBgLayer.innerHTML = "";
  refsLayer.innerHTML = "";
  arcsFgLayer.innerHTML = "";
  nodesLayer.innerHTML = "";

  const q = state.search.trim().toLowerCase();
  const matches = new Set();
  const refMatches = new Set();
  if (q) {
    for (const n of Object.values(DATA.nodes)) {
      const hay = `${n.id} ${n.label} ${n.label_en} ${n.milestone} ${n.milestone_en} ${n.takeaway} ${n.takeaway_en}`.toLowerCase();
      if (hay.includes(q)) matches.add(n.id);
    }
    for (const r of Object.values(DATA.refs || {})) {
      const hay = `${r.id} ${r.label} ${r.label_en} ${r.authors} ${r.summary} ${r.summary_en}`.toLowerCase();
      if (hay.includes(q)) refMatches.add(r.id);
    }
  }

  // 1. Tree edges
  for (const [id, p] of Object.entries(state.layout)) {
    const n = DATA.nodes[id];
    if (!n.parent || !state.layout[n.parent]) continue;
    const par = state.layout[n.parent];
    const x1 = par.x + par.w, y1 = par.y + par.h / 2;
    const x2 = p.x, y2 = p.y + p.h / 2;
    const mx = (x1 + x2) / 2;
    const d = `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
    const isTrunk = trunkSet.has(id) && trunkSet.has(n.parent);
    const cls = ["edge", isTrunk ? "trunk" : "", q && !matches.has(id) ? "dim" : ""].filter(Boolean).join(" ");
    edgesLayer.appendChild(elNS("path", { d, class: cls }));
  }

  // 2. Cross-recipe & sibling comparison arcs (routed around cards; active arcs & pills render above nodes)
  const noSel = !state.selectedId && !state.selectedRefId;
  const obstacles = collectCanvasObstacles(false);
  const placedPills = [];
  const allPos = Object.values(state.layout);
  const treeMinY = allPos.length ? Math.min(...allPos.map(p => p.y)) : 80;
  const treeMaxY = allPos.length ? Math.max(...allPos.map(p => p.y + p.h)) : 400;

  const crossPairs = [];
  for (const [id] of Object.entries(state.layout)) {
    const n = DATA.nodes[id];
    if (!n.cross_compare || !n.compare_to || !state.layout[n.compare_to]) continue;
    crossPairs.push([id, n.compare_to]);
  }
  // Sort shorter sibling spans first so nested vertical brackets never cross each other.
  crossPairs.sort((p1, p2) => {
    const d1 = Math.abs(state.layout[p1[0]].y - state.layout[p1[1]].y);
    const d2 = Math.abs(state.layout[p2[0]].y - state.layout[p2[1]].y);
    return d1 - d2;
  });
  const sameColRank = {};
  const sameColGroupCount = {};
  crossPairs.forEach(([srcId, dstId]) => {
    const a = state.layout[srcId], b = state.layout[dstId];
    const active = !state.selectedRefId && (state.selectedId === srcId || state.selectedId === dstId);
    const isRootArc = srcId === DATA.meta.root_id;
    if (!noSel && !active && !isRootArc) return;
    if (Math.abs(a.x - b.x) < 10) sameColGroupCount[dstId] = (sameColGroupCount[dstId] || 0) + 1;
  });
  let crossColIdx = 0;

  crossPairs.forEach(([srcId, dstId]) => {
    const a = state.layout[srcId], b = state.layout[dstId];
    const src = DATA.nodes[srcId];
    const active = !state.selectedRefId && (state.selectedId === srcId || state.selectedId === dstId);
    const isRootArc = srcId === DATA.meta.root_id;
    const sameCol = Math.abs(a.x - b.x) < 10;
    if (!noSel && !active && !isRootArc) return;
    const targetLayer = (active || isRootArc) ? arcsFgLayer : arcsBgLayer;

    let d, lx, ly, pillX, pillY, txt;

    if (sameCol) {
      // Same-column sibling comparison: nested rounded vertical bracket on the right margin.
      const rank = sameColRank[dstId] || 0;
      sameColRank[dstId] = rank + 1;
      const groupTotal = sameColGroupCount[dstId] || 1;
      const rightEdge = Math.max(a.x + a.w, b.x + b.w);
      const y1 = a.y + a.h / 2;
      const y2 = b.y + b.h / 2;
      const railStep = 18;
      const railX = rightEdge + 24 + rank * railStep;
      const br = roundedColBracket(a.x + a.w, y1, b.x + b.w, y2, railX);
      d = br.d;

      targetLayer.appendChild(elNS("path", {
        d,
        class: `cross-arc${active ? " active" : ""}`,
        "marker-end": "url(#arrow-blue)",
      }));
      if (active) {
        txt = src.delta_bpb != null ? `${fmtDelta(src.delta_bpb)} BPB` : L.arcFallback(src.compare_to);
        const charW = state.lang === "en" ? 6.6 : 7.0;
        const pillW = Math.max(82, Math.round(txt.length * charW + 16));
        const maxRailX = rightEdge + 24 + Math.max(0, groupTotal - 1) * railStep;
        const tapY = y1 + br.dir * br.r;
        pillX = maxRailX + 16;
        pillY = tapY - 10;
        // Guard against any obstacle or previous pill on the right.
        for (let step = 0; step < 8; step++) {
          const rect = { x: pillX - 4, y: pillY - 4, w: pillW + 8, h: 28 };
          if (isRectClear(rect, obstacles, placedPills)) break;
          pillX += 24;
        }
        ly = pillY + 14;

        targetLayer.appendChild(elNS("circle", {
          cx: railX, cy: tapY, r: 2.5, fill: "#2a78d6",
        }));
        targetLayer.appendChild(elNS("line", {
          x1: railX, y1: tapY, x2: pillX, y2: tapY,
          stroke: "#2a78d6", "stroke-width": 1, "stroke-dasharray": "2 2", opacity: 0.72,
        }));
        targetLayer.appendChild(elNS("rect", {
          x: pillX, y: pillY, width: pillW, height: 20, rx: 10,
          fill: "#eef5fd", stroke: "#2a78d6", "stroke-width": 1.1,
        }));
        targetLayer.appendChild(elNS("text", {
          x: pillX + pillW / 2, y: ly, "text-anchor": "middle", class: "cross-label",
        }, txt));
        placedPills.push({ x: pillX - 4, y: pillY - 4, w: pillW + 8, h: 28 });
      }
      return;
    }

    // Cross-column comparison arc (routed clear of nodes & other pills)
    const idx = crossColIdx++;
    const x1 = a.x + a.w / 2, x2 = b.x + b.w / 2;
    const topArc = isRootArc;
    const y1 = topArc ? a.y : a.y + a.h;
    const y2 = topArc ? b.y : b.y + b.h;
    const showPill = active || isRootArc;

    if (showPill) {
      txt = src.delta_bpb != null
        ? (isRootArc
            ? L.arcRootLabel(fmtDelta(-src.delta_bpb))
            : L.arcOtherLabel(src.compare_to, fmtDelta(src.delta_bpb)))
        : L.arcFallback(src.compare_to);
      const charW = state.lang === "en" ? 6.4 : 8.2;
      const pillW = Math.max(170, Math.round(txt.length * charW + 22));
      const routed = routeHorizontalArc({
        x1, y1, x2, y2, preferTop: topArc, pillW, pillH: 20,
        obstacles, placedPills, ignoreIds: new Set([srcId, dstId]), treeMinY, treeMaxY,
      });
      d = routed.d;
      lx = routed.lx;
      ly = routed.ly;
      placedPills.push(routed.rect);

      targetLayer.appendChild(elNS("path", {
        d,
        class: `cross-arc${active ? " active" : ""}`,
        "marker-end": "url(#arrow-blue)",
      }));
      targetLayer.appendChild(elNS("rect", {
        x: lx - pillW / 2, y: ly - 10, width: pillW, height: 20, rx: 10,
        fill: active ? "#eef5fd" : "rgba(255,255,255,0.95)",
        stroke: active ? "#2a78d6" : "#cfe2f9", "stroke-width": 1.1,
      }));
      targetLayer.appendChild(elNS("text", {
        x: lx, y: ly + 4, "text-anchor": "middle", class: "cross-label",
      }, txt));
    } else {
      const ty = topArc ? (treeMinY - 26 - idx * 20) : (treeMaxY + 26 + idx * 20);
      const cy = 2 * ty - 0.5 * (y1 + y2);
      d = `M ${x1} ${y1} Q ${(x1 + x2) / 2} ${cy}, ${x2} ${y2}`;
      targetLayer.appendChild(elNS("path", {
        d,
        class: "cross-arc",
        "marker-end": "url(#arrow-blue)",
      }));
    }
  });

  // 2b. Inspiration edges (amber dotted arcs; all shown subtly when nothing is selected, focused with pills on select)
  function visibleAnchor(id) {
    let cur = id;
    while (cur && !state.layout[cur]) cur = DATA.nodes[cur]?.parent;
    return cur;
  }
  const inspireEdges = [];
  const seenInspire = new Set();
  if (state.showInspiration && !state.selectedRefId) {
    for (const n of Object.values(DATA.nodes)) {
      for (const edge of (n.inspired_by || [])) {
        if (noSel || state.selectedId === n.id || state.selectedId === edge.id) {
          const srcVis = visibleAnchor(edge.id);
          const dstVis = visibleAnchor(n.id);
          const key = `${srcVis}->${dstVis}`;
          if (srcVis && dstVis && srcVis !== dstVis && (!noSel || !seenInspire.has(key))) {
            seenInspire.add(key);
            inspireEdges.push({ srcId: srcVis, dstId: dstVis, reason: pick(edge, "reason") });
          }
        }
      }
    }
  }
  inspireEdges.forEach((ie, idx) => {
    const a = state.layout[ie.srcId], b = state.layout[ie.dstId];
    const x1 = a.x + a.w * 0.5, y1 = a.y + a.h;
    const x2 = b.x + b.w * 0.5, y2 = b.y + b.h;
    if (noSel) {
      const ty = treeMaxY + 26 + (idx % 4) * 18;
      const cy = 2 * ty - 0.5 * (y1 + y2);
      const d = `M ${x1} ${y1} Q ${(x1 + x2) / 2} ${cy}, ${x2} ${y2}`;
      arcsBgLayer.appendChild(elNS("path", {
        d, class: "inspire-arc", opacity: 0.42, "marker-end": "url(#arrow-amber)",
      }));
      return;
    }
    const rawTxt = ie.reason ? `${L.inspireBadge} · ${truncLang(ie.reason, 22, 36)}` : L.inspireBadge;
    const charW = state.lang === "en" ? 6.2 : 8.4;
    const pillW = Math.max(88, Math.round(rawTxt.length * charW + 18));
    const routed = routeHorizontalArc({
      x1, y1, x2, y2, preferTop: false, pillW, pillH: 20,
      obstacles, placedPills, ignoreIds: new Set([ie.srcId, ie.dstId]), treeMinY, treeMaxY,
    });
    placedPills.push(routed.rect);
    arcsFgLayer.appendChild(elNS("path", {
      d: routed.d, class: "inspire-arc", "marker-end": "url(#arrow-amber)",
    }));
    arcsFgLayer.appendChild(elNS("rect", {
      x: routed.lx - pillW / 2, y: routed.ly - 10, width: pillW, height: 20, rx: 10,
      fill: "#fef7e6", stroke: "#d98a00", "stroke-width": 1.1,
    }));
    arcsFgLayer.appendChild(elNS("text", {
      x: routed.lx, y: routed.ly + 4, "text-anchor": "middle", class: "inspire-label",
    }, rawTxt));
  });

  // 2c. External reference strip & teal links (shown when showRefs is enabled)
  if (state.showRefs && Object.keys(state.refLayout).length) {
    refsLayer.appendChild(elNS("text", {
      x: 36, y: 16, "font-size": 10.5, "font-weight": 700, fill: "#0a5e60", opacity: 0.85,
    }, L.refStripLabel));

    for (const [rid, rp] of Object.entries(state.refLayout)) {
      const r = DATA.refs[rid];
      const isSel = state.selectedRefId === rid;
      const rg = elNS("g", {
        class: [
          "ref-node-g",
          isSel ? "selected" : "",
          q && !refMatches.has(rid) ? "dim" : "",
        ].filter(Boolean).join(" "),
        transform: `translate(${rp.x}, ${rp.y})`,
      });
      rg.appendChild(elNS("rect", {
        class: "node-rect", x: 0, y: 0, width: rp.w, height: rp.h, rx: 9,
        fill: isSel ? "#e2f5f5" : "#f3fbfb",
        stroke: isSel ? "#0f8b8d" : "#8acbcc",
        "stroke-width": isSel ? 2.2 : 1.4,
        "stroke-dasharray": isSel ? "none" : "4 2",
      }));
      // Small book icon badge on top-left
      rg.appendChild(elNS("rect", {
        x: 9, y: 10, width: 22, height: 22, rx: 6, fill: "#0f8b8d",
      }));
      const bIcon = elNS("g", { transform: "translate(12.5, 13.5) scale(0.62)" });
      bIcon.appendChild(elNS("path", {
        d: "M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 0-3 3V4zm3 2v11.2A4.9 4.9 0 0 1 8.5 17H16V7a1 1 0 0 0-1-1H7z",
        fill: "#ffffff",
      }));
      rg.appendChild(bIcon);

      rg.appendChild(elNS("text", {
        x: 38, y: 20, "font-size": 9.8, "font-weight": 700, fill: "#0f8b8d",
      }, refKindLabel(r.kind)));
      rg.appendChild(elNS("text", {
        x: rp.w - 9, y: 20, "text-anchor": "end", "font-size": 9.6, fill: "#5c7f80",
      }, L.refUsedCount((r.used_by || []).length)));
      rg.appendChild(elNS("text", {
        x: 38, y: 36, "font-size": 12.2, "font-weight": 700, fill: "#0b0b0b",
      }, truncLang(pick(r, "label") || r.id, 13, 22)));
      rg.appendChild(elNS("text", {
        x: 10, y: 54, "font-size": 10, fill: "#526869",
      }, trunc(r.authors || (r.links[0]?.label || ""), 28)));

      rg.addEventListener("click", () => selectRef(rid));
      refsLayer.appendChild(rg);
    }

    // Draw teal external links (all subtly when nothing is selected; focused in foreground on select)
    const refEdges = [];
    const seenRef = new Set();
    for (const r of Object.values(DATA.refs || {})) {
      const rp = state.refLayout[r.id];
      if (!rp) continue;
      for (const u of (r.used_by || [])) {
        if (noSel || state.selectedRefId === r.id || (!state.selectedRefId && state.selectedId === u.id)) {
          const dstVis = visibleAnchor(u.id);
          const key = `${r.id}->${dstVis}`;
          if (dstVis && state.layout[dstVis] && !seenRef.has(key)) {
            seenRef.add(key);
            refEdges.push({ refId: r.id, dstId: dstVis, reason: pick(u, "reason") });
          }
        }
      }
    }
    refEdges.forEach((re, idx) => {
      const rp = state.refLayout[re.refId], dp = state.layout[re.dstId];
      const x1 = rp.x + rp.w / 2, y1 = rp.y + rp.h;
      const x2 = dp.x + dp.w * 0.5, y2 = dp.y;
      const midY = y1 + (y2 - y1) * (0.36 + (idx % 3) * 0.14);
      const d = `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`;
      const targetLayer = noSel ? arcsBgLayer : arcsFgLayer;
      const attrs = { d, class: "ref-arc", "marker-end": "url(#arrow-teal)" };
      if (noSel) attrs.opacity = 0.36;
      targetLayer.appendChild(elNS("path", attrs));
    });
  }

  // 3. Nodes
  for (const [id, p] of Object.entries(state.layout)) {
    const n = DATA.nodes[id];
    const big = isMilestoneNode(n);
    const g = elNS("g", {
      class: [
        "node-g",
        (!state.selectedRefId && state.selectedId === id) ? "selected" : "",
        q && !matches.has(id) ? "dim" : "",
      ].filter(Boolean).join(" "),
      transform: `translate(${p.x}, ${p.y})`,
    });

    if (n.is_group && state.collapsed[id]) {
      g.appendChild(elNS("rect", {
        x: 6, y: 6, width: p.w, height: p.h, rx: 10,
        fill: "#f1efe7", stroke: "#d4d1c5", "stroke-width": 1,
      }));
      g.appendChild(elNS("rect", {
        x: 3, y: 3, width: p.w, height: p.h, rx: 10,
        fill: "#f8f7f2", stroke: "#d4d1c5", "stroke-width": 1,
      }));
    }

    let fill = "#ffffff", stroke = "#d7d5cb", strokeW = 1.2;
    if (n.status === "root") { fill = "#faf8ff"; stroke = "#6250d6"; strokeW = 2; }
    else if (n.is_head) { fill = "#f3fcf7"; stroke = "#1baf7a"; strokeW = 2.4; }
    else if (n.status === "adopted") { fill = "#f8fdfb"; stroke = "#1baf7a"; strokeW = 1.8; }
    else if (n.is_group) { fill = "#fffcf5"; stroke = "#d9a94e"; strokeW = 1.4; }
    else if (n.status === "rejected") { fill = "#fdf8f7"; stroke = "#d39a92"; strokeW = 1.2; }
    else if (big) { fill = "#fffdf8"; stroke = "#d98a00"; strokeW = 1.8; }

    const rect = elNS("rect", {
      class: "node-rect", x: 0, y: 0, width: p.w, height: p.h, rx: big ? 12 : 9,
      fill, stroke, "stroke-width": strokeW,
    });
    if (n.status === "rejected" || n.is_placeholder) rect.setAttribute("stroke-dasharray", "5 3");
    g.appendChild(rect);

    if (big) {
      let iconBg = "#1baf7a";
      if (n.status === "root") iconBg = "#6250d6";
      else if (n.is_head) iconBg = "#0e7a53";
      else if (n.status !== "adopted") iconBg = "#d98a00";

      g.appendChild(elNS("rect", {
        x: 11, y: 11, width: 32, height: 32, rx: 9, fill: iconBg,
      }));
      const iconG = elNS("g", { transform: "translate(17, 17) scale(0.83)" });
      iconG.appendChild(elNS("path", { d: milestoneIconPath(n), fill: "#ffffff" }));
      if (n.status === "adopted" && !n.is_head) {
        iconG.appendChild(elNS("path", {
          d: "M8.5 12.2l2.3 2.3 4.8-5.1", fill: "none", stroke: iconBg,
          "stroke-width": 2.4, "stroke-linecap": "round", "stroke-linejoin": "round",
        }));
      }
      g.appendChild(iconG);

      const mText = nodeMilestone(n) || (n.status === "adopted" ? L.defaultTrunk : L.defaultMilestone);
      g.appendChild(elNS("text", {
        x: 51, y: 22, "font-size": 10.5, "font-weight": 700, fill: iconBg,
      }, truncLang(mText, 12, 18)));
      if (n.run_id) {
        g.appendChild(elNS("text", {
          x: p.w - 11, y: 22, "text-anchor": "end", "font-size": 9.6, fill: "#898781",
          "font-family": "var(--mono)",
        }, trunc(n.run_id, 17)));
      }
      g.appendChild(elNS("text", {
        x: 51, y: 40, "font-size": 14, "font-weight": 700, fill: "#0b0b0b",
      }, truncLang(nodeLabel(n), 15, 24)));

      if (n.is_group) {
        const gs = n.group_stats || {};
        g.appendChild(elNS("text", {
          x: 12, y: 68, "font-size": 12, fill: "#52514e", "font-family": "var(--mono)",
        }, L.groupCardMeta(gs.count || 0, fmtBpb(gs.best_bpb))));
      } else {
        const bpbText = n.is_placeholder && n.val_bpb != null ? `~${fmtBpb(n.val_bpb)}` : fmtBpb(n.val_bpb);
        g.appendChild(elNS("text", {
          x: 12, y: 69, "font-size": 15.5, "font-weight": 700, fill: n.is_placeholder ? "#6d6b65" : "#0b0b0b",
          "font-family": "var(--mono)",
        }, bpbText));
        drawDeltaTag(g, n, n.is_placeholder ? 102 : 94, 55);
      }
    } else {
      g.appendChild(elNS("text", {
        x: 11, y: 21, "font-size": 12.5, "font-weight": 600, fill: "#0b0b0b",
      }, truncLang(nodeLabel(n), 18, 28)));
      if (n.is_group) {
        const gs = n.group_stats || {};
        g.appendChild(elNS("text", {
          x: 11, y: 42, "font-size": 11.5, fill: "#52514e", "font-family": "var(--mono)",
        }, L.groupCardMeta(gs.count || 0, fmtBpb(gs.best_bpb))));
      } else {
        const bpbText = n.is_placeholder && n.val_bpb != null ? `~${fmtBpb(n.val_bpb)}` : fmtBpb(n.val_bpb);
        g.appendChild(elNS("text", {
          x: 11, y: 43, "font-size": 13.5, "font-weight": 700, fill: n.is_placeholder ? "#6d6b65" : "#0b0b0b",
          "font-family": "var(--mono)",
        }, bpbText));
        drawDeltaTag(g, n, n.is_placeholder ? 88 : 80, 30);
      }
    }

    const bottomY = p.h - 24;
    if (n.is_group) {
      const isCol = Boolean(state.collapsed[id]);
      const gs = n.group_stats || {};
      const btnText = isCol ? L.expandBtn(gs.count || n.children.length) : L.collapseBtn;
      const bw = Math.max(92, Math.round(btnText.length * (state.lang === "en" ? 6.8 : 9.2) + 18));
      const tg = elNS("g", { class: "toggle-btn", transform: `translate(11, ${bottomY})` });
      tg.appendChild(elNS("rect", {
        x: 0, y: 0, width: bw, height: 18, rx: 9, fill: "#f2efe4", stroke: "#d9c99e", "stroke-width": 1,
      }));
      tg.appendChild(elNS("text", {
        x: bw / 2, y: 12.5, "text-anchor": "middle", "font-size": 10.5, "font-weight": 600, fill: "#7a5100",
      }, btnText));
      tg.addEventListener("click", (ev) => {
        ev.stopPropagation();
        state.collapsed[id] = !state.collapsed[id];
        renderTree();
      });
      g.appendChild(tg);
    } else if (n.artifacts) {
      drawLeafPills(g, n, 11, bottomY);
    }

    g.addEventListener("click", () => selectNode(id));
    nodesLayer.appendChild(g);
  }
}

const ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];

function renderTreeSephiroth() {
  const L = t();
  const decorLayer = document.getElementById("decor-layer");
  const edgesLayer = document.getElementById("edges-layer");
  const arcsBgLayer = document.getElementById("arcs-bg-layer");
  const refsLayer = document.getElementById("refs-layer");
  const arcsFgLayer = document.getElementById("arcs-fg-layer");
  const nodesLayer = document.getElementById("nodes-layer");
  decorLayer.innerHTML = "";
  edgesLayer.innerHTML = "";
  arcsBgLayer.innerHTML = "";
  refsLayer.innerHTML = "";
  arcsFgLayer.innerHTML = "";
  nodesLayer.innerHTML = "";

  const q = state.search.trim().toLowerCase();
  const matches = new Set();
  const refMatches = new Set();
  if (q) {
    for (const n of Object.values(DATA.nodes)) {
      const hay = `${n.id} ${n.label} ${n.label_en} ${n.milestone} ${n.milestone_en} ${n.takeaway} ${n.takeaway_en}`.toLowerCase();
      if (hay.includes(q)) matches.add(n.id);
    }
    for (const r of Object.values(DATA.refs || {})) {
      const hay = `${r.id} ${r.label} ${r.label_en} ${r.authors} ${r.summary} ${r.summary_en}`.toLowerCase();
      if (hay.includes(q)) refMatches.add(r.id);
    }
  }

  // 0. Sacred geometry backdrop: three pillars + subtle concentric astrolabe rings + Ain Soph arc
  const allPos = Object.values(state.layout);
  if (allPos.length) {
    const minY = Math.min(...allPos.map(p => p.cy)) - 70;
    const maxY = Math.max(...allPos.map(p => p.cy)) + 70;
    const midY = (minY + maxY) / 2;
    const minX = Math.min(...allPos.map(p => p.x));
    const maxX = Math.max(...allPos.map(p => p.x + p.w));
    const spanR = Math.max(240, Math.min(460, (maxY - minY) * 0.44));

    // Middle pillar axis + symmetric side pillar guidelines
    decorLayer.appendChild(elNS("line", {
      x1: 0, y1: minY, x2: 0, y2: maxY,
      stroke: "#c9a66b", "stroke-width": 0.8, opacity: 0.18, "stroke-dasharray": "3 6",
    }));
    const sideGuide = Math.max(180, Math.min(280, Math.max(Math.abs(minX), Math.abs(maxX)) * 0.52));
    for (const gx of [-sideGuide, sideGuide]) {
      decorLayer.appendChild(elNS("line", {
        x1: gx, y1: minY + 40, x2: gx, y2: maxY - 20,
        stroke: "#c9a66b", "stroke-width": 0.6, opacity: 0.09, "stroke-dasharray": "2 8",
      }));
    }
    // Concentric astrolabe circles around the heart of the tree
    for (const rad of [spanR * 0.62, spanR, spanR * 1.18]) {
      decorLayer.appendChild(elNS("circle", {
        cx: 0, cy: midY, r: rad, fill: "none",
        stroke: "#c9a66b", "stroke-width": 0.7, opacity: 0.08,
        "stroke-dasharray": rad === spanR ? "none" : "4 6",
      }));
    }
    // Delicate triple veil arc above Kether (root)
    const rootP = state.layout[DATA.meta.root_id];
    if (rootP) {
      for (let i = 0; i < 3; i++) {
        const ar = 76 + i * 16;
        decorLayer.appendChild(elNS("path", {
          d: `M ${-ar} ${rootP.cy - 22} A ${ar} ${ar * 0.52} 0 0 1 ${ar} ${rootP.cy - 22}`,
          fill: "none", stroke: "#c9a66b", "stroke-width": 0.7, opacity: 0.18 - i * 0.045,
        }));
      }
    }
  }

  // 1. Sacred Paths (tree edges)
  for (const [id, p] of Object.entries(state.layout)) {
    const n = DATA.nodes[id];
    if (!n.parent || !state.layout[n.parent]) continue;
    const par = state.layout[n.parent];
    const seg = clippedSegment(par, p, 4);
    const isTrunk = trunkSet.has(id) && trunkSet.has(n.parent);
    const dim = q && !matches.has(id);

    if (isTrunk) {
      // Classic Kabbalah double-line golden path along the Middle Pillar
      const nx = -seg.uy * 2.8, ny = seg.ux * 2.8;
      const op = dim ? 0.18 : 0.82;
      edgesLayer.appendChild(elNS("line", {
        x1: seg.x1, y1: seg.y1, x2: seg.x2, y2: seg.y2,
        stroke: "#c9a66b", "stroke-width": 5, opacity: dim ? 0.04 : 0.1,
      }));
      for (const sgn of [-1, 1]) {
        edgesLayer.appendChild(elNS("line", {
          x1: seg.x1 + nx * sgn, y1: seg.y1 + ny * sgn,
          x2: seg.x2 + nx * sgn, y2: seg.y2 + ny * sgn,
          stroke: "#c9a66b", "stroke-width": 1.15, opacity: op,
        }));
      }
    } else {
      const stroke = n.status === "rejected" ? "#a65c4e" : "#78674d";
      const line = elNS("line", {
        x1: seg.x1, y1: seg.y1, x2: seg.x2, y2: seg.y2,
        stroke, "stroke-width": 1.15, opacity: dim ? 0.16 : 0.65,
      });
      if (n.status === "rejected") line.setAttribute("stroke-dasharray", "4 4");
      edgesLayer.appendChild(line);
    }
  }

  // 2. Cross-recipe & sibling comparison arcs in vertical layout
  const noSel = !state.selectedId && !state.selectedRefId;
  const obstacles = collectCanvasObstacles(true);
  const placedPills = [];

  const crossPairs = [];
  for (const [id] of Object.entries(state.layout)) {
    const n = DATA.nodes[id];
    if (!n.cross_compare || !n.compare_to || !state.layout[n.compare_to]) continue;
    crossPairs.push([id, n.compare_to]);
  }
  // Sort shorter sibling spans first so nested horizontal brackets never cross each other.
  crossPairs.sort((p1, p2) => {
    const d1 = Math.abs(state.layout[p1[0]].cx - state.layout[p1[1]].cx);
    const d2 = Math.abs(state.layout[p2[0]].cx - state.layout[p2[1]].cx);
    return d1 - d2;
  });
  const treeMinX = allPos.length ? Math.min(...allPos.map(p => p.x)) : -200;
  const treeMaxX = allPos.length ? Math.max(...allPos.map(p => p.x + p.w)) : 200;
  const sameRowRank = {};
  let leftOuterIdx = 0;
  let rightOuterIdx = 0;

  crossPairs.forEach(([srcId, dstId]) => {
    const a = state.layout[srcId], b = state.layout[dstId];
    const src = DATA.nodes[srcId];
    const active = !state.selectedRefId && (state.selectedId === srcId || state.selectedId === dstId);
    const isRootArc = srcId === DATA.meta.root_id;
    const sameRow = Math.abs(a.cy - b.cy) < 12;
    if (!noSel && !active && !isRootArc) return;
    const targetLayer = (active || isRootArc) ? arcsFgLayer : arcsBgLayer;

    if (sameRow) {
      // Horizontal sibling row: nested rounded U-bracket beneath the row, with pill seated directly on its own rail.
      const rank = sameRowRank[dstId] || 0;
      sameRowRank[dstId] = rank + 1;
      const y1 = a.y + a.h + 2, y2 = b.y + b.h + 2;
      const baseY = Math.max(y1, y2) + (active ? 26 : 16);
      const railStep = active ? 28 : 14;
      let railY = baseY + rank * railStep;

      let txt = "", pillW = 0, lx = (a.cx + b.cx) / 2;
      if (active) {
        txt = src.delta_bpb != null ? `${fmtDelta(src.delta_bpb)} BPB` : L.arcFallback(src.compare_to);
        pillW = Math.max(82, Math.round(txt.length * 6.8 + 16));
        for (let step = 0; step < 8; step++) {
          const rect = { x: lx - pillW / 2 - 4, y: railY - 14, w: pillW + 8, h: 28 };
          if (isRectClear(rect, obstacles, placedPills)) break;
          railY += 28;
        }
      }

      const br = roundedRowBracket(a.cx, y1, b.cx, y2, railY);
      targetLayer.appendChild(elNS("path", {
        d: br.d, fill: "none", stroke: "#7ea8c4",
        "stroke-width": active ? 1.8 : 1.2,
        "stroke-dasharray": "4 4",
        opacity: active ? 0.92 : (noSel ? 0.42 : 0.28),
        "marker-end": "url(#arrow-sep-blue)",
      }));
      if (active) {
        const px = lx - pillW / 2;
        const py = railY - 10;
        targetLayer.appendChild(elNS("rect", {
          x: px, y: py, width: pillW, height: 20, rx: 10,
          fill: "#1a2228", stroke: "#7ea8c4", "stroke-width": 1,
        }));
        targetLayer.appendChild(elNS("text", {
          x: lx, y: railY + 3.5, "text-anchor": "middle",
          "font-size": 10.5, "font-weight": 400, fill: "#b8d6ea", "font-family": "var(--mono)",
        }, txt));
        placedPills.push({ x: px - 4, y: py - 4, w: pillW + 8, h: 28 });
      }
      return;
    }

    // Balance vertical/cross-tier arcs across left and right flanks, keeping pills strictly clear of nodes.
    const avgCx = (a.cx + b.cx) / 2;
    let goRight;
    if (isRootArc) goRight = false;
    else if (Math.abs(avgCx) > 15) goRight = avgCx > 0;
    else goRight = leftOuterIdx > rightOuterIdx;

    const showPill = active || isRootArc;
    if (showPill) {
      const txt = src.delta_bpb != null
        ? (isRootArc
            ? L.arcRootLabel(fmtDelta(-src.delta_bpb))
            : L.arcOtherLabel(src.compare_to, fmtDelta(src.delta_bpb)))
        : L.arcFallback(src.compare_to);
      const charW = state.lang === "en" ? 6.4 : 8.4;
      const pillW = Math.max(176, Math.round(txt.length * charW + 24));
      const routed = routeVerticalArc({
        a, b, preferRight: goRight, pillW, pillH: 22,
        obstacles, placedPills, ignoreIds: new Set([srcId, dstId]), treeMinX, treeMaxX,
      });
      placedPills.push(routed.rect);
      if (routed.lx >= 0) rightOuterIdx++; else leftOuterIdx++;

      targetLayer.appendChild(elNS("path", {
        d: routed.d, fill: "none", stroke: "#7ea8c4",
        "stroke-width": active ? 2.2 : 1.4,
        "stroke-dasharray": "5 5",
        opacity: active ? 0.92 : (isRootArc ? 0.5 : 0.25),
        "marker-end": "url(#arrow-sep-blue)",
      }));
      targetLayer.appendChild(elNS("rect", {
        x: routed.lx - pillW / 2, y: routed.ly - 11, width: pillW, height: 22, rx: 11,
        fill: "#182026", stroke: active ? "#7ea8c4" : "rgba(126,168,196,0.45)", "stroke-width": 1,
      }));
      targetLayer.appendChild(elNS("text", {
        x: routed.lx, y: routed.ly + 3.5, "text-anchor": "middle",
        "font-size": 10.5, "font-weight": 400, fill: "#b8d6ea",
      }, txt));
    } else {
      const sideIdx = goRight ? rightOuterIdx++ : leftOuterIdx++;
      const x1 = goRight ? (a.cx + a.r + 4) : (a.cx - a.r - 4);
      const x2 = goRight ? (b.cx + b.r + 4) : (b.cx - b.r - 4);
      const y1 = a.cy, y2 = b.cy;
      const outerX = goRight
        ? Math.max(treeMaxX + 54, Math.max(x1, x2) + 96) + sideIdx * 36
        : Math.min(treeMinX - 54, Math.min(x1, x2) - 96) - sideIdx * 36;
      const d = `M ${x1} ${y1} C ${outerX} ${y1}, ${outerX} ${y2}, ${x2} ${y2}`;
      targetLayer.appendChild(elNS("path", {
        d, fill: "none", stroke: "#7ea8c4",
        "stroke-width": 1.4,
        "stroke-dasharray": "5 5",
        opacity: noSel ? 0.42 : 0.25,
        "marker-end": "url(#arrow-sep-blue)",
      }));
    }
  });

  // 2b. Inspiration secret paths (all shown subtly when nothing is selected; focused with pills on select)
  function visibleAnchor(id) {
    let cur = id;
    while (cur && !state.layout[cur]) cur = DATA.nodes[cur]?.parent;
    return cur;
  }
  const inspireEdges = [];
  const seenInspire = new Set();
  if (state.showInspiration && !state.selectedRefId) {
    for (const n of Object.values(DATA.nodes)) {
      for (const edge of (n.inspired_by || [])) {
        if (noSel || state.selectedId === n.id || state.selectedId === edge.id) {
          const srcVis = visibleAnchor(edge.id);
          const dstVis = visibleAnchor(n.id);
          const key = `${srcVis}->${dstVis}`;
          if (srcVis && dstVis && srcVis !== dstVis && (!noSel || !seenInspire.has(key))) {
            seenInspire.add(key);
            inspireEdges.push({ srcId: srcVis, dstId: dstVis, reason: pick(edge, "reason") });
          }
        }
      }
    }
  }
  inspireEdges.forEach((ie, idx) => {
    const a = state.layout[ie.srcId], b = state.layout[ie.dstId];
    const preferRight = (a.cx + b.cx) >= 0;
    if (noSel) {
      const goRight = preferRight;
      const sideIdx = goRight ? rightOuterIdx++ : leftOuterIdx++;
      const x1 = goRight ? (a.cx + a.r + 4) : (a.cx - a.r - 4);
      const x2 = goRight ? (b.cx + b.r + 4) : (b.cx - b.r - 4);
      const y1 = a.cy, y2 = b.cy;
      const outerX = goRight
        ? Math.max(treeMaxX + 44, Math.max(x1, x2) + 84) + (sideIdx % 4) * 28
        : Math.min(treeMinX - 44, Math.min(x1, x2) - 84) - (sideIdx % 4) * 28;
      const d = `M ${x1} ${y1} C ${outerX} ${y1}, ${outerX} ${y2}, ${x2} ${y2}`;
      arcsBgLayer.appendChild(elNS("path", {
        d, fill: "none", stroke: "#d8a254", "stroke-width": 1.4,
        "stroke-dasharray": "2.5 4.5", "stroke-linecap": "round", opacity: 0.42,
        "marker-end": "url(#arrow-gold)",
      }));
      return;
    }
    const rawTxt = ie.reason ? `${L.inspireBadge} · ${truncLang(ie.reason, 20, 34)}` : L.inspireBadge;
    const charW = state.lang === "en" ? 6.2 : 8.4;
    const pillW = Math.max(88, Math.round(rawTxt.length * charW + 18));
    const routed = routeVerticalArc({
      a, b, preferRight, pillW, pillH: 22,
      obstacles, placedPills, ignoreIds: new Set([ie.srcId, ie.dstId]), treeMinX, treeMaxX,
    });
    placedPills.push(routed.rect);
    arcsFgLayer.appendChild(elNS("path", {
      d: routed.d, fill: "none", stroke: "#d8a254", "stroke-width": 1.9,
      "stroke-dasharray": "2.5 4.5", "stroke-linecap": "round", opacity: 0.92,
      "marker-end": "url(#arrow-gold)",
    }));
    arcsFgLayer.appendChild(elNS("rect", {
      x: routed.lx - pillW / 2, y: routed.ly - 11, width: pillW, height: 22, rx: 11,
      fill: "#221c13", stroke: "#d8a254", "stroke-width": 1,
    }));
    arcsFgLayer.appendChild(elNS("text", {
      x: routed.lx, y: routed.ly + 3.5, "text-anchor": "middle",
      "font-size": 10.5, "font-weight": 400, fill: "#e8c486",
    }, rawTxt));
  });

  // 2c. External reference star-crown strip (above Kether)
  if (state.showRefs && Object.keys(state.refLayout).length) {
    const refVals = Object.values(state.refLayout);
    const crownMinX = Math.min(...refVals.map(p => p.x));
    const crownMaxX = Math.max(...refVals.map(p => p.x + p.w));
    refsLayer.appendChild(elNS("text", {
      x: (crownMinX + crownMaxX) / 2, y: 18, "text-anchor": "middle",
      "font-size": 10.5, "font-weight": 400, "letter-spacing": "0.14em", fill: "#74aba2", opacity: 0.9,
    }, `✦  ${L.refStripLabel}  ✦`));

    for (const [rid, rp] of Object.entries(state.refLayout)) {
      const r = DATA.refs[rid];
      const isSel = state.selectedRefId === rid;
      const rg = elNS("g", {
        class: [
          "ref-node-g",
          isSel ? "selected" : "",
          q && !refMatches.has(rid) ? "dim" : "",
        ].filter(Boolean).join(" "),
        transform: `translate(${rp.x}, ${rp.y})`,
      });
      // Chamfered octagon antique tablet for external knowledge cards
      const c = 10, w = rp.w, h = rp.h;
      const pts = `${c},0 ${w - c},0 ${w},${c} ${w},${h - c} ${w - c},${h} ${c},${h} 0,${h - c} 0,${c}`;
      rg.appendChild(elNS("polygon", {
        class: "node-rect", points: pts,
        fill: isSel ? "#1b2826" : "#171f1e",
        stroke: isSel ? "#98cbc2" : "#4b746d",
        "stroke-width": isSel ? 1.8 : 1.1,
      }));
      rg.appendChild(elNS("text", {
        x: 12, y: 18, "font-size": 9.5, "font-weight": 400, "letter-spacing": "0.08em", fill: "#74aba2",
      }, refKindLabel(r.kind)));
      rg.appendChild(elNS("text", {
        x: w - 12, y: 18, "text-anchor": "end", "font-size": 9.2, fill: "#6b8b86",
      }, L.refUsedCount((r.used_by || []).length)));
      rg.appendChild(elNS("text", {
        x: 12, y: 36, "font-size": 12, "font-weight": 400, fill: "#e8decb",
      }, truncLang(pick(r, "label") || r.id, 13, 22)));
      rg.appendChild(elNS("text", {
        x: 12, y: 50, "font-size": 9.5, fill: "#839995",
      }, trunc(r.authors || (r.links[0]?.label || ""), 26)));

      rg.addEventListener("click", () => selectRef(rid));
      refsLayer.appendChild(rg);
    }

    // Teal light rays from crown refs to linked Sephiroth (all subtly when nothing is selected; focused on select)
    const refEdges = [];
    const seenRef = new Set();
    for (const r of Object.values(DATA.refs || {})) {
      const rp = state.refLayout[r.id];
      if (!rp) continue;
      for (const u of (r.used_by || [])) {
        if (noSel || state.selectedRefId === r.id || (!state.selectedRefId && state.selectedId === u.id)) {
          const dstVis = visibleAnchor(u.id);
          const key = `${r.id}->${dstVis}`;
          if (dstVis && state.layout[dstVis] && !seenRef.has(key)) {
            seenRef.add(key);
            refEdges.push({ refId: r.id, dstId: dstVis });
          }
        }
      }
    }
    refEdges.forEach((re, idx) => {
      const rp = state.refLayout[re.refId], dp = state.layout[re.dstId];
      const x1 = rp.cx, y1 = rp.y + rp.h + 2;
      const x2 = dp.cx, y2 = dp.cy - dp.r - 4;
      const midY = y1 + (y2 - y1) * (0.35 + (idx % 3) * 0.14);
      const d = `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`;
      const targetLayer = noSel ? arcsBgLayer : arcsFgLayer;
      targetLayer.appendChild(elNS("path", {
        d, fill: "none", stroke: "#74aba2", "stroke-width": noSel ? 1.2 : 1.6,
        "stroke-dasharray": "6 3 2 3", opacity: noSel ? 0.34 : 0.88,
        "marker-end": "url(#arrow-sep-teal)",
      }));
    });
  }

  // 3. Sephiroth Nodes (circular antique sigils)
  const trunkIndex = {};
  DATA.meta.trunk.forEach((tid, i) => { trunkIndex[tid] = i; });

  for (const [id, p] of Object.entries(state.layout)) {
    const n = DATA.nodes[id];
    const big = isMilestoneNode(n);
    const r = p.r;
    const isSel = !state.selectedRefId && state.selectedId === id;
    const g = elNS("g", {
      class: [
        "node-g",
        isSel ? "selected" : "",
        q && !matches.has(id) ? "dim" : "",
      ].filter(Boolean).join(" "),
      transform: `translate(${p.cx}, ${p.cy})`,
    });

    // Palette per Sephirah role
    let fill = "#1c1915", stroke = "#6a5c47", innerStroke = "rgba(201,166,107,0.22)", accent = "#c9a66b";
    if (n.status === "root") {
      fill = "#201a24"; stroke = "#b196ce"; innerStroke = "rgba(177,150,206,0.35)"; accent = "#cbb5e4";
    } else if (n.is_head) {
      fill = "#231e15"; stroke = "#e2c48c"; innerStroke = "rgba(226,196,140,0.45)"; accent = "#f0d7a2";
    } else if (n.status === "adopted") {
      fill = "#1f1b14"; stroke = "#c9a66b"; innerStroke = "rgba(201,166,107,0.35)"; accent = "#dfbe82";
    } else if (n.status === "rejected") {
      fill = "#211715"; stroke = "#b56354"; innerStroke = "rgba(181,99,84,0.3)"; accent = "#d98879";
    } else if (n.is_group) {
      fill = "#201b13"; stroke = "#c8964e"; innerStroke = "rgba(200,150,78,0.34)"; accent = "#e2b872";
    } else if (big) {
      fill = "#211c13"; stroke = "#d8a254"; innerStroke = "rgba(216,162,84,0.38)"; accent = "#e8be7a";
    }

    // Subtle golden aura behind milestone / HEAD nodes
    if (n.is_head || n.status === "root") {
      g.appendChild(elNS("circle", {
        cx: 0, cy: 0, r: r + 7, fill: "none",
        stroke: stroke, "stroke-width": 0.9, opacity: 0.28, "stroke-dasharray": "2 4",
      }));
    }

    // Outer circle
    const outer = elNS("circle", {
      class: "node-rect", cx: 0, cy: 0, r, fill, stroke,
      "stroke-width": big ? 1.8 : 1.2,
    });
    if (n.status === "rejected" || n.is_placeholder) outer.setAttribute("stroke-dasharray", "5 4");
    else if (n.is_group && state.collapsed[id]) outer.setAttribute("stroke-dasharray", "6 3");
    if (n.is_head) outer.setAttribute("filter", "url(#gold-glow)");
    g.appendChild(outer);

    // Inner sacred ring & cardinal tick marks on milestones; inscribed diamond on group clusters
    if (n.is_group) {
      const dr = r * 0.72;
      g.appendChild(elNS("polygon", {
        points: `0,${-dr} ${dr},0 0,${dr} ${-dr},0`,
        fill: "none", stroke: innerStroke, "stroke-width": 0.9,
      }));
    } else if (big) {
      g.appendChild(elNS("circle", {
        cx: 0, cy: 0, r: r - 5.5, fill: "none", stroke: innerStroke, "stroke-width": 0.85,
      }));
      for (const [tx1, ty1, tx2, ty2] of [
        [0, -r - 3, 0, -r + 4], [0, r - 4, 0, r + 3],
        [-r - 3, 0, -r + 4, 0], [r - 4, 0, r + 3, 0],
      ]) {
        g.appendChild(elNS("line", {
          x1: tx1, y1: ty1, x2: tx2, y2: ty2, stroke: accent, "stroke-width": 1.0, opacity: 0.75,
        }));
      }
    }

    // Top numeral / emblem inside circle
    if (big) {
      const sigil = trunkIndex[id] != null ? (ROMAN[trunkIndex[id]] || "✦") : "✦";
      g.appendChild(elNS("text", {
        x: 0, y: -r + 17, "text-anchor": "middle",
        "font-size": 10.5, "font-weight": 400, "letter-spacing": "0.14em", fill: accent,
      }, sigil));
    }

    // Label (thin antique serif)
    const lblMaxZh = big ? 8 : 7;
    const lblMaxEn = big ? 14 : 12;
    g.appendChild(elNS("text", {
      x: 0, y: big ? -11 : -9, "text-anchor": "middle",
      "font-size": big ? 12.2 : 11, "font-weight": 400, "letter-spacing": "0.04em", fill: "#efe5d3",
    }, truncLang(nodeLabel(n), lblMaxZh, lblMaxEn)));

    // Main metric (val BPB or group best)
    if (n.is_group) {
      const gs = n.group_stats || {};
      g.appendChild(elNS("text", {
        x: 0, y: 10, "text-anchor": "middle",
        "font-size": big ? 13 : 11.5, "font-weight": 400, fill: accent, "font-family": "var(--mono)",
      }, fmtBpb(gs.best_bpb)));
      g.appendChild(elNS("text", {
        x: 0, y: 24, "text-anchor": "middle",
        "font-size": 9.5, fill: "#9e917c",
      }, `${gs.count || 0} runs`));
    } else {
      const bpbText = n.is_placeholder && n.val_bpb != null ? `~${fmtBpb(n.val_bpb)}` : fmtBpb(n.val_bpb);
      g.appendChild(elNS("text", {
        x: 0, y: big ? 11 : 10, "text-anchor": "middle",
        "font-size": big ? 15 : 12.5, "font-weight": 400, fill: n.is_placeholder ? "#bfb39d" : "#f4ead7", "font-family": "var(--mono)",
      }, bpbText));

      // Delicate delta inscription below BPB
      let dTxt = "", dCol = "#968a75";
      if (n.is_placeholder) {
        dTxt = L.placeholderCardTag; dCol = "#cbb5e4";
      } else if (n.delta_bpb != null) {
        dTxt = fmtDelta(n.delta_bpb);
        if (n.in_noise) { dCol = "#8a7f6c"; dTxt += " · " + L.deltaNoiseShort; }
        else if (n.delta_bpb < 0) dCol = "#dfbe82";
        else dCol = "#d98474";
      } else if (n.compare_to && DATA.nodes[n.compare_to]?.is_placeholder) {
        dTxt = L.placeholderRefPending; dCol = "#9e917c";
      } else if (n.status === "adopted" && n.parent === DATA.meta.root_id && DATA.nodes[DATA.meta.root_id]?.cross_compare) {
        dTxt = L.deltaSeeArc; dCol = "#8eb4cc";
      } else if (n.compare_to == null && n.status !== "root") {
        dTxt = L.deltaStandalone; dCol = "#8a7f6c";
      }
      if (dTxt) {
        g.appendChild(elNS("text", {
          x: 0, y: big ? 28 : 24, "text-anchor": "middle",
          "font-size": 9.6, "font-weight": 400, fill: dCol, "font-family": "var(--mono)",
        }, dTxt));
      }
    }

    // Bottom centered compact artifact leaf pills or group expand/collapse seal
    const footY = r + 9;
    if (n.is_group) {
      const isCol = Boolean(state.collapsed[id]);
      const gs = n.group_stats || {};
      const btnText = isCol ? `✦ +${gs.count || n.children.length}` : "✦ −";
      const bw = Math.max(54, btnText.length * 8 + 16);
      const tg = elNS("g", { class: "toggle-btn", transform: `translate(${-bw / 2}, ${footY})` });
      tg.appendChild(elNS("rect", {
        x: 0, y: 0, width: bw, height: 18, rx: 9,
        fill: "#231d14", stroke: "#c8964e", "stroke-width": 0.9,
      }));
      tg.appendChild(elNS("text", {
        x: bw / 2, y: 12.5, "text-anchor": "middle",
        "font-size": 10, "font-weight": 400, fill: "#e6c384",
      }, btnText));
      tg.addEventListener("click", (ev) => {
        ev.stopPropagation();
        state.collapsed[id] = !state.collapsed[id];
        renderTree();
      });
      g.appendChild(tg);
    } else if (n.artifacts) {
      drawLeafPillsSephiroth(g, n, footY);
    }

    g.addEventListener("click", () => selectNode(id));
    nodesLayer.appendChild(g);
  }
}

function drawLeafPillsSephiroth(g, n, y) {
  const a = n.artifacts;
  const hasT2 = n.bench && n.bench.tier === "tier2";
  const hasBench = Boolean(n.bench);
  const pills = [
    { label: "ckpt", ok: a.ckpt_exists, tab: "artifacts", fg: a.ckpt_exists ? "#d6b77c" : "#645b4d" },
    { label: hasT2 ? "T2" : (hasBench ? "T1" : "—"), ok: hasBench, tab: "bench", fg: hasT2 ? "#8eb4cc" : (hasBench ? "#7a98ad" : "#645b4d") },
    { label: "smp", ok: a.samples_exists, tab: "artifacts", fg: a.samples_exists ? "#b89fd4" : "#645b4d" },
  ];
  const widths = pills.map(pl => Math.max(24, Math.round(pl.label.length * 6.2 + 12)));
  const totalW = widths.reduce((s, w) => s + w, 0) + (pills.length - 1) * 4;
  let cx = -totalW / 2;
