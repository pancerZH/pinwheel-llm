<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&display=swap">
<style>
  /* VOICE work: a lab notebook figure read by the author and reviewers
     IDEA a newspaper graphics-desk diagram: one bold trunk route, each step's experiments hanging in its own lane
     PICTURE the lane diagram: trunk stations across the top, branches listed under the step they explored
     COLOUR salmon paper ground, ink, teal for the trunk, claret for regressions, oxford blue for comparisons
     TYPE Libre Franklin (Latin and figures) + PingFang / Noto Sans SC (CJK)
     LAYOUT header strip; canvas left with floating toolbar and legend; drawer right, stacked under it below 900px */
  :root {
    --surface: #fbe9df;
    --panel: #fffaf6;
    --card: #ffffff;
    --subtle: #f6e6dd;
    --ink: #1a1817;
    --ink-2: #4a4441;
    --muted: #7a706b;
    --grid: #ead5ca;
    --axis: #d2b6a8;
    --blue: #0f5499;
    --blue-bg: #e2ecf7;
    --green: #0d7680;
    --green-dark: #08575e;
    --green-bg: #dbefed;
    --red: #990f3d;
    --red-bg: #f7dfe6;
    --amber: #a86400;
    --amber-bg: #fbebcd;
    --teal: #0d7680;
    --teal-dark: #08575e;
    --teal-bg: #dbefed;
    --ref: #5b4a8f;
    --ref-dark: #43356e;
    --ref-bg: #ebe5f4;
    --purple: #1a1817;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    --sans: "Libre Franklin", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Noto Sans CJK SC", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--surface); color: var(--ink);
    font-family: var(--sans); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; flex-direction: column; height: 100%; }
  button, input, select { font-family: inherit; }

  /* Header */
  header {
    display: flex; align-items: center; gap: 12px 28px; flex-wrap: wrap;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--grid);
    flex-shrink: 0;
  }
  .brand { display: flex; flex-direction: column; min-width: 0; }
  .brand h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
  .brand .sub { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
  .headline-stat {
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
    padding-left: 24px; border-left: 1px solid var(--grid);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .hs-label { font-size: 12px; color: var(--muted); }
  .hs-num { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink-2); }
  .hs-num.hs-head { color: var(--green-dark); }
  .hs-arrow { font-size: 18px; color: var(--axis); margin: 0 2px; }
  .hs-unit { font-size: 12px; color: var(--muted); margin-left: 4px; }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .controls input[type="search"] {
    width: 200px; padding: 6px 10px; border: 1px solid var(--axis); border-radius: 8px;
    background: var(--card); color: var(--ink); font-size: 13px; outline: none;
  }
  .controls input[type="search"]:focus { border-color: var(--ink); }
  .btn {
    padding: 6px 10px; border: 1px solid transparent; border-radius: 7px;
    background: transparent; color: var(--ink-2); font-size: 12.5px; font-weight: 600; cursor: pointer;
    transition: background .12s, border-color .12s, color .12s; white-space: nowrap;
  }
  .btn:hover { background: var(--subtle); color: var(--ink); }
  .btn.active { background: var(--ink); color: var(--panel); }
  .btn:focus-visible, .tab:focus-visible, .lang-switch button:focus-visible, .skin-switch button:focus-visible {
    outline: 2px solid var(--blue); outline-offset: 1px;
  }

  .lang-switch, .skin-switch {
    display: inline-flex; border: 1px solid var(--axis); border-radius: 8px; overflow: hidden;
    background: var(--card);
  }
  .lang-switch button, .skin-switch button {
    border: none; background: transparent; padding: 5px 10px; font-size: 12px; font-weight: 600;
    color: var(--ink-2); cursor: pointer;
  }
  .lang-switch button.active, .skin-switch button.active { background: var(--ink); color: var(--panel); }

  /* Alert banner for uncataloged / running runs */
  .banner {
    display: none; padding: 7px 20px; background: var(--amber-bg); border-bottom: 1px solid #efd29c;
    color: #6b4100; font-size: 12.5px; align-items: center; gap: 12px; flex-shrink: 0;
  }
  .banner.show { display: flex; }

  /* Main split layout */
  .workspace { display: flex; flex: 1; min-height: 0; position: relative; }
  .canvas-wrap {
    flex: 1; position: relative; overflow: hidden; cursor: grab; min-width: 0;
    background-color: var(--surface);
  }
  .canvas-wrap.dragging { cursor: grabbing; }
  svg#tree-svg { width: 100%; height: 100%; display: block; user-select: none; }

  .toolbar {
    position: absolute; top: 12px; left: 12px; display: flex; align-items: center; gap: 2px; flex-wrap: wrap;
    padding: 4px; background: var(--card); border: 1px solid var(--grid); border-radius: 10px;
    box-shadow: 0 1px 2px rgba(26, 24, 23, 0.06); max-width: calc(100% - 24px);
  }
  .tb-sep { width: 1px; height: 18px; background: var(--grid); margin: 0 4px; }

  .legend {
    position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px 16px; align-items: center; flex-wrap: wrap;
    padding: 8px 12px; background: var(--card); border: 1px solid var(--grid);
    border-radius: 10px; font-size: 12px; color: var(--ink-2); max-width: calc(100% - 24px);
    pointer-events: none;
  }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .legend-note { color: var(--muted); }
  .sw-trunk { width: 18px; height: 4px; border-radius: 2px; background: var(--green); display: inline-block; }
  .sw-card { width: 14px; height: 10px; border-radius: 3px; display: inline-block; border: 1px solid var(--axis); background: var(--card); }
  .sw-head { background: var(--green); border-color: var(--green-dark); }
  .sw-rejected { border: 1px dashed var(--red); }
  .sw-target { border: 1.5px dashed var(--blue); }
  .sw-chip { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 8px; font-variant-numeric: tabular-nums; }
  .sw-good { background: var(--green-bg); color: var(--green-dark); }
  .sw-bad { background: var(--red-bg); color: var(--red); }
  .swatch-line { width: 18px; height: 0; border-top: 2px dashed var(--blue); display: inline-block; }
  .swatch-inspire { width: 18px; height: 0; border-top: 2px dotted var(--amber); display: inline-block; }
  .swatch-ref { width: 18px; height: 0; border-top: 2px dashed var(--ref); display: inline-block; }
  /* legacy swatch, still used by the Sephiroth legend colours */
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  /* Detail drawer */
  aside.drawer {
    width: 420px; max-width: 42vw; min-width: 340px; background: var(--panel);
    border-left: 1px solid var(--grid); display: flex; flex-direction: column; flex-shrink: 0;
  }
  .drawer-head { padding: 18px 20px 12px; border-bottom: 1px solid var(--grid); }
  .drawer-badges { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px;
    font-size: 11.5px; font-weight: 600; border: 1px solid transparent;
  }
  .badge-root { background: var(--ink); color: var(--panel); }
  .badge-adopted { background: var(--green-bg); color: var(--green-dark); }
  .badge-branch { background: var(--subtle); color: var(--ink-2); }
  .badge-rejected { background: var(--red-bg); color: var(--red); }
  .badge-group { background: var(--amber-bg); color: #7a4800; }
  .badge-milestone { background: transparent; color: var(--ink-2); border-color: var(--axis); }
  .badge-placeholder { background: transparent; color: var(--muted); border: 1px dashed var(--axis); }
  .badge-ref { background: var(--ref-bg); color: var(--ref-dark); }
  .badge-target { background: var(--blue-bg); color: var(--blue); }
  .drawer-title { margin: 0; font-size: 21px; font-weight: 800; line-height: 1.2; letter-spacing: -0.015em; }
  .drawer-runid {
    margin-top: 4px; font-family: var(--mono); font-size: 12px; color: var(--muted);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }

  .tabs {
    display: flex; border-bottom: 1px solid var(--grid); padding: 0 20px; gap: 20px;
    background: var(--panel); flex-shrink: 0;
  }
  .tab {
    padding: 10px 0; border: none; background: none; color: var(--muted); font-size: 13px;
    font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--ink); border-bottom-color: var(--green); }

  .drawer-body { flex: 1; overflow-y: auto; padding: 16px 20px 28px; }
  .drawer-body code { font-family: var(--mono); font-size: 0.92em; background: var(--subtle); padding: 0 3px; border-radius: 3px; }

  .takeaway-box {
    padding: 12px 14px; background: var(--card); border: 1px solid var(--grid);
    border-radius: 10px; margin-bottom: 12px; color: var(--ink); font-size: 14px; line-height: 1.6;
  }
  .takeaway-box.rejected { border: 1px dashed var(--red); }
  .protocol-box {
    padding: 9px 12px; background: var(--blue-bg); border-radius: 8px; margin-bottom: 14px;
    font-size: 12.5px; color: #163d66; line-height: 1.55;
  }
  .protocol-box strong { color: #0c2f55; }

  .kpi-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { padding: 10px 12px; border: 1px solid var(--grid); border-radius: 10px; background: var(--card); min-width: 0; }
  .kpi-label { font-size: 12px; color: var(--muted); }
  .kpi-val {
    font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px;
    letter-spacing: -0.02em; line-height: 1.2;
  }
  .kpi-sub { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
  .delta-good { color: var(--green-dark); }
  .delta-bad { color: var(--red); }
  .delta-noise { color: var(--muted); }

  .section-h { font-size: 13px; font-weight: 700; color: var(--ink); margin: 20px 0 8px; }
  .meta-list {
    display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 5px 12px; font-size: 12.5px;
    padding: 10px 12px; background: var(--card); border: 1px solid var(--grid); border-radius: 10px; margin: 0;
  }
  .meta-list dt { color: var(--muted); }
  .meta-list dd { margin: 0; font-family: var(--mono); font-size: 12px; color: var(--ink); overflow-wrap: anywhere; }

  table.data { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  table.data th, table.data td { padding: 7px 6px; border-bottom: 1px solid var(--grid); text-align: right; }
  table.data th:first-child, table.data td:first-child { text-align: left; padding-left: 0; }
  table.data th:last-child, table.data td:last-child { padding-right: 0; }
  table.data th { color: var(--muted); font-weight: 600; font-size: 12px; }
  table.data tr:last-child td { border-bottom: none; }
  .diff-old { color: var(--muted); text-decoration: line-through; margin-right: 4px; }
  .diff-new { color: var(--ink); font-weight: 700; }

  .link-btn {
    background: none; border: none; padding: 0; color: var(--blue); cursor: pointer; text-align: left;
    font-size: inherit; font-family: inherit; text-decoration: underline; text-decoration-color: rgba(15, 84, 153, 0.35);
    text-underline-offset: 3px;
  }
  .link-btn:hover { text-decoration-color: currentColor; }

  .note-small { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  .empty-state { padding: 24px 10px; text-align: center; color: var(--muted); font-size: 13px; }

  /* Curve box */
  .curve-wrap { border: 1px solid var(--grid); border-radius: 10px; background: var(--card); padding: 12px; }
  .curve-legend { display: flex; gap: 6px 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 8px; flex-wrap: wrap; }
  .curve-dot { display: inline-block; width: 12px; height: 3px; vertical-align: middle; margin-right: 5px; border-radius: 2px; }

  /* Samples viewer */
  .sample-controls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .sample-controls select {
    width: 100%; padding: 7px 8px; border: 1px solid var(--axis); border-radius: 8px;
    background: var(--card); font-size: 13px; color: var(--ink);
  }
  .sample-controls label { font-size: 12.5px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .sample-card {
    padding: 12px 14px; border: 1px solid var(--grid); border-radius: 10px; background: var(--card);
    font-size: 13px; white-space: pre-wrap; word-break: break-word; line-height: 1.6; margin-bottom: 10px;
  }
  .sample-card.sample-ref { background: var(--subtle); }
  .sample-card-head {
    font-size: 11.5px; font-weight: 600; color: var(--muted); margin-bottom: 6px;
    display: flex; justify-content: space-between; font-family: var(--mono);
  }
  .sample-prompt { font-weight: 700; color: var(--ink); background: var(--amber-bg); padding: 0 3px; border-radius: 3px; }
  .artifact-row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px;
    border: 1px solid var(--grid); border-radius: 8px; margin-bottom: 6px; background: var(--card);
    font-size: 12.5px;
  }
  .artifact-path { font-family: var(--mono); font-size: 12px; color: var(--ink); overflow-wrap: anywhere; }
  .artifact-status { font-size: 12px; font-weight: 600; white-space: nowrap; }
  .ok { color: var(--green-dark); }
  .miss { color: var(--muted); }

  .inspire-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
  .inspire-item {
    padding: 8px 12px; background: var(--amber-bg); border-radius: 8px; font-size: 13px; color: #4f3000;
  }
  .inspire-item .reason { display: block; margin-top: 2px; color: var(--ink-2); font-size: 12.5px; }
  .ref-item {
    padding: 8px 12px; background: var(--ref-bg); border-radius: 8px; font-size: 13px; color: var(--ref-dark);
  }
  .ref-item .reason { display: block; margin-top: 3px; color: var(--ink-2); font-size: 12.5px; }
  .ref-summary-box {
    padding: 12px 14px; background: var(--ref-bg); border-radius: 10px; margin-bottom: 14px;
    color: var(--ink); font-size: 14px; line-height: 1.6;
  }
  .ext-link-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .ext-link {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 9px 12px; border: 1px solid var(--grid); border-radius: 8px; background: var(--card);
    color: var(--ref-dark); text-decoration: none; font-size: 13px; font-weight: 600;
  }
  .ext-link:hover { background: var(--ref-bg); border-color: var(--ref); }
  .ext-mini { display: inline-block; margin-left: 6px; font-size: 12px; color: var(--ref); text-decoration: none; font-weight: 600; }
  .ext-mini:hover { text-decoration: underline; }

  /* ---------- Paper skin: SVG diagram ---------- */
  .lane { fill: rgba(255, 255, 255, 0.42); }
  .lane-head { fill: rgba(13, 118, 128, 0.08); }
  .edge { fill: none; stroke: var(--axis); stroke-width: 1.5; }
  .edge.trunk { stroke: var(--green); stroke-width: 5; stroke-linecap: round; }
  .edge.rejected { stroke: var(--red); stroke-dasharray: 4 3; opacity: 0.7; }
  .edge.dim, .edge-chevron.dim { opacity: 0.25; }
  .edge-chevron { fill: none; stroke: var(--panel); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .node-g { cursor: pointer; transition: opacity .15s; }
  .node-g.dim { opacity: 0.26; }
  .node-g:hover .card { filter: drop-shadow(0 3px 8px rgba(26, 24, 23, 0.12)); }
  .card { fill: var(--card); stroke: var(--axis); stroke-width: 1; }
  .card-trunk { stroke: var(--green); stroke-width: 1.6; }
  .card-root { fill: var(--ink); stroke: var(--ink); }
  .card-head { fill: var(--green); stroke: var(--green-dark); stroke-width: 1.6; }
  .card-rejected { stroke: var(--red); stroke-dasharray: 5 3; }
  .card-placeholder { stroke: var(--muted); stroke-dasharray: 5 3; }
  .card-target { stroke: var(--blue); stroke-width: 1.5; stroke-dasharray: 6 3; }
  .card-stack { fill: var(--subtle); stroke: var(--axis); stroke-width: 1; }
  .sel-ring { fill: none; stroke: var(--ink); stroke-width: 2.2; }

  .tx { font-family: var(--sans); fill: var(--ink); }
  .tx-ms { font-size: 12px; font-weight: 700; fill: var(--green); }
  .tx-ms-side { font-size: 11.5px; font-weight: 700; fill: var(--amber); }
  .tx-ms-target { fill: var(--blue); }
  .tx-id { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
  .tx-label { font-size: 13.5px; font-weight: 600; }
  .tx-label-lg { font-size: 15px; font-weight: 700; }
  .tx-num { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .tx-num-lg { font-size: 27px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.025em; }
  .tx-meta { font-size: 12px; fill: var(--ink-2); font-variant-numeric: tabular-nums; }
  .tx-placeholder { fill: var(--muted); }
  .on-dark .tx { fill: #ffffff; }
  .on-dark .tx-ms { fill: rgba(255, 255, 255, 0.78); }
  .on-dark .tx-id { fill: rgba(255, 255, 255, 0.6); }

  .chip-tx { font-family: var(--sans); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .chip-good { fill: var(--green-bg); } .chip-tx-good { fill: var(--green-dark); }
  .chip-bad { fill: var(--red-bg); } .chip-tx-bad { fill: var(--red); }
  .chip-noise { fill: var(--subtle); } .chip-tx-noise { fill: var(--muted); }
  .chip-info { fill: var(--blue-bg); } .chip-tx-info { fill: var(--blue); }
  .on-dark .chip { fill: rgba(255, 255, 255, 0.16); }
  .on-dark .chip-tx { fill: #ffffff; }

  .lab-pill, .leaf-pill, .lab-toggle, .toggle-btn { cursor: pointer; }
  .leaf-pill:hover rect { opacity: 0.85; }
  .node-rect { transition: stroke .12s, filter .12s; }
  .lab-pill rect { fill: var(--subtle); }
  .lab-pill:hover rect { fill: var(--grid); }
  .lab-pill text { font-family: var(--sans); font-size: 10.5px; font-weight: 600; fill: var(--ink-2); }
  .lab-pill .dot { fill: var(--green); }
  .lab-pill.miss text { fill: var(--muted); }
  .lab-pill.miss .dot { fill: none; stroke: var(--axis); stroke-width: 1.2; }
  .on-dark .lab-pill rect { fill: rgba(255, 255, 255, 0.14); }
  .on-dark .lab-pill:hover rect { fill: rgba(255, 255, 255, 0.24); }
  .on-dark .lab-pill text { fill: rgba(255, 255, 255, 0.88); }
  .on-dark .lab-pill .dot { fill: #ffffff; }

  .lab-toggle { cursor: pointer; }
  .lab-toggle rect { fill: var(--amber-bg); }
  .lab-toggle:hover rect { fill: #f6dca8; }
  .lab-toggle text { font-family: var(--sans); font-size: 11.5px; font-weight: 700; fill: #6e4200; }

  .ref-node-g { cursor: pointer; transition: opacity .15s; }
  .ref-node-g.dim { opacity: 0.3; }
  .ref-card { fill: var(--card); stroke: var(--ref); stroke-opacity: 0.35; stroke-width: 1; }
  .ref-node-g:hover .ref-card { stroke-opacity: 0.8; }
  .ref-node-g.selected .ref-card { fill: var(--ref-bg); stroke: var(--ref); stroke-opacity: 1; stroke-width: 2; }
  .tx-ref-kind { font-size: 11.5px; font-weight: 700; fill: var(--ref); }
  .ref-icon { fill: var(--ref); }
  .strip-label { font-family: var(--sans); font-size: 12px; font-weight: 700; fill: var(--ink-2); }

  .link { fill: none; stroke-width: 1.9; stroke-linejoin: round; stroke-linecap: round; }
  .link-compare { stroke: var(--blue); stroke-dasharray: 6 4; }
  .link-inspire { stroke: var(--amber); stroke-dasharray: 0.5 5; stroke-width: 2.6; }
  .link-ref { stroke: var(--ref); stroke-dasharray: 9 3 2 3; }
  .link.faint { opacity: 0.5; stroke-width: 1.4; }
  .link-inspire.faint { stroke-width: 2; }
  .pill-bg { fill: var(--card); stroke-width: 1.2; }
  .pill-compare { stroke: var(--blue); } .pill-inspire { stroke: var(--amber); } .pill-ref { stroke: var(--ref); }
  .pill-tx { font-family: var(--sans); font-size: 11.5px; font-weight: 700; }
  .pill-tx-compare { fill: var(--blue); } .pill-tx-inspire { fill: #7a4800; } .pill-tx-ref { fill: var(--ref-dark); }
  .mk-blue { fill: var(--blue); } .mk-amber { fill: var(--amber); } .mk-ref { fill: var(--ref); }

  @media (max-width: 900px) {
    html, body { overflow: auto; }
    .app { height: auto; min-height: 100%; }
    .workspace { flex-direction: column; }
    .canvas-wrap { height: 70vh; flex: none; }
    aside.drawer { width: 100%; max-width: none; min-width: 0; border-left: none; border-top: 1px solid var(--grid); }
    .headline-stat { padding-left: 0; border-left: none; }

  }

<body>
<div class="app">
  <header>
    <div class="brand">
      <h1 id="page-title">pinwheel-llm 实验树</h1>
      <p class="sub" id="page-subtitle"></p>

    <div class="headline-stat" id="trunk-summary"></div>

    </div>
  </header>

  <div class="banner" id="status-banner"></div>

sk Learners (GPT-2)","url":"https://cdn.openai.com/better-language-models/language_models_are_unsupervised_multitask_learners.pdf"}],"used_by":[{"id":"2c-gpt2-vanilla-old","label":"GPT-2 原版 + 旧配方","label_en":"Vanilla GPT-2 + Old Recipe","val_bpb":1.1543,"reason":"对照起点：Pre-LN LayerNorm + 可学习绝对位置 + GELU + MHA","reason_en":"Reference starting point: Pre-LN LayerNorm, learned pos, GELU, MHA"},{"id":"2c-gpt2-vanilla","label":"GPT-2 原版 + 新配方","label_en":"Vanilla GPT-2 + New Recipe","val_bpb":1.1072,"reason":"对照对象：Pre-LN LayerNorm + 绝对位置 + GELU + MHA","reason_en":"Reference architecture: Pre-LN LayerNorm, learned pos, GELU, MHA"},{"id":"gpt2-124m","label":"OpenAI GPT-2 124M","label_en":"OpenAI GPT-2 124M","val_bpb":1.0287,"reason":"官方预训练权重，在我们的 bench 上实测，作为越级目标线","reason_en":"Official pretrained weights, scored on our bench as the stretch-goal line"}]},"ref-llama-arch":{"id":"ref-llama-arch","kind":"method","label":"现代 Llama 结构四件套","label_en":"Modern Llama-style Blocks","authors":"RMSNorm · RoPE · SwiGLU · GQA","summary":"相比 GPT-2 的四项核心结构演进：RMSNorm（去掉均值中心化与 bias，更省算力）；RoPE（旋转位置编码，将相对位置编进 Q/K 点积）；SwiGLU（门控 FFN，约 2.7d 三矩阵与 4d 等参但表达更强）；GQA（多组 Q 头共享 K/V，省 KV cache 显存）。","summary_en":"Four architectural upgrades over GPT-2: RMSNorm (drops mean-centering & bias), RoPE (injects relative position into Q/K dot products), SwiGLU (gated FFN matching 4d params at ~2.7d), and GQA (shared K/V heads to shrink KV cache).","links":[{"label":"RMSNorm (arXiv:1910.07467)","url":"https://arxiv.org/abs/1910.07467"},{"label":"RoPE (arXiv:2104.09864)","url":"https://arxiv.org/abs/2104.09864"},{"label":"GLU Variants / SwiGLU (arXiv:2002.05202)","url":"https://arxiv.org/abs/2002.05202"},{"label":"GQA (arXiv:2305.13245)","url":"https://arxiv.org/abs/2305.13245"}],"used_by":[{"id":"1e-v0-lr2e-3","label":"Llama 式结构 v0","label_en":"Llama-style Arch v0","val_bpb":1.1212,"reason":"采用 RMSNorm + RoPE + SwiGLU + GQA 现代结构","reason_en":"Adopts RMSNorm, RoPE, SwiGLU, and GQA"}]},"ref-chinchilla":{"id":"ref-chinchilla","kind":"paper","label":"Chinchilla 算力最优缩放律","label_en":"Chinchilla Scaling Laws","authors":"Hoffmann et al. (DeepMind, 2022)","summary":"在固定训练计算量下，模型参数量 N 与训练 token 数 D 应等比例放大，约 20 tokens/param 处于算力最优前沿；最优 loss 随计算量 C 按幂律下降。我们的 5M–50M 迷你规模律按 ~20× 配比取点，只拟合了 loss 随算力的幂律；没在固定算力下改 N 和 D 的配比，所以没检验 20× 本身是否最优。","summary_en":"For fixed training compute, model size N and training tokens D should scale equally (~20 tokens/param), with optimal loss following a power law in compute C. Our 5M–50M mini scaling law places its points at ~20× and fits only loss against compute; it never trades N against D at fixed compute, so it does not test whether 20× is optimal.","links":[{"label":"Training Compute-Optimal Large Language Models (arXiv:2203.15556)","url":"https://arxiv.org/abs/2203.15556"}],"used_by":[{"id":"group-scaling","label":"迷你规模律 (5M–20M)","label_en":"Mini Scaling Law (5M–20M)","val_bpb":null,"reason":"按 ~20 tokens/param 算力最优配比设计 5M–50M 幂律实验","reason_en":"Followed ~20 tokens/param compute-optimal ratio across 5M–50M"}]},"ref-deepseek-hp":{"id":"ref-deepseek-hp","kind":"paper","label":"DeepSeek 超参缩放律","label_en":"DeepSeek Hyperparameter Law","authors":"DeepSeek-AI (2024)","summary":"拟合出算力最优 batch 与学习率的经验公式：B_opt = 0.292·C^0.3271、η_opt = 0.3118·C^−0.125（C 为非 embedding FLOPs）。代入 pinwheel 50M/1B（C ≈ 3.3e17）得 B ≈ 160k、η ≈ 2.0e-3，且指出最优 LR 主要由总算力决定而非随 batch 按 √B 缩小。我们的实验和三项预测方向一致：128k / 256k 胜过 512k，512k 下 ×2 粗扫最优是 2e-3，按 √B 缩 LR 两次都变差；但没定位出最优 batch，128k 下 1.4e-3 / 2e-3 / 2.8e-3 也分不出高下。","summary_en":"Empirical formulas B_opt = 0.292·C^0.3271 and η_opt = 0.3118·C^−0.125. Plugging in our 50M/1B compute (C ≈ 3.3e17) predicts B ≈ 160k and η ≈ 2.0e-3, with optimal LR driven by total compute rather than √batch. Our runs agree in direction on all three: 128k / 256k beat 512k, the ×2 sweep at 512k peaks at 2e-3, and shrinking the LR by √batch lost both times; but the optimal batch was not located, and 1.4e-3 / 2e-3 / 2.8e-3 are indistinguishable at 128k.","links":[{"label":"DeepSeek LLM (arXiv:2401.02954)","url":"https://arxiv.org/abs/2401.02954"}],"used_by":[{"id":"1e-v0-lr2e-3","label":"Llama 式结构 v0","label_en":"Llama-style Arch v0","val_bpb":1.1212,"reason":"经验公式预测最优 lr ≈ 2.0e-3，和 ×2 粗扫（1e-3 / 2e-3 / 4e-3）的最优点一致","reason_en":"Empirical law predicts optimal lr ≈ 2.0e-3, the best point of our ×2 sweep (1e-3 / 2e-3 / 4e-3)"},{"id":"2a-bs128k-lr1.4e-3","label":"Batch 降至 128k","label_en":"Batch Size 128k","val_bpb":1.0996,"reason":"公式事先预测 50M/1B 最优 batch ≈ 160k，实测 128k/256k 盆地吻合","reason_en":"Formula predicted ~160k optimal batch; 128k/256k basin matched"},{"id":"2b-wsd-lr2e-3","label":"128k+WSD 下 LR 2e-3","label_en":"LR 2e-3 on 128k+WSD","val_bpb":1.085,"reason":"验证「最优 LR 主要由总算力决定，几乎不随 batch 缩小」","reason_en":"Confirms optimal LR depends mainly on compute, barely on batch size"}]},"ref-wsd":{"id":"ref-wsd","kind":"method","label":"WSD 调度与 (1−√t) 退火","label_en":"WSD Schedule & (1−√t) Cooldown","authors":"Hägele et al. (NeurIPS 2024) · MiniCPM","summary":"Warmup–Stable–Decay（WSD）取消固定总步数的 cosine 曲线，改为「预热 + 恒定 LR 稳定段 + 末段退火到 0」。研究证明 (1−√t) 退火形状优于线性，约 20% 退火即可追平甚至超越调好的 cosine；最大工程价值是可以从稳定段任意 checkpoint 分支退火，一条长线产出多个预算模型。","summary_en":"Warmup–Stable–Decay replaces cosine with a constant LR plateau followed by a short cooldown to 0. A (1−√t) decay beats linear and matches or outperforms tuned cosine at ~20% cooldown, while letting one long run branch cooldowns at any token budget.","links":[{"label":"Scaling Laws Beyond Fixed Training Durations (arXiv:2405.18392)","url":"https://arxiv.org/abs/2405.18392"},{"label":"MiniCPM: Unveiling the Potential of Small LMs (arXiv:2404.06395)","url":"https://arxiv.org/abs/2404.06395"}],"used_by":[{"id":"2b-wsd-1b","label":"WSD 调度 (1−√t)","label_en":"WSD Schedule (1−√t)","val_bpb":1.0915,"reason":"直接采用 20% (1−√t) 退火到 0，单次对照确认胜过 cosine","reason_en":"Adopted 20% (1−√t) cooldown to 0; confirmed better than cosine"},{"id":"2b-wsd-500m-cd","label":"500M 分支退火 (共 600M)","label_en":"500M Branch Cooldown (600M total)","val_bpb":1.1252,"reason":"验证 WSD 从稳定段任意 checkpoint 分支退火的能力","reason_en":"Validated branching cooldowns from an intermediate WSD stable checkpoint"},{"id":"group-2f-tailavg-1b","label":"2f 尾部权重平均（1B）","label_en":"2f Tail Weight Averaging (1B)","val_bpb":null,"reason":"Hägele et al. 也把权重平均和退火放在一起比较","reason_en":"Hägele et al. also compare weight averaging with the cooldown"}]},"ref-muon":{"id":"ref-muon","kind":"method","label":"Muon 优化器","label_en":"Muon Optimizer","authors":"Keller Jordan (2024) · Liu et al. / Moonshot (2025)","summary":"对 2D 隐藏层权重，把动量矩阵 G = UΣVᵀ 换成 UVᵀ（Newton-Schulz 5 轮近似），让每个奇异方向走同样大的一步；embedding 与 1D 参数仍用 AdamW。Moonshot 把更新按 0.2·√max(m,n) 缩放，使其 RMS 与 AdamW 对齐，可直接沿用 AdamW 的 lr 与 wd。对严调 AdamW 的加速约 1.3–1.4×（Wen et al. 2025，130M）。","summary_en":"For 2-D hidden weights, replaces the momentum G = UΣVᵀ with UVᵀ (5 Newton-Schulz steps), giving every singular direction the same step; embeddings and 1-D parameters stay on AdamW. Moonshot scales the update by 0.2·√max(m,n) to match AdamW's RMS, so AdamW's lr and wd carry over. Speed-up over a tuned AdamW is about 1.3–1.4× (Wen et al. 2025, 130M).","links":[{"label":"Muon: An optimizer for hidden layers (Keller Jordan)","url":"https://kellerjordan.github.io/posts/muon/"},{"label":"Muon is Scalable for LLM Training (arXiv:2502.16982)","url":"https://arxiv.org/abs/2502.16982"}],"used_by":[{"id":"2e-muon-1b","label":"Muon（块内矩阵）","label_en":"Muon (block matrices)","val_bpb":1.0716,"reason":"正交化动量更新 + Moonshot RMS 对齐，直接沿用 AdamW 的 lr 与 wd","reason_en":"Orthogonalized momentum updates with Moonshot's RMS match, reusing AdamW's lr and wd"}]},"ref-deep-narrow":{"id":"ref-deep-narrow","kind":"paper","label":"小模型深窄形状","label_en":"Deep-narrow Small Models","authors":"Liu et al. 2024 (MobileLLM, Meta) · Allal et al. 2025 (SmolLM2)","summary":"MobileLLM 在 125M / 350M 上比较同参数的不同深宽，发现小模型更深更窄更好，125M 选了 30 层、d576；SmolLM2-135M 也是 30 层、d576。代价是层多、矩阵小，GPU 吞吐下降。","summary_en":"MobileLLM compares depth and width at equal parameters at 125M / 350M and finds that small models do better deeper and narrower, choosing 30 layers at d576 for 125M; SmolLM2-135M also uses 30 layers at d576. The cost is lower GPU throughput from more layers and smaller matrices.","links":[{"label":"MobileLLM (arXiv:2402.14905)","url":"https://arxiv.org/abs/2402.14905"},{"label":"SmolLM2 (arXiv:2502.02737)","url":"https://arxiv.org/abs/2502.02737"}],"used_by":[{"id":"group-2f-shape-300m","label":"2f 深窄形状体检（300M）","label_en":"2f Deep-narrow Shape Check-up (300M)","val_bpb":null,"reason":"MobileLLM / SmolLM2 的小模型都选了 30 层深窄","reason_en":"MobileLLM and SmolLM2 both chose 30-layer deep-narrow small models"}]},"ref-qknorm":{"id":"ref-qknorm","kind":"method","label":"QK-Norm","label_en":"QK-Norm","authors":"Dehghani et al. 2023 (ViT-22B) · Wortsman et al. 2023 · OLMo 2 · Gemma 3","summary":"在点积前对每个头的 q、k 做归一化，打分只取决于 q、k 的夹角和可学习 gain，不再随 W_q、W_k 的大小二次增长。Wortsman et al. 2023 在小模型上用大 lr 复现了注意力打分膨胀导致的失稳，QK-Norm 能消除它并降低对 lr 的敏感度；Gemma 3 用它取代了 Gemma 2 的 logit softcap。","summary_en":"Normalizes each head's q and k before the dot product, so scores depend only on their angle and learnable gains instead of growing quadratically with W_q and W_k. Wortsman et al. 2023 reproduced attention-score growth instabilities in small models at high LR and showed QK-Norm removes them and lowers LR sensitivity; Gemma 3 uses it in place of Gemma 2's logit softcap.","links":[],"used_by":[{"id":"2e-stack-1b","label":"QK-Norm + 零初始化 + 小 embedding","label_en":"QK-Norm + zero-init + small embedding","val_bpb":1.062,"reason":"q、k 先 RMSNorm 再做 RoPE","reason_en":"RMSNorm on q and k before RoPE"},{"id":"2e-qknorm-muon-lr2e-3-300m","label":"QK-Norm · Muon 2e-3","label_en":"QK-Norm · Muon 2e-3","val_bpb":1.1414,"reason":"每头 q、k 各做 RMSNorm，打分只取决于夹角与 gain","reason_en":"RMSNorm on each head's q and k: scores depend only on the angle and the gains"}]},"ref-mtp":{"id":"ref-mtp","kind":"paper","label":"多 token 预测（MTP）","label_en":"Multi-token Prediction (MTP)","authors":"Gloeckle et al. 2024 (Meta) · DeepSeek-AI 2024 (DeepSeek-V3)","summary":"训练时让模型在每个位置额外预测更远的 token。Gloeckle et al. 用共享主干 + 并排的多个头，收益随模型变大而增加，小模型上反而掉点；DeepSeek-V3 用串联模块：第 k 个模块拿到真实的第 i+k 个 token 的 embedding，再预测第 i+k+1 个，推理时丢掉或拿来做投机解码。","summary_en":"Trains the model to also predict tokens further ahead at every position. Gloeckle et al. use a shared trunk with parallel heads and find the gain grows with model size, with small models losing; DeepSeek-V3 uses sequential modules, where module k sees the true embedding of token i+k and predicts token i+k+1, dropped at inference or used for speculative decoding.","links":[{"label":"Better & Faster LLMs via Multi-token Prediction (arXiv:2404.19737)","url":"https://arxiv.org/abs/2404.19737"},{"label":"DeepSeek-V3 Technical Report (arXiv:2412.19437)","url":"https://arxiv.org/abs/2412.19437"}],"used_by":[{"id":"group-3a-mtp","label":"3a 多 token 预测（MTP）","label_en":"3a Multi-token Prediction (MTP)","val_bpb":null,"reason":"DeepSeek-V3 的串联 MTP 模块；Gloeckle et al. 发现小模型上 MTP 掉点","reason_en":"DeepSeek-V3's sequential MTP module; Gloeckle et al. found MTP hurts small models"}]},"ref-looped":{"id":"ref-looped","kind":"paper","label":"循环层 / 循环深度","label_en":"Looped Layers / Recurrent Depth","authors":"Saunshi et al. 2025 · Geiping et al. 2025 (Huginn) · Schwethelm et al. 2026","summary":"同一组层的权重反复使用多遍。同参数下稳定变好但次线性：循环 r 遍约等于循环部分参数乘 r^φ（φ ≈ 0.46）；同算力下纯语言建模通常输给不循环的模型，多步推理任务上可能反超。Huginn 训练时随机化循环次数，推理时多循环几遍才能更好。","summary_en":"Reuses the weights of a group of layers for several passes. At equal parameters it helps steadily but sublinearly: r passes act like multiplying the looped parameters by r^φ (φ ≈ 0.46); at equal compute, plain language modeling usually loses to a model without loops, while multi-step reasoning can win. Huginn randomizes the number of passes in training, which is what lets more passes at inference help.","links":[{"label":"Reasoning with Latent Thoughts: On the Power of Looped Transformers (arXiv:2502.17416)","url":"https://arxiv.org/abs/2502.17416"},{"label":"Scaling up Test-Time Compute with Latent Reasoning (arXiv:2502.05171)","url":"https://arxiv.org/abs/2502.05171"},{"label":"Schwethelm et al. 2026, looped LM scaling law (arXiv:2604.21106)","url":"https://arxiv.org/abs/2604.21106"},{"label":"Training-Free Looped Transformers (arXiv:2605.23872)","url":"https://arxiv.org/abs/2605.23872"},{"label":"Closing the Loop: Practical Training Recipes for Looped LMs (arXiv:2610.00673)","url":"https://arxiv.org/abs/2610.00673"}],"used_by":[{"id":"group-3b-loop-300m","label":"3b 循环层（300M）","label_en":"3b Looped Layers (300M)","val_bpb":null,"reason":"循环层的同参数 / 同算力缩放律（φ ≈ 0.46）与 Middle-Cycle 拓扑","reason_en":"Iso-parameter / iso-FLOPs scaling of looped layers (φ ≈ 0.46) and the middle-cycle layout"},{"id":"group-3d-upcycle","label":"3d 把 v1 改造成循环再续训（GLM-5.4 式）","label_en":"3d Upcycling v1 into a Looped Model (GLM-5.4 style)","val_bpb":null,"reason":"GLM-5.4 据报道把训练好的 GLM-5 改成 28 层跑两遍再续训","reason_en":"GLM-5.4 reportedly turned a trained GLM-5 into a model that runs its 28 layers twice, then kept training"}]}},"uncataloged":[],"in_progress":[]};

function targetInfo(n) {
  const key = n.target_metric || "hellaswag";
  const v = n.bench?.scores?.[key];
  const ref = n.compare_to ? DATA.nodes[n.compare_to] : null;
  const rv = ref?.bench?.scores?.[key];
  return {
    key, label: TASK_LABELS[key] || key, v, ref, rv,
    gap: v != null && rv != null ? (v - rv) * 100 : null,
  };
}
function pctText(v) { return v == null ? "—" : `${(v * 100).toFixed(2)}%`; }

function isMilestoneNode(n) {
  return Boolean(n.milestone || n.milestone_en) || n.status === "root" || n.status === "adopted";
}

function visibleChildren(id) {
  const n = DATA.nodes[id];
  if (!n || state.collapsed[id]) return [];
  let kids = n.children.slice();
  if (state.trunkOnly) kids = kids.filter(c => trunkSet.has(c));
  kids.sort((a, b) => {
    const ka = DATA.nodes[a].status === "adopted" ? 0 : 1;
    const kb = DATA.nodes[b].status === "adopted" ? 0 : 1;
    return ka - kb;
  });
  return kids;
}

function sephirothNodeBox(n) {
  const big = isMilestoneNode(n);
  if (big && n.is_group) return { r: 52, w: 128, h: 138 };
  if (big) return { r: 56, w: 146, h: 148 };
  if (n.is_group) return { r: 44, w: 118, h: 120 };
  return { r: 42, w: 122, h: 118 };
}

function computeLayoutSephiroth() {
  // Top-down Kabbalah Tree of Life layout:
  // Middle Pillar (trunk) runs vertically along x = 0; side branches alternate symmetrically
  // to the Left (Severity) and Right (Mercy) pillars with independent waterlines so zero boxes overlap.
  const HGAP = 22;
  const VGAP = 46;
  const PILLAR_GAP = 54;
  const TRUNK_GAP = 64;
  const subW = {};
  const subH = {};

  function measureSub(id) {
    const sz = sephirothNodeBox(DATA.nodes[id]);
    const kids = visibleChildren(id);
    if (!kids.length) {
      subW[id] = sz.w;
      subH[id] = sz.h;
      return;
    }
    let totalW = 0, maxKidH = 0;
    kids.forEach((c, i) => {
      measureSub(c);
      totalW += subW[c] + (i > 0 ? HGAP : 0);
      maxKidH = Math.max(maxKidH, subH[c]);
    });
    subW[id] = Math.max(sz.w, totalW);
    subH[id] = sz.h + VGAP + maxKidH;
  }

  const pos = {};
  function placeSub(id, centerX, topY) {
    const sz = sephirothNodeBox(DATA.nodes[id]);
    pos[id] = {
      x: centerX - sz.w / 2,
      y: topY,
      w: sz.w,
      h: sz.h,
      cx: centerX,
      cy: topY + sz.r + 4,
      r: sz.r,
    };
    const kids = visibleChildren(id);
    if (!kids.length) return;
    let totalW = 0;
    kids.forEach((c, i) => { totalW += subW[c] + (i > 0 ? HGAP : 0); });
    let curX = centerX - totalW / 2;
    const childY = topY + sz.h + VGAP;
    for (const c of kids) {
      placeSub(c, curX + subW[c] / 2, childY);
      curX += subW[c] + HGAP;
    }
  }

  // Walk visible trunk chain from root
  const trunk = [];
  let cur = DATA.meta.root_id;
  while (cur && DATA.nodes[cur]) {
    trunk.push(cur);
    const kids = visibleChildren(cur);
    const next = kids.find(c => DATA.nodes[c].status === "adopted");
    if (!next) break;
    cur = next;
  }

  const hasRefsStrip = Object.keys(DATA.refs || {}).length > 0;
  let midY = hasRefsStrip ? 168 : 64;
  let leftWater = midY - 24;
  let rightWater = midY - 24;
  const maxTrunkHalf = Math.max(...trunk.map(id => sephirothNodeBox(DATA.nodes[id]).w / 2));

  for (const tid of trunk) {
    const sz = sephirothNodeBox(DATA.nodes[tid]);
    pos[tid] = {
      x: -sz.w / 2,
      y: midY,
      w: sz.w,
      h: sz.h,
      cx: 0,
      cy: midY + sz.r + 4,
      r: sz.r,
    };

    const sideKids = visibleChildren(tid).filter(c => DATA.nodes[c].status !== "adopted");
    const leftKids = [];
    const rightKids = [];
    sideKids.forEach((c, idx) => {
      measureSub(c);
      if (idx % 2 === 0) leftKids.push(c);
      else rightKids.push(c);
    });

    if (leftKids.length) {
      const startY = Math.max(midY + 26, leftWater + 34);
      let cursorX = -(maxTrunkHalf + PILLAR_GAP);
      let maxH = 0;
      for (const c of leftKids) {
        placeSub(c, cursorX - subW[c] / 2, startY);
        cursorX -= subW[c] + HGAP;
        maxH = Math.max(maxH, subH[c]);
      }
      leftWater = startY + maxH;
    }

    if (rightKids.length) {
      const startY = Math.max(midY + 26, rightWater + 34);
      let cursorX = maxTrunkHalf + PILLAR_GAP;
      let maxH = 0;
      for (const c of rightKids) {
        placeSub(c, cursorX + subW[c] / 2, startY);
        cursorX += subW[c] + HGAP;
        maxH = Math.max(maxH, subH[c]);
      }
      rightWater = startY + maxH;
    }

    midY += sz.h + TRUNK_GAP;
  }

  state.layout = pos;

  // Center external reference emblems like the Ain Soph crown above Kether
  const refPos = {};
  if (hasRefsStrip) {
    const REFS = Object.values(DATA.refs || {});
    const RW = 196, RH = 58, RGAP = 18;
    const totalW = REFS.length * RW + Math.max(0, REFS.length - 1) * RGAP;
    let rx = -totalW / 2;
    for (const r of REFS) {
      refPos[r.id] = { x: rx, y: 30, w: RW, h: RH, cx: rx + RW / 2, cy: 30 + RH / 2 };
      rx += RW + RGAP;
    }
  }
  state.refLayout = refPos;
}

function computeLayout() {
  if (isSephiroth()) computeLayoutSephiroth();
  else computeLayoutLab();
}

// Paper skin geometry: trunk stations in a row, each with a lane of its branches listed underneath.
const LAB = {
  TRUNK_W: 236, TRUNK_H: 118,
  BRANCH_W: 222, BRANCH_H: 82, MILESTONE_EXTRA: 16,
  INDENT: 28, ROW_GAP: 12, LANE_GAP: 52, TRUNK_TO_BRANCH: 24, LANE_PAD: 14,
  REF_W: 210, REF_H: 62, REF_GAP: 12,
  HIGHWAY: 112,
};

function labBranchHeight(n) {
  const targetBpb = n.is_target && n.val_bpb != null ? 18 : 0;
  return LAB.BRANCH_H + (nodeMilestone(n) ? LAB.MILESTONE_EXTRA : 0) + targetBpb;
}

function trunkChain() {
  const chain = [];
  let cur = DATA.meta.root_id;
  while (cur && DATA.nodes[cur]) {
    chain.push(cur);
    const next = visibleChildren(cur).find(c => DATA.nodes[c].status === "adopted");
    if (!next) break;
    cur = next;
  }
  return chain;
}

function visibleAnchor(id) {
  let cur = id;
  while (cur && !state.layout[cur]) cur = DATA.nodes[cur]?.parent;
  return cur || null;
}

function computeLayoutLab() {
  const pos = {};
  const lanes = [];
  const trunk = trunkChain();
  const refs = Object.values(DATA.refs || {});
  const refY = 0;
  const trunkY = refs.length ? refY + LAB.REF_H + LAB.HIGHWAY : LAB.HIGHWAY;

  let x = 0;
  trunk.forEach((tid, i) => {
    const laneX = x;
    pos[tid] = { x: laneX, y: trunkY, w: LAB.TRUNK_W, h: LAB.TRUNK_H, lane: i, depth: 0, trunk: true };
    let y = trunkY + LAB.TRUNK_H + LAB.TRUNK_TO_BRANCH;
    let right = laneX + LAB.TRUNK_W;
    const place = (id, depth) => {
      const h = labBranchHeight(DATA.nodes[id]);
      const bx = laneX + depth * LAB.INDENT;
      pos[id] = { x: bx, y, w: LAB.BRANCH_W, h, lane: i, depth, trunk: false };
      right = Math.max(right, bx + LAB.BRANCH_W);
      y += h + LAB.ROW_GAP;
      visibleChildren(id).forEach(c => place(c, depth + 1));
    };
    visibleChildren(tid).filter(c => c !== trunk[i + 1]).forEach(c => place(c, 1));
    const bottom = Math.max(trunkY + LAB.TRUNK_H, y - LAB.ROW_GAP);
    lanes.push({ id: tid, index: i, x: laneX, right, top: trunkY, bottom, isHead: Boolean(DATA.nodes[tid].is_head) });
    x = right + LAB.LANE_GAP;
  });

  // Reference cards sit in one row above the trunk, each pulled toward the runs that cite it.
  const refPos = {};
  if (refs.length) {
    const anchorX = r => {
      const xs = (r.used_by || []).map(u => {
        let c = u.id;
        while (c && !pos[c]) c = DATA.nodes[c]?.parent;
        return c ? pos[c].x + pos[c].w / 2 : null;
      }).filter(v => v != null);
      return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : Infinity;
    };
    const items = refs.map(r => ({ r, ax: anchorX(r) })).sort((a, b) => a.ax - b.ax);
    let minX = 0;
    for (const it of items) {
      const want = Number.isFinite(it.ax) ? it.ax - LAB.REF_W / 2 : minX;
      const rx = Math.max(minX, want);
      refPos[it.r.id] = { x: rx, y: refY, w: LAB.REF_W, h: LAB.REF_H };
      minX = rx + LAB.REF_W + LAB.REF_GAP;
    }
  }

  state.layout = pos;
  state.refLayout = refPos;
  state.labLanes = lanes;
  state.labGeom = {
    trunkY,
    hwTop: refs.length ? refY + LAB.REF_H + 12 : 12,
    hwBottom: trunkY - LAB.LANE_PAD - 10,
  };
}

const _measureCtx = document.createElement("canvas").getContext("2d");
function textWidth(s, font) {
  _measureCtx.font = font;
  return _measureCtx.measureText(s || "").width;
}
// Truncate a string with an ellipsis so it fits maxW pixels in the given CSS font.
function fitText(s, maxW, font) {
  s = s || "";
  if (textWidth(s, font) <= maxW) return s;
  let lo = 0, hi = s.length;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (textWidth(s.slice(0, mid) + "…", font) <= maxW) lo = mid;
    else hi = mid - 1;
  }
  return s.slice(0, lo) + "…";
}
let _labFamily = "sans-serif";
function labFont(size, weight = 400) { return `${weight} ${size}px ${_labFamily}`; }

function elNS(tag, attrs = {}, text = null) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, String(v));
  if (text !== null) el.textContent = text;
  return el;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtBpb(v) { return v == null ? "—" : v.toFixed(4); }
function fmtDelta(v) { return v == null ? "—" : (v > 0 ? `+${v.toFixed(4)}` : v.toFixed(4).replace("-", "−")); }
function fmtPct(v) { return v == null ? "—" : `${(v * 100).toFixed(2)}%`; }
function fmtP(p) {
  if (p == null) return "—";
  if (p < 1e-4) return p.toExponential(1);
  return p.toFixed(4);
}
function trunc(s, max) { return s && s.length > max ? s.slice(0, max - 1) + "…" : (s || ""); }

function milestoneIconPath(n) {
  if (n.is_head) return "M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z";
  if (n.status === "root") return "M5 3v18h2v-7h11l-2.5-4.5L18 5H7V3H5z";
  if (n.status === "adopted") return "M12 2L22 12L12 22L2 12Z";
  return "M12 2l2.6 6.4L21 11l-6.4 2.6L12 20l-2.6-6.4L3 11l6.4-2.6z";
}

function refKindLabel(kind) {
  const L = t();
  if (kind === "method") return L.refKindMethod;
  if (kind === "post") return L.refKindPost;
  if (kind === "repo") return L.refKindRepo;
  return L.refKindPaper;
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function collectCanvasObstacles(sephiroth) {
  const obs = [];
  const pad = 10;
  for (const [id, p] of Object.entries(state.layout)) {
    if (sephiroth) {
      obs.push({
        id,
        x: p.cx - p.r - pad,
        y: p.cy - p.r - pad,
        w: 2 * (p.r + pad),
        h: 2 * p.r + 30 + 2 * pad,
      });
    } else {
      obs.push({ id, x: p.x - pad, y: p.y - pad, w: p.w + 2 * pad, h: p.h + 2 * pad });
    }
  }
  for (const rp of Object.values(state.refLayout || {})) {
    obs.push({ id: null, x: rp.x - 6, y: rp.y - 6, w: rp.w + 12, h: rp.h + 12 });
  }
  return obs;
}

function isRectClear(rect, obstacles, placedPills) {
  for (const o of obstacles) if (rectsOverlap(rect, o)) return false;
  for (const p of placedPills) if (rectsOverlap(rect, p)) return false;
  return true;
}

function quadPoint(x1, y1, cx, cy, x2, y2, t) {
  const mt = 1 - t;
  return {
    x: mt * mt * x1 + 2 * mt * t * cx + t * t * x2,
    y: mt * mt * y1 + 2 * mt * t * cy + t * t * y2,
  };
}

function cubicPoint(x1, y1, cx1, cy1, cx2, cy2, x2, y2, t) {
  const mt = 1 - t;
  return {
    x: mt * mt * mt * x1 + 3 * mt * mt * t * cx1 + 3 * mt * t * t * cx2 + t * t * t * x2,
    y: mt * mt * mt * y1 + 3 * mt * mt * t * cy1 + 3 * mt * t * t * cy2 + t * t * t * y2,
  };
}

function curveHitsNode(sampleFn, obstacles, ignoreIds) {
  for (let i = 1; i <= 7; i++) {
    const pt = sampleFn(i / 8);
    for (const o of obstacles) {
      if (o.id && ignoreIds.has(o.id)) continue;
      if (pt.x >= o.x && pt.x <= o.x + o.w && pt.y >= o.y && pt.y <= o.y + o.h) return true;
    }
  }
  return false;
}

// Clip straight line segment at the outer perimeter of two Sephiroth circles.
function clippedSegment(p1, p2, pad = 4) {
  const dx = p2.cx - p1.cx, dy = p2.cy - p1.cy;
  const dist = Math.hypot(dx, dy) || 1;
  const ux = dx / dist, uy = dy / dist;
  return {
    x1: p1.cx + ux * (p1.r + pad),
    y1: p1.cy + uy * (p1.r + pad),
    x2: p2.cx - ux * (p2.r + pad),
    y2: p2.cy - uy * (p2.r + pad),
    ux, uy,
  };
}

// Route a Sephiroth-skin vertical-tree arc and place its pill in guaranteed obstacle-free space.
function routeVerticalArc({ a, b, preferRight, pillW, pillH, obstacles, placedPills, ignoreIds, treeMinX, treeMaxX }) {
  const seg = clippedSegment(a, b, 5);
  const mx = (seg.x1 + seg.x2) / 2;
  const my = (seg.y1 + seg.y2) / 2;
  const sides = preferRight ? [1, -1] : [-1, 1];

  // 1. Try a compact local quadratic curve if both the path and pill are completely clear of all nodes.
  for (const sign of sides) {
    for (const mag of [64, 98]) {
      const cx = mx + sign * mag;
      const cy = my;
      if (curveHitsNode(t => quadPoint(seg.x1, seg.y1, cx, cy, seg.x2, seg.y2, t), obstacles, ignoreIds)) {
        continue;
      }
      for (const t of [0.5, 0.42, 0.58]) {
        const pt = quadPoint(seg.x1, seg.y1, cx, cy, seg.x2, seg.y2, t);
        const rect = { x: pt.x - pillW / 2 - 4, y: pt.y - pillH / 2 - 4, w: pillW + 8, h: pillH + 8 };
        if (isRectClear(rect, obstacles, placedPills)) {
          return { d: `M ${seg.x1} ${seg.y1} Q ${cx} ${cy}, ${seg.x2} ${seg.y2}`, lx: pt.x, ly: pt.y, rect };
        }
      }
    }
  }

  // 2. Otherwise swing cleanly outside the left/right tree flank where no nodes exist.
  const tOrder = [0.5, 0.40, 0.60, 0.30, 0.70, 0.22, 0.78];
  for (const sign of sides) {
    const goRight = sign > 0;
    const x1 = goRight ? (a.cx + a.r + 4) : (a.cx - a.r - 4);
    const x2 = goRight ? (b.cx + b.r + 4) : (b.cx - b.r - 4);
    const y1 = a.cy, y2 = b.cy;
    const baseTargetX = goRight
      ? Math.max(treeMaxX + 22 + pillW / 2, Math.max(x1, x2) + 40 + pillW / 2)
      : Math.min(treeMinX - 22 - pillW / 2, Math.min(x1, x2) - 40 - pillW / 2);

    for (let col = 0; col < 10; col++) {
      const targetX = baseTargetX + sign * col * 48;
      // Invert cubic midpoint x(0.5) = 0.75 * outerX + 0.125 * (x1 + x2) = targetX
      const outerX = (targetX - 0.125 * (x1 + x2)) / 0.75;
      for (const t of tOrder) {
        const pt = cubicPoint(x1, y1, outerX, y1, outerX, y2, x2, y2, t);
        const rect = { x: pt.x - pillW / 2 - 4, y: pt.y - pillH / 2 - 4, w: pillW + 8, h: pillH + 8 };
        if (isRectClear(rect, obstacles, placedPills)) {
          return { d: `M ${x1} ${y1} C ${outerX} ${y1}, ${outerX} ${y2}, ${x2} ${y2}`, lx: pt.x, ly: pt.y, rect };
        }
      }
    }
  }

  // Guaranteed fallback far outside the preferred flank
  const goRight = preferRight;
  const sign = goRight ? 1 : -1;
  const x1 = goRight ? (a.cx + a.r + 4) : (a.cx - a.r - 4);
  const x2 = goRight ? (b.cx + b.r + 4) : (b.cx - b.r - 4);
  const y1 = a.cy, y2 = b.cy;
  const targetX = (goRight ? treeMaxX : treeMinX) + sign * (28 + pillW / 2 + placedPills.length * 44);
  const outerX = (targetX - 0.125 * (x1 + x2)) / 0.75;
  const pt = cubicPoint(x1, y1, outerX, y1, outerX, y2, x2, y2, 0.5);
  return {
    d: `M ${x1} ${y1} C ${outerX} ${y1}, ${outerX} ${y2}, ${x2} ${y2}`,
    lx: pt.x, ly: pt.y,
    rect: { x: pt.x - pillW / 2 - 4, y: pt.y - pillH / 2 - 4, w: pillW + 8, h: pillH + 8 },
  };
}

function roundedRowBracket(x1, y1, x2, y2, railY) {
  const dir = x2 >= x1 ? 1 : -1;
  const r = Math.min(12, Math.abs(x2 - x1) / 3, Math.max(4, railY - Math.max(y1, y2) - 2));
  return {
    d: `M ${x1} ${y1} L ${x1} ${railY - r} Q ${x1} ${railY}, ${x1 + dir * r} ${railY} L ${x2 - dir * r} ${railY} Q ${x2} ${railY}, ${x2} ${railY - r} L ${x2} ${y2}`,
    r,
  };
}

function renderTree() {

function searchHits() {
  const q = state.search.trim().toLowerCase();
  const nodes = new Set(), refs = new Set();
  if (q) {
    for (const n of Object.values(DATA.nodes)) {
      const hay = `${n.id} ${n.label} ${n.label_en} ${n.milestone} ${n.milestone_en} ${n.takeaway} ${n.takeaway_en}`.toLowerCase();
      if (hay.includes(q)) nodes.add(n.id);
    }
    for (const r of Object.values(DATA.refs || {})) {
      const hay = `${r.id} ${r.label} ${r.label_en} ${r.authors} ${r.summary} ${r.summary_en}`.toLowerCase();
      if (hay.includes(q)) refs.add(r.id);
    }
  }
  return { q, nodes, refs };
}

// The selected node or reference plus everything it links to; null when nothing is selected.
function focusSet() {
  if (state.selectedRefId && DATA.refs?.[state.selectedRefId]) {
    const r = DATA.refs[state.selectedRefId];
    return {
      nodes: new Set((r.used_by || []).map(u => visibleAnchor(u.id)).filter(Boolean)),
      refs: new Set([r.id]),
    };
  }
  const n = state.selectedId ? DATA.nodes[state.selectedId] : null;
  if (!n) return null;
  const ids = [
    n.id, n.parent, n.compare_to, ...(n.children || []),
    ...(n.compared_by || []).map(c => c.id),
    ...(n.inspired_by || []).map(x => x.id),
    ...(n.inspired || []).map(x => x.id),
  ];
  return {
    nodes: new Set(ids.filter(Boolean).map(visibleAnchor).filter(Boolean)),
    refs: new Set((n.refs || []).map(x => x.id)),
  };
}

// Links to draw: the selected item's own links always; with nothing selected, every link of a kind
// whose "show all" toggle is on (drawn faint, without labels).
function collectLinks() {
  const L = t();
  const sel = state.selectedId, selRef = state.selectedRefId;
  const noSel = !sel && !selRef;
  const out = [];
  const seen = new Set();
  const add = (kind, from, to, label, overview) => {
    const key = `${kind}:${from.type}:${from.id}->${to}`;
    if (seen.has(key)) return;
    seen.add(key);
    out.push({ kind, from, to, label, overview });
  };
  if (!selRef) {
    for (const id of Object.keys(state.layout)) {
      const n = DATA.nodes[id];
      if (!n.cross_compare || !n.compare_to || !state.layout[n.compare_to]) continue;
      const isRootArc = id === DATA.meta.root_id;
      if (!(sel === id || sel === n.compare_to || isRootArc)) continue;
      let label;
      if (n.is_target) {
        const ti = targetInfo(n);
        label = ti.gap != null ? L.targetArcLabel(n.compare_to, (ti.rv * 100).toFixed(2), ti.gap) : L.arcFallback(n.compare_to);
      } else {
        label = n.delta_bpb != null
          ? (isRootArc ? L.arcRootLabel(fmtDelta(-n.delta_bpb)) : L.arcOtherLabel(n.compare_to, fmtDelta(n.delta_bpb)))
          : L.arcFallback(n.compare_to);
      }
      add("compare", { type: "node", id }, n.compare_to, label, false);
    }
    for (const n of Object.values(DATA.nodes)) {
      for (const edge of (n.inspired_by || [])) {
        const focusHit = sel === n.id || sel === edge.id;
        if (!(focusHit || (noSel && state.showInspiration))) continue;
        const a = visibleAnchor(edge.id), b = visibleAnchor(n.id);
        if (!a || !b || a === b) continue;
        const reason = pick(edge, "reason");
        add("inspire", { type: "node", id: a }, b, reason ? `${L.inspireBadge} · ${reason}` : L.inspireBadge, !focusHit);
      }
    }
  }
  for (const r of Object.values(DATA.refs || {})) {
    if (!state.refLayout[r.id]) continue;
    for (const u of (r.used_by || [])) {
      const focusHit = selRef === r.id || (!selRef && sel === u.id);
      if (!(focusHit || (noSel && state.showRefs))) continue;
      const b = visibleAnchor(u.id);
      if (b) add("ref", { type: "ref", id: r.id }, b, "", !focusHit);
    }
  }
  return out;
}

function roundedPath(pts, r = 9) {
  const P = pts.filter((p, i) => i === 0 || Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]) > 0.5);
  if (P.length < 2) return "";
  const f = v => v.toFixed(1);
  let d = `M ${f(P[0][0])} ${f(P[0][1])}`;
  for (let i = 1; i < P.length - 1; i++) {
    const [px, py] = P[i], [ax, ay] = P[i - 1], [bx, by] = P[i + 1];
    const la = Math.hypot(ax - px, ay - py), lb = Math.hypot(bx - px, by - py);
    const rr = Math.min(r, la / 2, lb / 2);
    d += ` L ${f(px + (ax - px) / la * rr)} ${f(py + (ay - py) / la * rr)}`;
    d += ` Q ${f(px)} ${f(py)} ${f(px + (bx - px) / lb * rr)} ${f(py + (by - py) / lb * rr)}`;
  }
  const last = P[P.length - 1];
  return `${d} L ${f(last[0])} ${f(last[1])}`;
}

// Orthogonal router for the paper skin. Links never cut across cards: a branch leaves through the gap
// to the right of its lane, a trunk or reference card through its top or bottom edge, and the
// horizontal run happens on a "highway" track above the trunk. Two ends in one lane meet in that lane's gap.
// Labelled links stack upward from the trunk; reference links, which start at the cards above, stack
// downward from the reference row, so the two families rarely meet.
function labRouter(spacing) {
  const lanes = state.labLanes;
  const geom = state.labGeom;
  const chanUse = {};
  const portUse = {};
  const tracks = [];
  const topTracks = [];
  const channelX = lane => {
    const k = chanUse[lane] = (chanUse[lane] || 0) + 1;
    return lanes[lane].right + LAB.LANE_PAD + 4 + ((k - 1) % 4) * 6;
  };
  const portX = (key, cx) => {
    const k = portUse[key] = (portUse[key] || 0) + 1;
    return cx + [0, -14, 14, -28, 28][(k - 1) % 5];
  };
  const takeTrack = (x0, x1, fromTop) => {
    const list = fromTop ? topTracks : tracks;
    for (let k = 0; ; k++) {
      const spans = list[k] || (list[k] = []);
      if (spans.every(([a, b]) => x1 + 10 < a || x0 - 10 > b)) {
        spans.push([x0, x1]);
        return fromTop ? geom.hwTop + 6 + k * Math.min(spacing, 9) : geom.hwBottom - k * spacing;
      }
    }
  };
  const access = (p, isRef, key) => {
    if (isRef) return { x: portX(key, p.x + p.w / 2), y: p.y + p.h, pre: [] };
    if (p.trunk) return { x: portX(key, p.x + p.w / 2), y: p.y, pre: [] };
    const y = p.y + p.h / 2;
    return { x: channelX(p.lane), y, pre: [[p.x + p.w, y]] };
  };
  return (from, toId, pillW) => {
    const pb = state.layout[toId];
    const pa = from.type === "ref" ? state.refLayout[from.id] : state.layout[from.id];
    if (!pa || !pb) return null;
    if (from.type === "node" && pa.lane === pb.lane) {
      const cx = channelX(pa.lane);
      const ya = pa.y + pa.h / 2, yb = pb.y + pb.h / 2;
      return { pts: [[pa.x + pa.w, ya], [cx, ya], [cx, yb], [pb.x + pb.w, yb]], pill: null };
    }
    const A = access(pa, from.type === "ref", `${from.type}:${from.id}`);
    const B = access(pb, false, `node:${toId}`);
    const mid = (A.x + B.x) / 2;
    const x0 = Math.min(A.x, B.x, pillW ? mid - pillW / 2 : Infinity);
    const x1 = Math.max(A.x, B.x, pillW ? mid + pillW / 2 : -Infinity);
    const hy = takeTrack(x0, x1, from.type === "ref");
    const pts = [...A.pre, [A.x, A.y], [A.x, hy], [B.x, hy], [B.x, B.y], ...B.pre.slice().reverse()];
    return { pts, pill: pillW ? { x: mid, y: hy } : null };
  };
}

function renderTreeLab() {
  const L = t();
  _labFamily = getComputedStyle(document.documentElement).getPropertyValue("--sans").trim() || "sans-serif";
  const layer = id => {
    const el = document.getElementById(id);
    el.innerHTML = "";
    return el;
  };
  const decor = layer("decor-layer"), edges = layer("edges-layer"), arcsBg = layer("arcs-bg-layer");
  const refsLayer = layer("refs-layer"), nodesLayer = layer("nodes-layer"), arcsFg = layer("arcs-fg-layer");

  const hits = searchHits();
  const focus = focusSet();
  const isDim = id => (hits.q && !hits.nodes.has(id)) || Boolean(focus && !focus.nodes.has(id));
  const isRefDim = rid => (hits.q && !hits.refs.has(rid)) || Boolean(focus && !focus.refs.has(rid));

  // 0. One lane per trunk step; the HEAD lane is tinted.
  for (const lane of state.labLanes) {
    decor.appendChild(elNS("rect", {
      class: lane.isHead ? "lane lane-head" : "lane",
      x: lane.x - LAB.LANE_PAD, y: lane.top - LAB.LANE_PAD,
      width: lane.right - lane.x + 2 * LAB.LANE_PAD, height: lane.bottom - lane.top + 2 * LAB.LANE_PAD, rx: 16,
    }));
  }

  // 1. Trunk route between stations, with a chevron for direction.
  const lanes = state.labLanes;
  for (let i = 0; i + 1 < lanes.length; i++) {
    const a = state.layout[lanes[i].id], b = state.layout[lanes[i + 1].id];
    const y = a.y + a.h / 2;
    const dim = isDim(lanes[i].id) && isDim(lanes[i + 1].id) ? " dim" : "";
    edges.appendChild(elNS("path", { d: `M ${a.x + a.w} ${y} H ${b.x}`, class: `edge trunk${dim}` }));
    const mx = (a.x + a.w + b.x) / 2;
    edges.appendChild(elNS("path", { d: `M ${mx - 2.5} ${y - 4} L ${mx + 2} ${y} L ${mx - 2.5} ${y + 4}`, class: `edge-chevron${dim}` }));
  }

  // 2. Branch connectors: a spine down from each parent, one rounded elbow per child.
  const kidsOf = {};
  for (const [id, p] of Object.entries(state.layout)) {
    if (p.trunk) continue;
    const par = DATA.nodes[id].parent;
    if (state.layout[par]) (kidsOf[par] = kidsOf[par] || []).push(id);
  }
  for (const [par, kids] of Object.entries(kidsOf)) {
    const pp = state.layout[par];
    const sx = pp.x + LAB.INDENT / 2;
    const mids = kids.map(k => state.layout[k].y + state.layout[k].h / 2);
    const r = 8;
    const allDim = kids.every(isDim);
    edges.appendChild(elNS("path", {
      d: `M ${sx} ${pp.y + pp.h} V ${Math.max(...mids) - r}`, class: `edge${allDim ? " dim" : ""}`,
    }));
    kids.forEach((k, i) => {
      const kp = state.layout[k];
      const cls = ["edge", DATA.nodes[k].status === "rejected" ? "rejected" : "", isDim(k) ? "dim" : ""].filter(Boolean).join(" ");
      edges.appendChild(elNS("path", {
        d: `M ${sx} ${mids[i] - r} Q ${sx} ${mids[i]} ${sx + r} ${mids[i]} H ${kp.x}`, class: cls,
      }));
    });
  }

  // 3. Comparison / inspiration / reference links; labels go on top of every line.
  const focusRoute = labRouter(24), faintRoute = labRouter(7);
  const pillFont = labFont(11.5, 700);
  const pills = [];
  for (const lk of collectLinks()) {
    let pillTxt = "", pillW = 0;
    if (!lk.overview && lk.label) {
      pillTxt = fitText(lk.label, 300, pillFont);
      pillW = Math.ceil(textWidth(pillTxt, pillFont)) + 22;
    }
    const routed = (lk.overview ? faintRoute : focusRoute)(lk.from, lk.to, pillW);
    if (!routed) continue;
    const target = lk.overview ? arcsBg : arcsFg;
    target.appendChild(elNS("path", {
      d: roundedPath(routed.pts),
      class: `link link-${lk.kind}${lk.overview ? " faint" : ""}`,
      "marker-end": `url(#arrow-lab-${lk.kind})`,
    }));
    if (routed.pill && pillTxt) pills.push({ ...routed.pill, w: pillW, txt: pillTxt, kind: lk.kind });
  }
  for (const pl of pills) {
    arcsFg.appendChild(elNS("rect", {
      class: `pill-bg pill-${pl.kind}`, x: pl.x - pl.w / 2, y: pl.y - 10.5, width: pl.w, height: 21, rx: 10.5,
    }));
    arcsFg.appendChild(elNS("text", {
      class: `pill-tx pill-tx-${pl.kind}`, x: pl.x, y: pl.y + 4, "text-anchor": "middle",
    }, pl.txt));
  }

  // 4. Reference cards.
  const refEntries = Object.entries(state.refLayout);
  if (refEntries.length) {
    const minRefX = Math.min(...refEntries.map(([, rp]) => rp.x));
    refsLayer.appendChild(elNS("text", { class: "strip-label", x: minRefX, y: -12 }, L.refStripLabel));
    for (const [rid, rp] of refEntries) {
      refsLayer.appendChild(drawLabRef(DATA.refs[rid], rp, {
        dim: isRefDim(rid), selected: state.selectedRefId === rid,
      }));
    }
  }

  // 5. Experiment cards.
  for (const [id, p] of Object.entries(state.layout)) {
    nodesLayer.appendChild(drawLabNode(DATA.nodes[id], p, {
      dim: isDim(id), selected: !state.selectedRefId && state.selectedId === id,
    }));
  }
}

function labNodeRole(n, p) {
  if (n.is_target) return "target";
  if (n.status === "root") return "root";
  if (n.is_head) return "head";
  if (p.trunk) return "trunk";
  if (n.is_placeholder) return "placeholder";
  if (n.status === "rejected") return "rejected";
  if (n.is_group) return "group";
  return "branch";
}

const MONO_STACK = "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace";

function drawLabNode(n, p, { dim, selected }) {
  const L = t();
  const role = labNodeRole(n, p);
  const dark = role === "root" || role === "head";
  const g = elNS("g", {
    class: ["node-g", dark ? "on-dark" : "", selected ? "selected" : "", dim ? "dim" : ""].filter(Boolean).join(" "),
    transform: `translate(${p.x}, ${p.y})`,
  });
  g.appendChild(elNS("title", {}, `${nodeLabel(n)}${n.run_id ? ` (${n.run_id})` : ""}`));
  if (selected) {
    g.appendChild(elNS("rect", { class: "sel-ring", x: -5, y: -5, width: p.w + 10, height: p.h + 10, rx: p.trunk ? 16 : 14 }));
  }
  if (n.is_group && state.collapsed[n.id]) {
    g.appendChild(elNS("rect", { class: "card-stack", x: 8, y: 8, width: p.w, height: p.h, rx: 10 }));
    g.appendChild(elNS("rect", { class: "card-stack", x: 4, y: 4, width: p.w, height: p.h, rx: 10 }));
  }
  g.appendChild(elNS("rect", { class: `card card-${role}`, x: 0, y: 0, width: p.w, height: p.h, rx: p.trunk ? 12 : 10 }));

  const padX = 14;
  const inner = p.w - 2 * padX;
  const bpbText = n.is_placeholder && n.val_bpb != null ? `~${fmtBpb(n.val_bpb)}` : fmtBpb(n.val_bpb);
  const numCls = `tx ${p.trunk ? "tx-num-lg" : "tx-num"}${n.is_placeholder ? " tx-placeholder" : ""}`;

  if (p.trunk) {
    const idTxt = n.run_id ? fitText(n.run_id, 120, `400 11px ${MONO_STACK}`) : "";
    const idW = idTxt ? textWidth(idTxt, `400 11px ${MONO_STACK}`) + 10 : 0;
    const ms = nodeMilestone(n) || (n.status === "adopted" ? L.defaultTrunk : L.defaultMilestone);
    g.appendChild(elNS("text", { class: "tx tx-ms", x: padX, y: 25 }, fitText(ms, inner - idW, labFont(12, 700))));
    if (idTxt) g.appendChild(elNS("text", { class: "tx tx-id", x: p.w - padX, y: 25, "text-anchor": "end" }, idTxt));
    g.appendChild(elNS("text", { class: "tx tx-label-lg", x: padX, y: 48 }, fitText(nodeLabel(n), inner, labFont(15, 700))));
    g.appendChild(elNS("text", { class: numCls, x: padX, y: 86 }, bpbText));
    const numW = textWidth(bpbText, labFont(27, 800));
    labDeltaChip(g, n, padX + numW + 10, 67, 20);
    labPills(g, n, padX, 96);
    g.addEventListener("click", () => selectNode(n.id));
    return g;
  }

  const ms = nodeMilestone(n);
  const o = ms ? LAB.MILESTONE_EXTRA : 0;
  if (ms) {
    g.appendChild(elNS("text", { class: `tx tx-ms-side${n.is_target ? " tx-ms-target" : ""}`, x: padX, y: 19 }, fitText(ms, inner, labFont(11.5, 700))));
  }
  g.appendChild(elNS("text", { class: "tx tx-label", x: padX, y: 22 + o }, fitText(nodeLabel(n), inner, labFont(13.5, 600))));

  if (n.is_group) {
    const gs = n.group_stats || {};
    g.appendChild(elNS("text", { class: "tx tx-meta", x: padX, y: 43 + o }, L.groupCardMeta(gs.count || 0, fmtBpb(gs.best_bpb))));
    const isCol = Boolean(state.collapsed[n.id]);
    const btnText = isCol ? L.expandBtn(gs.count || n.children.length) : L.collapseBtn;
    const bw = Math.ceil(textWidth(btnText, labFont(11.5, 700))) + 22;
    const tg = elNS("g", { class: "lab-toggle", transform: `translate(${padX}, ${54 + o})` });
    tg.appendChild(elNS("rect", { x: 0, y: 0, width: bw, height: 20, rx: 10 }));
    tg.appendChild(elNS("text", { x: bw / 2, y: 14, "text-anchor": "middle" }, btnText));
    tg.addEventListener("click", ev => {
      ev.stopPropagation();
      state.collapsed[n.id] = !state.collapsed[n.id];
      renderTree();
    });
    g.appendChild(tg);
  } else if (n.is_target) {
    const ti = targetInfo(n);
    const num = pctText(ti.v);
    g.appendChild(elNS("text", { class: "tx tx-num", x: padX, y: 49 + o }, num));
    g.appendChild(elNS("text", { class: "tx tx-meta", x: padX + textWidth(num, labFont(18, 700)) + 7, y: 49 + o }, ti.label));
    if (ti.gap != null) {
      g.appendChild(elNS("text", { class: "tx tx-meta", x: padX, y: 70 + o }, fitText(L.targetGap((ti.rv * 100).toFixed(2), ti.gap), inner, labFont(12))));
    }
    if (n.val_bpb != null) {
      const line = L.targetBpbLine(fmtBpb(n.val_bpb), fmtBpb(ti.ref?.val_bpb), n.in_noise);
      g.appendChild(elNS("text", { class: "tx tx-meta", x: padX, y: 88 + o }, fitText(line, inner, labFont(12))));
    }
  } else {
    g.appendChild(elNS("text", { class: numCls, x: padX, y: 49 + o }, bpbText));
    const numW = textWidth(bpbText, labFont(18, 700));
    labDeltaChip(g, n, padX + numW + 8, 34 + o, 18);
    labPills(g, n, padX, 59 + o);
  }
  g.addEventListener("click", () => selectNode(n.id));
  return g;
}

function labDeltaChip(g, n, x, y, h) {
  const L = t();
  let text = "", tone = "noise";
  if (n.is_placeholder) {
    text = L.placeholderCardTag;
  } else if (n.delta_bpb != null) {
    text = fmtDelta(n.delta_bpb);
    if (n.in_noise) text += " " + L.deltaNoiseShort;
    else tone = n.delta_bpb < 0 ? "good" : "bad";
  } else if (n.compare_to && DATA.nodes[n.compare_to]?.is_placeholder) {
    text = L.placeholderRefPending;
  } else if (n.status === "adopted" && n.parent === DATA.meta.root_id && DATA.nodes[DATA.meta.root_id]?.cross_compare) {
    text = L.deltaSeeArc; tone = "info";
  } else if (n.compare_to == null && n.status !== "root") {
    text = L.deltaStandalone;
  }
  if (!text) return;
  const w = Math.ceil(textWidth(text, labFont(11, 700))) + 14;
  g.appendChild(elNS("rect", { class: `chip chip-${tone}`, x, y, width: w, height: h, rx: h / 2 }));
  g.appendChild(elNS("text", { class: `chip-tx chip-tx-${tone}`, x: x + w / 2, y: y + h / 2 + 4, "text-anchor": "middle" }, text));
}

function labPills(g, n, x, y) {
  const a = n.artifacts;
  if (!a) return;
  const L = t();
  const hasT2 = n.bench && n.bench.tier === "tier2";
  const hasBench = Boolean(n.bench);
  const items = [
    { label: "ckpt", ok: a.ckpt_exists, tab: "artifacts" },
    { label: hasT2 ? "T2" : (hasBench ? "T1" : L.pillNoEval), ok: hasBench, tab: "bench" },
    { label: L.pillSamples, ok: a.samples_exists, tab: "artifacts" },
  ];
  const font = labFont(10.5, 600);
  let cx = x;
  for (const it of items) {
    const w = Math.ceil(textWidth(it.label, font)) + 22;
    const pg = elNS("g", { class: `lab-pill${it.ok ? "" : " miss"}`, transform: `translate(${cx}, ${y})` });
    pg.appendChild(elNS("rect", { x: 0, y: 0, width: w, height: 16, rx: 8 }));
    pg.appendChild(elNS("circle", { class: "dot", cx: 8.5, cy: 8, r: 2.6 }));
    pg.appendChild(elNS("text", { x: 15, y: 11.7 }, it.label));
    pg.addEventListener("click", ev => {
      ev.stopPropagation();
      selectNode(n.id, it.tab);
    });
    g.appendChild(pg);
    cx += w + 5;
  }
}
