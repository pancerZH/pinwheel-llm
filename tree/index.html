const ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];

function renderTreeSephiroth() {
  const L = t();
  const decorLayer = document.getElementById("decor-layer");
  const edgesLayer = document.getElementById("edges-layer");
  const arcsBgLayer = document.getElementById("arcs-bg-layer");
  const refsLayer = document.getElementById("refs-layer");
  const arcsFgLayer = document.getElementById("arcs-fg-layer");
  const nodesLayer = document.getElementById("nodes-layer");
  decorLayer.innerHTML = "";
  edgesLayer.innerHTML = "";
  arcsBgLayer.innerHTML = "";
  refsLayer.innerHTML = "";
  arcsFgLayer.innerHTML = "";
  nodesLayer.innerHTML = "";

  const q = state.search.trim().toLowerCase();
  const matches = new Set();
  const refMatches = new Set();
  if (q) {
    for (const n of Object.values(DATA.nodes)) {
      const hay = `${n.id} ${n.label} ${n.label_en} ${n.milestone} ${n.milestone_en} ${n.takeaway} ${n.takeaway_en}`.toLowerCase();
      if (hay.includes(q)) matches.add(n.id);
    }
    for (const r of Object.values(DATA.refs || {})) {
      const hay = `${r.id} ${r.label} ${r.label_en} ${r.authors} ${r.summary} ${r.summary_en}`.toLowerCase();
      if (hay.includes(q)) refMatches.add(r.id);
    }
  }

  // 0. Sacred geometry backdrop: three pillars + subtle concentric astrolabe rings + Ain Soph arc
  const allPos = Object.values(state.layout);
  if (allPos.length) {
    const minY = Math.min(...allPos.map(p => p.cy)) - 70;
    const maxY = Math.max(...allPos.map(p => p.cy)) + 70;
    const midY = (minY + maxY) / 2;
    const minX = Math.min(...allPos.map(p => p.x));
    const maxX = Math.max(...allPos.map(p => p.x + p.w));
    const spanR = Math.max(240, Math.min(460, (maxY - minY) * 0.44));

    // Middle pillar axis + symmetric side pillar guidelines
    decorLayer.appendChild(elNS("line", {
      x1: 0, y1: minY, x2: 0, y2: maxY,
      stroke: "#c9a66b", "stroke-width": 0.8, opacity: 0.18, "stroke-dasharray": "3 6",
    }));
    const sideGuide = Math.max(180, Math.min(280, Math.max(Math.abs(minX), Math.abs(maxX)) * 0.52));
    for (const gx of [-sideGuide, sideGuide]) {
      decorLayer.appendChild(elNS("line", {
        x1: gx, y1: minY + 40, x2: gx, y2: maxY - 20,
        stroke: "#c9a66b", "stroke-width": 0.6, opacity: 0.09, "stroke-dasharray": "2 8",
      }));
    }
    // Concentric astrolabe circles around the heart of the tree
    for (const rad of [spanR * 0.62, spanR, spanR * 1.18]) {
      decorLayer.appendChild(elNS("circle", {
        cx: 0, cy: midY, r: rad, fill: "none",
        stroke: "#c9a66b", "stroke-width": 0.7, opacity: 0.08,
        "stroke-dasharray": rad === spanR ? "none" : "4 6",
      }));
    }
    // Delicate triple veil arc above Kether (root)
    const rootP = state.layout[DATA.meta.root_id];
    if (rootP) {
      for (let i = 0; i < 3; i++) {
        const ar = 76 + i * 16;
        decorLayer.appendChild(elNS("path", {
          d: `M ${-ar} ${rootP.cy - 22} A ${ar} ${ar * 0.52} 0 0 1 ${ar} ${rootP.cy - 22}`,
          fill: "none", stroke: "#c9a66b", "stroke-width": 0.7, opacity: 0.18 - i * 0.045,
        }));
      }
    }
  }

  // 1. Sacred Paths (tree edges)
  for (const [id, p] of Object.entries(state.layout)) {
    const n = DATA.nodes[id];
    if (!n.parent || !state.layout[n.parent]) continue;
    const par = state.layout[n.parent];
    const seg = clippedSegment(par, p, 4);
    const isTrunk = trunkSet.has(id) && trunkSet.has(n.parent);
    const dim = q && !matches.has(id);

    if (isTrunk) {
      // Classic Kabbalah double-line golden path along the Middle Pillar
      const nx = -seg.uy * 2.8, ny = seg.ux * 2.8;
      const op = dim ? 0.18 : 0.82;
      edgesLayer.appendChild(elNS("line", {
        x1: seg.x1, y1: seg.y1, x2: seg.x2, y2: seg.y2,
        stroke: "#c9a66b", "stroke-width": 5, opacity: dim ? 0.04 : 0.1,
      }));
      for (const sgn of [-1, 1]) {
        edgesLayer.appendChild(elNS("line", {
          x1: seg.x1 + nx * sgn, y1: seg.y1 + ny * sgn,
          x2: seg.x2 + nx * sgn, y2: seg.y2 + ny * sgn,
          stroke: "#c9a66b", "stroke-width": 1.15, opacity: op,
        }));
      }
    } else {
      const stroke = n.status === "rejected" ? "#a65c4e" : "#78674d";
      const line = elNS("line", {
        x1: seg.x1, y1: seg.y1, x2: seg.x2, y2: seg.y2,
        stroke, "stroke-width": 1.15, opacity: dim ? 0.16 : 0.65,
      });
      if (n.status === "rejected") line.setAttribute("stroke-dasharray", "4 4");
      edgesLayer.appendChild(line);
    }
  }

  // 2. Cross-recipe & sibling comparison arcs in vertical layout
  const noSel = !state.selectedId && !state.selectedRefId;
  const obstacles = collectCanvasObstacles(true);
  const placedPills = [];

  const crossPairs = [];
  for (const [id] of Object.entries(state.layout)) {
    const n = DATA.nodes[id];
    if (!n.cross_compare || !n.compare_to || !state.layout[n.compare_to]) continue;
    crossPairs.push([id, n.compare_to]);
  }
  // Sort shorter sibling spans first so nested horizontal brackets never cross each other.
  crossPairs.sort((p1, p2) => {
    const d1 = Math.abs(state.layout[p1[0]].cx - state.layout[p1[1]].cx);
    const d2 = Math.abs(state.layout[p2[0]].cx - state.layout[p2[1]].cx);
    return d1 - d2;
  });
  const treeMinX = allPos.length ? Math.min(...allPos.map(p => p.x)) : -200;
  const treeMaxX = allPos.length ? Math.max(...allPos.map(p => p.x + p.w)) : 200;
  const sameRowRank = {};
  let leftOuterIdx = 0;
  let rightOuterIdx = 0;

  crossPairs.forEach(([srcId, dstId]) => {
    const a = state.layout[srcId], b = state.layout[dstId];
    const src = DATA.nodes[srcId];
    const active = !state.selectedRefId && (state.selectedId === srcId || state.selectedId === dstId);
    const isRootArc = srcId === DATA.meta.root_id;
    const sameRow = Math.abs(a.cy - b.cy) < 12;
    if (!active && !isRootArc) return;
    const targetLayer = (active || isRootArc) ? arcsFgLayer : arcsBgLayer;

    if (sameRow) {
      // Horizontal sibling row: nested rounded U-bracket beneath the row, with pill seated directly on its own rail.
      const rank = sameRowRank[dstId] || 0;
      sameRowRank[dstId] = rank + 1;
      const y1 = a.y + a.h + 2, y2 = b.y + b.h + 2;
      const baseY = Math.max(y1, y2) + (active ? 26 : 16);
      const railStep = active ? 28 : 14;
      let railY = baseY + rank * railStep;

      let txt = "", pillW = 0, lx = (a.cx + b.cx) / 2;
      if (active) {
        txt = src.delta_bpb != null ? `${fmtDelta(src.delta_bpb)} BPB` : L.arcFallback(src.compare_to);
        pillW = Math.max(82, Math.round(txt.length * 6.8 + 16));
        for (let step = 0; step < 8; step++) {
          const rect = { x: lx - pillW / 2 - 4, y: railY - 14, w: pillW + 8, h: 28 };
          if (isRectClear(rect, obstacles, placedPills)) break;
          railY += 28;
        }
      }

      const br = roundedRowBracket(a.cx, y1, b.cx, y2, railY);
      targetLayer.appendChild(elNS("path", {
        d: br.d, fill: "none", stroke: "#7ea8c4",
        "stroke-width": active ? 1.8 : 1.2,
        "stroke-dasharray": "4 4",
        opacity: active ? 0.92 : (noSel ? 0.42 : 0.28),
        "marker-end": "url(#arrow-sep-blue)",
      }));
      if (active) {
        const px = lx - pillW / 2;
        const py = railY - 10;
        targetLayer.appendChild(elNS("rect", {
          x: px, y: py, width: pillW, height: 20, rx: 10,
          fill: "#1a2228", stroke: "#7ea8c4", "stroke-width": 1,
        }));
        targetLayer.appendChild(elNS("text", {
          x: lx, y: railY + 3.5, "text-anchor": "middle",
          "font-size": 10.5, "font-weight": 400, fill: "#b8d6ea", "font-family": "var(--mono)",
        }, txt));
        placedPills.push({ x: px - 4, y: py - 4, w: pillW + 8, h: 28 });
      }
      return;
    }

    // Balance vertical/cross-tier arcs across left and right flanks, keeping pills strictly clear of nodes.
    const avgCx = (a.cx + b.cx) / 2;
    let goRight;
    if (isRootArc) goRight = false;
    else if (Math.abs(avgCx) > 15) goRight = avgCx > 0;
    else goRight = leftOuterIdx > rightOuterIdx;

    const showPill = active || isRootArc;
    if (showPill) {
      const ti = src.is_target ? targetInfo(src) : null;
      const txt = ti && ti.gap != null
        ? L.targetArcLabel(src.compare_to, (ti.rv * 100).toFixed(2), ti.gap)
        : src.delta_bpb != null
          ? (isRootArc
              ? L.arcRootLabel(fmtDelta(-src.delta_bpb))
              : L.arcOtherLabel(src.compare_to, fmtDelta(src.delta_bpb)))
          : L.arcFallback(src.compare_to);
      const charW = state.lang === "en" ? 6.4 : 8.4;
      const pillW = Math.max(176, Math.round(txt.length * charW + 24));
      const routed = routeVerticalArc({
        a, b, preferRight: goRight, pillW, pillH: 22,
        obstacles, placedPills, ignoreIds: new Set([srcId, dstId]), treeMinX, treeMaxX,
      });
      placedPills.push(routed.rect);
      if (routed.lx >= 0) rightOuterIdx++; else leftOuterIdx++;

      targetLayer.appendChild(elNS("path", {
        d: routed.d, fill: "none", stroke: "#7ea8c4",
        "stroke-width": active ? 2.2 : 1.4,
        "stroke-dasharray": "5 5",
        opacity: active ? 0.92 : (isRootArc ? 0.5 : 0.25),
        "marker-end": "url(#arrow-sep-blue)",
      }));
      targetLayer.appendChild(elNS("rect", {
        x: routed.lx - pillW / 2, y: routed.ly - 11, width: pillW, height: 22, rx: 11,
        fill: "#182026", stroke: active ? "#7ea8c4" : "rgba(126,168,196,0.45)", "stroke-width": 1,
      }));
      targetLayer.appendChild(elNS("text", {
        x: routed.lx, y: routed.ly + 3.5, "text-anchor": "middle",
        "font-size": 10.5, "font-weight": 400, fill: "#b8d6ea",
      }, txt));
    } else {
      const sideIdx = goRight ? rightOuterIdx++ : leftOuterIdx++;
      const x1 = goRight ? (a.cx + a.r + 4) : (a.cx - a.r - 4);
      const x2 = goRight ? (b.cx + b.r + 4) : (b.cx - b.r - 4);
      const y1 = a.cy, y2 = b.cy;
      const outerX = goRight
        ? Math.max(treeMaxX + 54, Math.max(x1, x2) + 96) + sideIdx * 36
        : Math.min(treeMinX - 54, Math.min(x1, x2) - 96) - sideIdx * 36;
      const d = `M ${x1} ${y1} C ${outerX} ${y1}, ${outerX} ${y2}, ${x2} ${y2}`;
      targetLayer.appendChild(elNS("path", {
        d, fill: "none", stroke: "#7ea8c4",
        "stroke-width": 1.4,
        "stroke-dasharray": "5 5",
        opacity: noSel ? 0.42 : 0.25,
        "marker-end": "url(#arrow-sep-blue)",
      }));
    }
  });

  // 2b. Inspiration secret paths (all shown subtly when nothing is selected; focused with pills on select)
  function visibleAnchor(id) {
    let cur = id;
    while (cur && !state.layout[cur]) cur = DATA.nodes[cur]?.parent;
    return cur;
  }
  const inspireEdges = [];
  const seenInspire = new Set();
  if (!state.selectedRefId) {
    for (const n of Object.values(DATA.nodes)) {
      for (const edge of (n.inspired_by || [])) {
        if ((noSel && state.showInspiration) || state.selectedId === n.id || state.selectedId === edge.id) {
          const srcVis = visibleAnchor(edge.id);
          const dstVis = visibleAnchor(n.id);
          const key = `${srcVis}->${dstVis}`;
          if (srcVis && dstVis && srcVis !== dstVis && (!noSel || !seenInspire.has(key))) {
            seenInspire.add(key);
            inspireEdges.push({ srcId: srcVis, dstId: dstVis, reason: pick(edge, "reason") });
          }
        }
      }
    }
  }
  inspireEdges.forEach((ie, idx) => {
    const a = state.layout[ie.srcId], b = state.layout[ie.dstId];
    const preferRight = (a.cx + b.cx) >= 0;
    if (noSel) {
      const goRight = preferRight;
      const sideIdx = goRight ? rightOuterIdx++ : leftOuterIdx++;
      const x1 = goRight ? (a.cx + a.r + 4) : (a.cx - a.r - 4);
      const x2 = goRight ? (b.cx + b.r + 4) : (b.cx - b.r - 4);
      const y1 = a.cy, y2 = b.cy;
      const outerX = goRight
        ? Math.max(treeMaxX + 44, Math.max(x1, x2) + 84) + (sideIdx % 4) * 28
        : Math.min(treeMinX - 44, Math.min(x1, x2) - 84) - (sideIdx % 4) * 28;
      const d = `M ${x1} ${y1} C ${outerX} ${y1}, ${outerX} ${y2}, ${x2} ${y2}`;
      arcsBgLayer.appendChild(elNS("path", {
        d, fill: "none", stroke: "#d8a254", "stroke-width": 1.4,
        "stroke-dasharray": "2.5 4.5", "stroke-linecap": "round", opacity: 0.42,
        "marker-end": "url(#arrow-gold)",
      }));
      return;
    }
    const rawTxt = ie.reason ? `${L.inspireBadge} · ${truncLang(ie.reason, 20, 34)}` : L.inspireBadge;
    const charW = state.lang === "en" ? 6.2 : 8.4;
    const pillW = Math.max(88, Math.round(rawTxt.length * charW + 18));
    const routed = routeVerticalArc({
      a, b, preferRight, pillW, pillH: 22,
      obstacles, placedPills, ignoreIds: new Set([ie.srcId, ie.dstId]), treeMinX, treeMaxX,
    });
    placedPills.push(routed.rect);
    arcsFgLayer.appendChild(elNS("path", {
      d: routed.d, fill: "none", stroke: "#d8a254", "stroke-width": 1.9,
      "stroke-dasharray": "2.5 4.5", "stroke-linecap": "round", opacity: 0.92,
      "marker-end": "url(#arrow-gold)",
    }));
    arcsFgLayer.appendChild(elNS("rect", {
      x: routed.lx - pillW / 2, y: routed.ly - 11, width: pillW, height: 22, rx: 11,
      fill: "#221c13", stroke: "#d8a254", "stroke-width": 1,
    }));
    arcsFgLayer.appendChild(elNS("text", {
      x: routed.lx, y: routed.ly + 3.5, "text-anchor": "middle",
      "font-size": 10.5, "font-weight": 400, fill: "#e8c486",
    }, rawTxt));
  });

  // 2c. External reference star-crown strip (above Kether)
  if (Object.keys(state.refLayout).length) {
    const refVals = Object.values(state.refLayout);
    const crownMinX = Math.min(...refVals.map(p => p.x));
    const crownMaxX = Math.max(...refVals.map(p => p.x + p.w));
    refsLayer.appendChild(elNS("text", {
      x: (crownMinX + crownMaxX) / 2, y: 18, "text-anchor": "middle",
      "font-size": 10.5, "font-weight": 400, "letter-spacing": "0.14em", fill: "#74aba2", opacity: 0.9,
    }, `✦  ${L.refStripLabel}  ✦`));

    for (const [rid, rp] of Object.entries(state.refLayout)) {
      const r = DATA.refs[rid];
      const isSel = state.selectedRefId === rid;
      const rg = elNS("g", {
        class: [
          "ref-node-g",
          isSel ? "selected" : "",
          q && !refMatches.has(rid) ? "dim" : "",
        ].filter(Boolean).join(" "),
        transform: `translate(${rp.x}, ${rp.y})`,
      });
      // Chamfered octagon antique tablet for external knowledge cards
      const c = 10, w = rp.w, h = rp.h;
      const pts = `${c},0 ${w - c},0 ${w},${c} ${w},${h - c} ${w - c},${h} ${c},${h} 0,${h - c} 0,${c}`;
      rg.appendChild(elNS("polygon", {
        class: "node-rect", points: pts,
        fill: isSel ? "#1b2826" : "#171f1e",
        stroke: isSel ? "#98cbc2" : "#4b746d",
        "stroke-width": isSel ? 1.8 : 1.1,
      }));
      rg.appendChild(elNS("text", {
        x: 12, y: 18, "font-size": 9.5, "font-weight": 400, "letter-spacing": "0.08em", fill: "#74aba2",
      }, refKindLabel(r.kind)));
      rg.appendChild(elNS("text", {
        x: w - 12, y: 18, "text-anchor": "end", "font-size": 9.2, fill: "#6b8b86",
      }, L.refUsedCount((r.used_by || []).length)));
      rg.appendChild(elNS("text", {
        x: 12, y: 36, "font-size": 12, "font-weight": 400, fill: "#e8decb",
      }, truncLang(pick(r, "label") || r.id, 13, 22)));
      rg.appendChild(elNS("text", {
        x: 12, y: 50, "font-size": 9.5, fill: "#839995",
      }, trunc(r.authors || (r.links[0]?.label || ""), 26)));

      rg.addEventListener("click", () => selectRef(rid));
      refsLayer.appendChild(rg);
    }

    // Teal light rays from crown refs to linked Sephiroth (all subtly when nothing is selected; focused on select)
    const refEdges = [];
    const seenRef = new Set();
    for (const r of Object.values(DATA.refs || {})) {
      const rp = state.refLayout[r.id];
      if (!rp) continue;
      for (const u of (r.used_by || [])) {
        if ((noSel && state.showRefs) || state.selectedRefId === r.id || (!state.selectedRefId && state.selectedId === u.id)) {
          const dstVis = visibleAnchor(u.id);
          const key = `${r.id}->${dstVis}`;
          if (dstVis && state.layout[dstVis] && !seenRef.has(key)) {
            seenRef.add(key);
            refEdges.push({ refId: r.id, dstId: dstVis });
          }
        }
      }
    }
    refEdges.forEach((re, idx) => {
      const rp = state.refLayout[re.refId], dp = state.layout[re.dstId];
      const x1 = rp.cx, y1 = rp.y + rp.h + 2;
      const x2 = dp.cx, y2 = dp.cy - dp.r - 4;
      const midY = y1 + (y2 - y1) * (0.35 + (idx % 3) * 0.14);
      const d = `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`;
      const targetLayer = noSel ? arcsBgLayer : arcsFgLayer;
      targetLayer.appendChild(elNS("path", {
        d, fill: "none", stroke: "#74aba2", "stroke-width": noSel ? 1.2 : 1.6,
        "stroke-dasharray": "6 3 2 3", opacity: noSel ? 0.34 : 0.88,
        "marker-end": "url(#arrow-sep-teal)",
      }));
    });
  }

  // 3. Sephiroth Nodes (circular antique sigils)
  const trunkIndex = {};
  DATA.meta.trunk.forEach((tid, i) => { trunkIndex[tid] = i; });

  for (const [id, p] of Object.entries(state.layout)) {
    const n = DATA.nodes[id];
    const big = isMilestoneNode(n);
    const r = p.r;
    const isSel = !state.selectedRefId && state.selectedId === id;
    const g = elNS("g", {
      class: [
        "node-g",
        isSel ? "selected" : "",
        q && !matches.has(id) ? "dim" : "",
      ].filter(Boolean).join(" "),
      transform: `translate(${p.cx}, ${p.cy})`,
    });

    // Palette per Sephirah role
    let fill = "#1c1915", stroke = "#6a5c47", innerStroke = "rgba(201,166,107,0.22)", accent = "#c9a66b";
    if (n.status === "root") {
      fill = "#201a24"; stroke = "#b196ce"; innerStroke = "rgba(177,150,206,0.35)"; accent = "#cbb5e4";
    } else if (n.is_head) {
      fill = "#231e15"; stroke = "#e2c48c"; innerStroke = "rgba(226,196,140,0.45)"; accent = "#f0d7a2";
    } else if (n.status === "adopted") {
      fill = "#1f1b14"; stroke = "#c9a66b"; innerStroke = "rgba(201,166,107,0.35)"; accent = "#dfbe82";
    } else if (n.is_target) {
      fill = "#171d22"; stroke = "#7ea8c4"; innerStroke = "rgba(126,168,196,0.32)"; accent = "#a9c8dc";
    } else if (n.status === "rejected") {
      fill = "#211715"; stroke = "#b56354"; innerStroke = "rgba(181,99,84,0.3)"; accent = "#d98879";
    } else if (n.is_group) {
      fill = "#201b13"; stroke = "#c8964e"; innerStroke = "rgba(200,150,78,0.34)"; accent = "#e2b872";
    } else if (big) {
      fill = "#211c13"; stroke = "#d8a254"; innerStroke = "rgba(216,162,84,0.38)"; accent = "#e8be7a";
    }

    // Subtle golden aura behind milestone / HEAD nodes
    if (n.is_head || n.status === "root") {
      g.appendChild(elNS("circle", {
        cx: 0, cy: 0, r: r + 7, fill: "none",
        stroke: stroke, "stroke-width": 0.9, opacity: 0.28, "stroke-dasharray": "2 4",
      }));
    }

    // Outer circle
    const outer = elNS("circle", {
      class: "node-rect", cx: 0, cy: 0, r, fill, stroke,
      "stroke-width": big ? 1.8 : 1.2,
    });
    if (n.status === "rejected" || n.is_placeholder) outer.setAttribute("stroke-dasharray", "5 4");
    else if (n.is_target) outer.setAttribute("stroke-dasharray", "2 3");
    else if (n.is_group && state.collapsed[id]) outer.setAttribute("stroke-dasharray", "6 3");
    if (n.is_head) outer.setAttribute("filter", "url(#gold-glow)");
    g.appendChild(outer);

    // Inner sacred ring & cardinal tick marks on milestones; inscribed diamond on group clusters
    if (n.is_group) {
      const dr = r * 0.72;
      g.appendChild(elNS("polygon", {
        points: `0,${-dr} ${dr},0 0,${dr} ${-dr},0`,
        fill: "none", stroke: innerStroke, "stroke-width": 0.9,
      }));
    } else if (big) {
      g.appendChild(elNS("circle", {
        cx: 0, cy: 0, r: r - 5.5, fill: "none", stroke: innerStroke, "stroke-width": 0.85,
      }));
      for (const [tx1, ty1, tx2, ty2] of [
        [0, -r - 3, 0, -r + 4], [0, r - 4, 0, r + 3],
        [-r - 3, 0, -r + 4, 0], [r - 4, 0, r + 3, 0],
      ]) {
        g.appendChild(elNS("line", {
          x1: tx1, y1: ty1, x2: tx2, y2: ty2, stroke: accent, "stroke-width": 1.0, opacity: 0.75,
        }));
      }
    }

    // Top numeral / emblem inside circle
    if (big) {
      const sigil = trunkIndex[id] != null ? (ROMAN[trunkIndex[id]] || "✦") : "✦";
      g.appendChild(elNS("text", {
        x: 0, y: -r + 17, "text-anchor": "middle",
        "font-size": 10.5, "font-weight": 400, "letter-spacing": "0.14em", fill: accent,
      }, sigil));
    }

    // Label (thin antique serif)
    const lblMaxZh = big ? 8 : 7;
    const lblMaxEn = big ? 14 : 12;
    g.appendChild(elNS("text", {
      x: 0, y: big ? -11 : -9, "text-anchor": "middle",
      "font-size": big ? 12.2 : 11, "font-weight": 400, "letter-spacing": "0.04em", fill: "#efe5d3",
    }, truncLang(nodeLabel(n), lblMaxZh, lblMaxEn)));

    // Main metric (val BPB or group best)
    if (n.is_group) {
      const gs = n.group_stats || {};
      g.appendChild(elNS("text", {
        x: 0, y: 10, "text-anchor": "middle",
        "font-size": big ? 13 : 11.5, "font-weight": 400, fill: accent, "font-family": "var(--mono)",
      }, fmtBpb(gs.best_bpb)));
      g.appendChild(elNS("text", {
        x: 0, y: 24, "text-anchor": "middle",
        "font-size": 9.5, fill: "#9e917c",
      }, `${gs.count || 0} runs`));
    } else {
      const bpbText = n.is_target
        ? pctText(targetInfo(n).v)
        : (n.is_placeholder && n.val_bpb != null ? `~${fmtBpb(n.val_bpb)}` : fmtBpb(n.val_bpb));
      g.appendChild(elNS("text", {
        x: 0, y: big ? 11 : 10, "text-anchor": "middle",
        "font-size": big ? 15 : 12.5, "font-weight": 400, fill: n.is_placeholder ? "#bfb39d" : "#f4ead7", "font-family": "var(--mono)",
      }, bpbText));

      // Delicate delta inscription below BPB
      let dTxt = "", dCol = "#968a75";
      if (n.is_target) {
        const ti = targetInfo(n);
        if (ti.gap != null) { dTxt = L.targetGapShort(ti.gap); dCol = "#8eb4cc"; }
      } else if (n.is_placeholder) {
        dTxt = L.placeholderCardTag; dCol = "#cbb5e4";
      } else if (n.delta_bpb != null) {
        dTxt = fmtDelta(n.delta_bpb);
        if (n.in_noise) { dCol = "#8a7f6c"; dTxt += " · " + L.deltaNoiseShort; }
        else if (n.delta_bpb < 0) dCol = "#dfbe82";
        else dCol = "#d98474";
      } else if (n.compare_to && DATA.nodes[n.compare_to]?.is_placeholder) {
        dTxt = L.placeholderRefPending; dCol = "#9e917c";
      } else if (n.status === "adopted" && n.parent === DATA.meta.root_id && DATA.nodes[DATA.meta.root_id]?.cross_compare) {
        dTxt = L.deltaSeeArc; dCol = "#8eb4cc";
      } else if (n.compare_to == null && n.status !== "root") {
        dTxt = L.deltaStandalone; dCol = "#8a7f6c";
      }
      if (dTxt) {
        g.appendChild(elNS("text", {
          x: 0, y: big ? 28 : 24, "text-anchor": "middle",
          "font-size": 9.6, "font-weight": 400, fill: dCol, "font-family": "var(--mono)",
        }, dTxt));
      }
    }

    // Bottom centered compact artifact leaf pills or group expand/collapse seal
    const footY = r + 9;
    if (n.is_group) {
      const isCol = Boolean(state.collapsed[id]);
      const gs = n.group_stats || {};
      const btnText = isCol ? `✦ +${gs.count || n.children.length}` : "✦ −";
      const bw = Math.max(54, btnText.length * 8 + 16);
      const tg = elNS("g", { class: "toggle-btn", transform: `translate(${-bw / 2}, ${footY})` });
      tg.appendChild(elNS("rect", {
        x: 0, y: 0, width: bw, height: 18, rx: 9,
        fill: "#231d14", stroke: "#c8964e", "stroke-width": 0.9,
      }));
      tg.appendChild(elNS("text", {
        x: bw / 2, y: 12.5, "text-anchor": "middle",
        "font-size": 10, "font-weight": 400, fill: "#e6c384",
      }, btnText));
      tg.addEventListener("click", (ev) => {
        ev.stopPropagation();
        state.collapsed[id] = !state.collapsed[id];
        renderTree();
      });
      g.appendChild(tg);
    } else if (n.artifacts) {
      drawLeafPillsSephiroth(g, n, footY);
    }

    g.addEventListener("click", () => selectNode(id));
    nodesLayer.appendChild(g);
  }
}

function drawLeafPillsSephiroth(g, n, y) {
  const a = n.artifacts;
  const hasT2 = n.bench && n.bench.tier === "tier2";
  const hasBench = Boolean(n.bench);
  const pills = [
    { label: "ckpt", ok: a.ckpt_exists, tab: "artifacts", fg: a.ckpt_exists ? "#d6b77c" : "#645b4d" },
    { label: hasT2 ? "T2" : (hasBench ? "T1" : "—"), ok: hasBench, tab: "bench", fg: hasT2 ? "#8eb4cc" : (hasBench ? "#7a98ad" : "#645b4d") },
    { label: "smp", ok: a.samples_exists, tab: "artifacts", fg: a.samples_exists ? "#b89fd4" : "#645b4d" },
  ];
  const widths = pills.map(pl => Math.max(24, Math.round(pl.label.length * 6.2 + 12)));
  const totalW = widths.reduce((s, w) => s + w, 0) + (pills.length - 1) * 4;
  let cx = -totalW / 2;
  pills.forEach((pl, i) => {
    const w = widths[i];
    const pg = elNS("g", { class: "leaf-pill", transform: `translate(${cx}, ${y})` });
    pg.appendChild(elNS("rect", {
      x: 0, y: 0, width: w, height: 16, rx: 8,
      fill: pl.ok ? "#1f1b15" : "#161411",
      stroke: pl.ok ? pl.fg : "#342d23",
      "stroke-width": 0.75, opacity: pl.ok ? 0.92 : 0.55,
    }));
    pg.appendChild(elNS("text", {
      x: w / 2, y: 11.2, "text-anchor": "middle",
      "font-size": 9, "font-weight": 400, fill: pl.fg, "font-family": "var(--mono)",
    }, pl.label));
    pg.addEventListener("click", (ev) => {
      ev.stopPropagation();
      selectNode(n.id, pl.tab);
    });
    g.appendChild(pg);
    cx += w + 4;
  });
}

function selectNode(id, tab = null) {
  if (!DATA.nodes[id]) return;
  state.selectedRefId = null;
  state.selectedId = id;
  if (tab) state.activeTab = tab;
  let cur = DATA.nodes[id].parent;
  while (cur) {
    if (state.collapsed[cur]) state.collapsed[cur] = false;
    cur = DATA.nodes[cur].parent;
  }
  renderTree();
  renderDrawer();
  ensureVisible(id);
}

function selectRef(rid) {
  if (!DATA.refs || !DATA.refs[rid]) return;
  state.selectedRefId = rid;
  renderTree();
  renderDrawer();
}

function clearSelection() {
  if (state.selectedId === null && state.selectedRefId === null) return;
  state.selectedId = null;
  state.selectedRefId = null;
  renderTree();
  renderDrawer();
}

function renderOverviewDrawer() {
  const L = t();
  document.getElementById("d-badges").innerHTML = `<span class="badge badge-branch">${esc(L.badgeOverview)}</span>`;
  document.getElementById("d-title").textContent = L.overviewTitle;
  document.getElementById("d-runid").innerHTML = `<span>${esc(L.overviewSubtitle)}</span>`;
  document.getElementById("d-tabs").style.display = "none";

  const head = DATA.nodes[DATA.meta.head_id];
  const trunkRows = (DATA.meta.trunk || []).map(tid => {
    const tn = DATA.nodes[tid];
    if (!tn) return "";
    const bpb = tn.is_placeholder && tn.val_bpb != null ? `~${fmtBpb(tn.val_bpb)}` : fmtBpb(tn.val_bpb);
    const delta = tn.delta_bpb != null ? fmtDelta(tn.delta_bpb) : (tn.is_placeholder ? L.placeholderShort : "—");
    return `<tr>
      <td><button class="link-btn" data-jump="${esc(tid)}">${esc(nodeLabel(tn))}</button></td>
      <td style="font-family:var(--mono)">${esc(bpb)}</td>
      <td style="font-family:var(--mono)">${esc(delta)}</td>
    </tr>`;
  }).join("");

  const target = Object.values(DATA.nodes).find(x => x.is_target);
  let targetKpis = "";
  if (target) {
    const ti = targetInfo(target);
    targetKpis = `
      <div class="kpi">
        <div class="kpi-label">${esc(L.targetKpi(ti.label))}</div>
        <div class="kpi-val">${pctText(ti.v)}</div>
        <div class="kpi-sub"><button class="link-btn" data-jump="${esc(target.id)}">${esc(nodeLabel(target))}</button></div>
      </div>
      <div class="kpi">
        <div class="kpi-label">${esc(L.targetClosestKpi(ti.label))}</div>
        <div class="kpi-val">${pctText(ti.rv)}</div>
        <div class="kpi-sub">${ti.ref ? `${ti.gap != null ? esc(L.targetGapShort(ti.gap)) + " · " : ""}<button class="link-btn" data-jump="${esc(ti.ref.id)}">${esc(nodeLabel(ti.ref))}</button>` : "—"}</div>
      </div>`;
  }

  const body = document.getElementById("d-body");
  body.innerHTML = `
    <div class="takeaway-box branch">${esc(L.overviewHint)}</div>
    <div class="kpi-grid">
      <div class="kpi">
        <div class="kpi-label">${esc(L.overviewKpiHead)}</div>
        <div class="kpi-val">${fmtBpb(head?.val_bpb)}</div>
        <div class="kpi-sub">${head ? `<button class="link-btn" data-jump="${esc(head.id)}">${esc(nodeLabel(head))}</button>` : "—"}</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">${esc(L.overviewKpiRuns)}</div>
        <div class="kpi-val">${DATA.meta.total_runs}</div>
        <div class="kpi-sub">${esc(L.overviewKpiNoise)}: ±${DATA.meta.noise_floor}</div>
      </div>
      ${targetKpis}
    </div>
    <div class="section-h">${esc(L.overviewTrunkSection)}</div>
    <table class="data"><thead><tr><th>${L.thNode}</th><th>val BPB</th><th>ΔBPB</th></tr></thead><tbody>${trunkRows}</tbody></table>`;

  body.querySelectorAll("[data-jump]").forEach(el => {
    el.addEventListener("click", () => selectNode(el.dataset.jump));
  });
}

function renderRefDrawer(r) {
  const L = t();
  document.getElementById("d-badges").innerHTML = `<span class="badge badge-ref">${esc(refKindLabel(r.kind))}</span>`;
  document.getElementById("d-title").textContent = pick(r, "label") || r.id;
  document.getElementById("d-runid").innerHTML = `<span>${esc(r.authors || r.id)}</span>`;
  document.getElementById("d-tabs").style.display = "none";

  const parts = [];
  const summary = pick(r, "summary");
  if (summary) parts.push(`<div class="ref-summary-box">${esc(summary)}</div>`);

  if (r.links && r.links.length) {
    const linksHtml = r.links.map(lk => `
      <a class="ext-link" href="${esc(lk.url)}" target="_blank" rel="noopener noreferrer">
        <span>${esc(lk.label)}</span><span>↗</span>
      </a>`).join("");
    parts.push(`<div class="section-h">${esc(L.sectionRefLinks)}</div><div class="ext-link-list">${linksHtml}</div>`);
  }

  if (r.used_by && r.used_by.length) {
    const items = r.used_by.map(u => {
      const reason = pick(u, "reason");
      const bpb = u.val_bpb != null ? ` · val BPB ${fmtBpb(u.val_bpb)}` : "";
      return `<div class="ref-item">
        → <button class="link-btn" data-jump="${esc(u.id)}">${esc(pick(u, "label") || u.id)}</button><span style="font-family:var(--mono);font-size:11px;color:var(--muted)">${bpb}</span>
        ${reason ? `<span class="reason">${esc(reason)}</span>` : ""}
      </div>`;
    }).join("");
    parts.push(`<div class="section-h">${esc(L.sectionRefUsedBy)}</div><div class="inspire-list">${items}</div>`);
  }

  const body = document.getElementById("d-body");
  body.innerHTML = parts.join("");
  body.querySelectorAll("[data-jump]").forEach(el => {
    el.addEventListener("click", () => selectNode(el.dataset.jump));
  });
  body.querySelectorAll("[data-ref]").forEach(el => {
    el.addEventListener("click", () => selectRef(el.dataset.ref));
  });
}

function renderDrawer() {
  if (state.selectedRefId && DATA.refs && DATA.refs[state.selectedRefId]) {
    renderRefDrawer(DATA.refs[state.selectedRefId]);
    return;
  }
  const n = state.selectedId ? DATA.nodes[state.selectedId] : null;
  if (!n) {
    renderOverviewDrawer();
    return;
  }
  document.getElementById("d-tabs").style.display = "flex";
  const L = t();

  const badges = [];
  if (n.is_target) badges.push(`<span class="badge badge-target">${L.badgeTarget}</span>`);
  else if (n.status === "root") badges.push(`<span class="badge badge-root">${L.badgeRoot}</span>`);
  else if (n.is_head) badges.push(`<span class="badge badge-adopted">${L.badgeHead}</span>`);
  else if (n.status === "adopted") badges.push(`<span class="badge badge-adopted">${L.badgeAdopted}</span>`);
  else if (n.is_group) {
    badges.push(`<span class="badge badge-group">${L.badgeGroup}</span>`);
    if (n.status === "rejected") badges.push(`<span class="badge badge-rejected">${L.badgeRejected}</span>`);
  } else if (n.status === "rejected") badges.push(`<span class="badge badge-rejected">${L.badgeRejected}</span>`);
  else badges.push(`<span class="badge badge-branch">${L.badgeBranch}</span>`);
  const ms = nodeMilestone(n);
  if (ms) badges.push(`<span class="badge badge-milestone">★ ${esc(ms)}</span>`);
  if (n.is_placeholder) badges.push(`<span class="badge badge-placeholder">${L.badgePlaceholder}</span>`);
  document.getElementById("d-badges").innerHTML = badges.join("");
  document.getElementById("d-title").textContent = nodeLabel(n);
  document.getElementById("d-runid").innerHTML = n.is_group
    ? `<span>${L.groupCountSubtitle(n.group_stats?.count || 0)}</span>`
    : n.is_target
      ? `<span>${esc(n.id)}</span><span>· ${esc(L.targetSource)}</span>`
    : n.is_placeholder
      ? `<span>${L.placeholderRunId}</span>`
      : `<span>${esc(n.run_id)}</span>${n.date ? `<span>· ${esc(n.date)}</span>` : ""}${n.git_sha ? `<span>· ${esc(n.git_sha)}</span>` : ""}`;

  document.querySelectorAll("#d-tabs .tab").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.tab === state.activeTab);
  });

  const body = document.getElementById("d-body");
  if (state.activeTab === "overview") body.innerHTML = renderOverviewTab(n);
  else if (state.activeTab === "bench") body.innerHTML = renderBenchTab(n);
  else if (state.activeTab === "curve") body.innerHTML = renderCurveTab(n);
  else body.innerHTML = renderArtifactsTab(n);

  body.querySelectorAll("[data-jump]").forEach(el => {
    el.addEventListener("click", () => selectNode(el.dataset.jump));
  });
  body.querySelectorAll("[data-ref]").forEach(el => {
    el.addEventListener("click", () => selectRef(el.dataset.ref));
  });
  const sel = body.querySelector("#sample-select");
  if (sel) {
    sel.addEventListener("change", () => { state.sampleIdx = Number(sel.value); renderDrawer(); });
  }
  const cmpChk = body.querySelector("#sample-cmp-chk");
  if (cmpChk) {
    cmpChk.addEventListener("change", () => { state.compareSamples = cmpChk.checked; renderDrawer(); });
  }
}

function renderInspirationBlocks(n) {
  const L = t();
  const out = [];
  if (n.inspired_by && n.inspired_by.length) {
    const items = n.inspired_by.map(x => {
      const r = pick(x, "reason");
      return `<div class="inspire-item">← <button class="link-btn" data-jump="${esc(x.id)}">${esc(pick(x, "label") || x.id)}</button>${r ? `<span class="reason">${esc(r)}</span>` : ""}</div>`;
    }).join("");
    out.push(`<div class="section-h">${esc(L.sectionInspiredBy)}</div><div class="inspire-list">${items}</div>`);
  }
  if (n.inspired && n.inspired.length) {
    const items = n.inspired.map(x => {
      const r = pick(x, "reason");
      return `<div class="inspire-item">→ <button class="link-btn" data-jump="${esc(x.id)}">${esc(pick(x, "label") || x.id)}</button>${r ? `<span class="reason">${esc(r)}</span>` : ""}</div>`;
    }).join("");
    out.push(`<div class="section-h">${esc(L.sectionInspired)}</div><div class="inspire-list">${items}</div>`);
  }
  if (n.refs && n.refs.length) {
    const items = n.refs.map(x => {
      const r = pick(x, "reason");
      const ext = x.primary_url
        ? `<a class="ext-mini" href="${esc(x.primary_url)}" target="_blank" rel="noopener noreferrer">${esc(L.refOpenPaper)}</a>`
        : "";
      return `<div class="ref-item"><button class="link-btn" style="color:var(--ref-dark)" data-ref="${esc(x.id)}">${esc(pick(x, "label") || x.id)}</button>${ext}${r ? `<span class="reason">${esc(r)}</span>` : ""}</div>`;
    }).join("");
    out.push(`<div class="section-h">${esc(L.sectionExternalRefs)}</div><div class="inspire-list">${items}</div>`);
  }
  return out.join("");
}

function renderOverviewTab(n) {
  const L = t();
  const parts = [];
  const takeaway = nodeTakeaway(n);
  if (takeaway) {
    const cls = { root: "root", adopted: "", rejected: "rejected" }[n.status] ?? "branch";
    parts.push(`<div class="takeaway-box ${cls}">${esc(takeaway)}</div>`);
  }
  const protocol = nodeProtocol(n);
  if (protocol) {
    parts.push(`<div class="protocol-box"><strong>${L.protocolPrefix}</strong>${esc(protocol)}</div>`);
  }

  if (n.is_target) {
    const ti = targetInfo(n);
    const core = n.bench?.core != null ? (n.bench.core >= 0 ? "+" : "") + n.bench.core.toFixed(4) : "—";
    const closest = ti.ref
      ? `${ti.gap != null ? esc(L.targetGapShort(ti.gap)) + " · " : ""}<button class="link-btn" data-jump="${esc(ti.ref.id)}">${esc(nodeLabel(ti.ref))}</button>`
      : "—";
    parts.push(`<div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">${esc(L.targetKpi(ti.label))}</div><div class="kpi-val">${pctText(ti.v)}</div><div class="kpi-sub">${esc(L.targetKpiSub)}</div></div>
      <div class="kpi"><div class="kpi-label">${esc(L.targetClosestKpi(ti.label))}</div><div class="kpi-val">${pctText(ti.rv)}</div><div class="kpi-sub">${closest}</div></div>
      ${n.val_bpb != null ? `
      <div class="kpi"><div class="kpi-label">${esc(L.targetBpbKpi)}</div><div class="kpi-val">${fmtBpb(n.val_bpb)}</div><div class="kpi-sub">${esc(L.targetBpbSub)}</div></div>
      <div class="kpi"><div class="kpi-label">${esc(L.targetOurBpbKpi)}</div><div class="kpi-val">${fmtBpb(ti.ref?.val_bpb)}</div><div class="kpi-sub">${n.delta_bpb != null ? esc(L.targetBpbDelta(fmtDelta(-n.delta_bpb), n.in_noise)) : "—"}</div></div>` : ""}
      <div class="kpi"><div class="kpi-label">${esc(L.kpiParams)}</div><div class="kpi-val">${esc(n.params || "—")}</div></div>
      <div class="kpi"><div class="kpi-label">${esc(L.kpiCoreAvg)}</div><div class="kpi-val">${core}</div><div class="kpi-sub">${n.bench ? (n.bench.tier === "tier2" ? L.tier2Label : L.defaultBenchLabel) : L.noBenchShort}</div></div>
    </div>`);
    parts.push(renderInspirationBlocks(n));
    return parts.join("");
  }

  if (n.is_group) {
    const gs = n.group_stats || {};
    const bestLbl = (state.lang === "en" && gs.best_label_en) ? gs.best_label_en : gs.best_label;
    parts.push(`<div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">${L.kpiSubRuns}</div><div class="kpi-val">${gs.count || 0}</div></div>
      <div class="kpi"><div class="kpi-label">${L.kpiBestInGroup}</div><div class="kpi-val">${fmtBpb(gs.best_bpb)}</div>
        <div class="kpi-sub">${gs.best_id ? `<button class="link-btn" data-jump="${esc(gs.best_id)}">${esc(bestLbl)}</button>` : "—"}</div>
      </div>
    </div>`);
    const rows = collectDescRuns(n.id).map(r => `
      <tr>
        <td><button class="link-btn" data-jump="${esc(r.id)}">${esc(nodeLabel(r))}</button>${r.status === "rejected" ? ` <span class="badge badge-rejected">${L.badgeRejected}</span>` : ""}</td>
        <td>${fmtBpb(r.val_bpb)}</td>
        <td>${r.delta_bpb != null ? fmtDelta(r.delta_bpb) : "—"}</td>
      </tr>`).join("");
    parts.push(`<div class="section-h">${L.sectionIncludedRuns}</div><table class="data"><thead><tr><th>${L.thNode}</th><th>val BPB</th><th>ΔBPB</th></tr></thead><tbody>${rows}</tbody></table>`);
    parts.push(renderInspirationBlocks(n));
    return parts.join("");
  }

  const ref = n.compare_to ? DATA.nodes[n.compare_to] : null;
  let deltaCls = "delta-noise", deltaSub = L.noDirectRef;
  if (ref && n.delta_bpb != null) {
    deltaCls = n.in_noise ? "delta-noise" : (n.delta_bpb < 0 ? "delta-good" : "delta-bad");
    const verdict = n.in_noise
      ? L.verdictNoise(DATA.meta.noise_floor)
      : (n.delta_bpb < 0 ? L.verdictBetter : L.verdictWorse);
    deltaSub = `${verdict} · vs <button class="link-btn" data-jump="${esc(ref.id)}">${esc(nodeLabel(ref))}</button>`;
  } else if (ref && ref.is_placeholder) {
    deltaSub = `${L.placeholderDeltaSub} · vs <button class="link-btn" data-jump="${esc(ref.id)}">${esc(nodeLabel(ref))}</button>`;
  } else if (n.compare_to == null && n.parent) {
    deltaSub = L.noSubtractCross;
  }

  const speedText = n.tok_per_s ? `${(n.tok_per_s / 1000).toFixed(1)}k tok/s` : "—";
  const mfuText = n.mfu != null ? `MFU ${(n.mfu * 100).toFixed(1)}%` : "";

  const tokLabel = n.token_offset_m > 0
    ? L.tokensWithOffset(n.tokens || "—", Math.round(n.token_offset_m))
    : `${n.tokens || "—"} tokens`;
  const valKpiMain = n.is_placeholder && n.val_bpb != null ? `~${fmtBpb(n.val_bpb)}` : fmtBpb(n.val_bpb);
  const valKpiSub = n.is_placeholder
    ? `${L.placeholderValSub}${n.tokens ? " · " + n.tokens + " tokens" : ""}`
    : `${tokLabel} · ${n.wall_h != null ? n.wall_h + " h" : "—"}`
      + (n.val_bpb_clean != null ? ` · ${L.cleanBpb} ${fmtBpb(n.val_bpb_clean)}` : "");

  parts.push(`<div class="kpi-grid">
    <div class="kpi">
      <div class="kpi-label">${L.kpiValBpb}</div>
      <div class="kpi-val">${valKpiMain}</div>
      <div class="kpi-sub">${esc(valKpiSub)}</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">${L.kpiDeltaBpb}</div>
      <div class="kpi-val ${deltaCls}">${fmtDelta(n.delta_bpb)}</div>
      <div class="kpi-sub">${deltaSub}</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">${L.kpiParamsSpeed}</div>
      <div class="kpi-val" style="font-size:15px">${esc(n.params || "—")}</div>
      <div class="kpi-sub">${speedText}${mfuText ? " · " + mfuText : ""}</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">${L.kpiCoreAvg}</div>
      <div class="kpi-val" style="font-size:15px">${n.bench?.core != null ? (n.bench.core >= 0 ? "+" : "") + n.bench.core.toFixed(4) : "—"}</div>
      <div class="kpi-sub">${n.bench ? (n.bench.tier === "tier2" ? L.tier2Label : L.defaultBenchLabel) : L.noBenchShort}</div>
    </div>
  </div>`);

  if (ref) {
    parts.push(`<div class="section-h">${L.sectionDiff(esc(ref.id))}</div>`);
    if (n.config_diff && n.config_diff.length) {
      const rows = n.config_diff.map(d => `
        <tr>
          <td>${esc(pick(d, "label"))}</td>
          <td style="text-align:right"><span class="diff-old">${esc(d.from)}</span> → <span class="diff-new">${esc(d.to)}</span></td>
        </tr>`).join("");
      parts.push(`<table class="data"><tbody>${rows}</tbody></table>`);
    } else {
      parts.push(`<div class="note-small">${L.noConfigDiff}</div>`);
    }
  }

  if (n.compared_by && n.compared_by.length) {
    const items = n.compared_by.map(c => {
      const d = c.delta_from_other;
      const cls = d == null ? "" : (Math.abs(d) < DATA.meta.noise_floor ? "delta-noise" : (d < 0 ? "delta-good" : "delta-bad"));
      return `<tr>
        <td><button class="link-btn" data-jump="${esc(c.id)}">${esc(pick(c, "label") || c.id)}</button></td>
        <td class="${cls}" style="font-family:var(--mono);font-weight:600">${fmtDelta(d)}</td>
      </tr>`;
    }).join("");
    parts.push(`<div class="section-h">${L.sectionComparedBy}</div>
      <table class="data"><thead><tr><th>${L.thOther}</th><th>${L.thThisDelta}</th></tr></thead><tbody>${items}</tbody></table>`);
  }

  parts.push(renderInspirationBlocks(n));

  if (!n.is_placeholder) {
    const cfg = n.config || {};
    parts.push(`<div class="section-h">${L.sectionRunMeta}</div>
      <dl class="meta-list">
        <dt>${L.metaChange}</dt><dd>${esc(n.change || "—")}</dd>
        <dt>${L.metaShape}</dt><dd>${esc(cfg.arch || "—")} · L${cfg.n_layer ?? "?"} d${cfg.d_model ?? "?"} h${cfg.n_head ?? "?"}/${cfg.n_kv_head ?? "?"} ff${cfg.d_ff ?? "?"}</dd>
        <dt>${L.metaRecipe}</dt><dd>${esc(cfg.schedule || "—")} · bs ${cfg.batch_tokens ?? "?"} · lr ${cfg.lr ?? "?"} · wu ${cfg.warmup_steps ?? "?"} · seed ${cfg.seed ?? "?"}</dd>
        <dt>${L.metaDataGit}</dt><dd>${esc(cfg.data || "—")} · ${esc(n.date || "—")} · ${esc(n.git_sha || "—")}</dd>
      </dl>`);
  }
  return parts.join("");
}

function renderBenchTab(n) {
  const L = t();
  if (n.is_group) return `<div class="empty-state">${L.benchGroupEmpty}</div>`;
  if (n.is_placeholder) return `<div class="empty-state">${L.placeholderEmpty}</div>`;
  if (!n.bench) return `<div class="empty-state">${L.benchEmpty}</div>`;

  const ref = n.compare_to ? DATA.nodes[n.compare_to] : null;
  const refScores = ref?.bench?.scores || {};
  const pairedMap = {};
  for (const r of (n.paired_bench || [])) pairedMap[r.task] = r;
  // A target is read from our side: our closest run minus the target, so negative means behind.
  const sign = n.is_target ? -1 : 1;

  const rows = DATA.meta.bench_tasks.map(tKey => {
    const val = n.bench.scores[tKey];
    if (val == null && refScores[tKey] == null) return "";
    const rval = refScores[tKey];
    const pr = pairedMap[tKey];
    let diffHtml = "—";
    if (pr) {
      const d = sign * pr.d_acc;
      const cls = pr.p_acc != null && pr.p_acc < 0.05 ? (d > 0 ? "delta-good" : "delta-bad") : "delta-noise";
      diffHtml = `<span class="${cls}">${d >= 0 ? "+" : "−"}${Math.abs(d * 100).toFixed(2)} pp</span><br><span style="font-size:10.5px;color:var(--muted)">p=${fmtP(pr.p_acc)}</span>`;
    } else if (val != null && rval != null) {
      const d = sign * (val - rval);
      diffHtml = `${d >= 0 ? "+" : "−"}${Math.abs(d * 100).toFixed(2)} pp`;
    }
    let probHtml = "—";
    if (pr) {
      const d = sign * pr.d_prob;
      const cls = pr.p_prob != null && pr.p_prob < 0.05 ? (d > 0 ? "delta-good" : "delta-bad") : "delta-noise";
      probHtml = `<span class="${cls}">${d >= 0 ? "+" : "−"}${Math.abs(d).toFixed(4)}</span><br><span style="font-size:10.5px;color:var(--muted)">p=${fmtP(pr.p_prob)}</span>`;
    }
    const star = pr?.short_answer ? " *" : "";
    return `<tr>
      <td>${TASK_LABELS[tKey] || tKey}${star}<br><span style="font-size:10.5px;color:var(--muted)">${L.chanceFmt((CHANCE[tKey]*100).toFixed(0))}</span></td>
      <td><strong>${fmtPct(val)}</strong></td>
      <td>${diffHtml}</td>
      <td>${probHtml}</td>
    </tr>`;
  }).filter(Boolean).join("");

  // ΔCORE over the tasks both runs have: a 4-task mean minus a 6-task mean can flip the sign.
  const shared = ref?.bench ? Object.keys(CHANCE).filter(t => n.bench.scores[t] != null && ref.bench.scores[t] != null) : [];
  const coreOn = (s) => shared.reduce((a, t) => a + (s[t] - CHANCE[t]) / (1 - CHANCE[t]), 0) / shared.length;
  const coreDelta = shared.length ? sign * (coreOn(n.bench.scores) - coreOn(ref.bench.scores)) : null;
  let html = `<div class="kpi-grid">
    <div class="kpi">
      <div class="kpi-label">${L.kpiCoreTitle}</div>
      <div class="kpi-val">${n.bench.core != null ? (n.bench.core >= 0 ? "+" : "") + n.bench.core.toFixed(4) : "—"}</div>
      <div class="kpi-sub">${L.kpiCoreSub}</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">${n.is_target ? L.targetDeltaCore : L.kpiDeltaCore}</div>
      <div class="kpi-val ${coreDelta == null ? "" : (coreDelta >= 0 ? "delta-good" : "delta-bad")}">${coreDelta == null ? "—" : (coreDelta >= 0 ? "+" : "−") + Math.abs(coreDelta).toFixed(4)}</div>
      <div class="kpi-sub">${ref ? `vs ${esc(nodeLabel(ref))} · ${L.sharedTasks(shared.length)}` : L.noRefShort}</div>
    </div>
  </div>
  <table class="data">
    <thead><tr><th>${L.thTask}</th><th>${L.thScore}</th><th>${L.thDeltaAcc}</th><th>${L.thDeltaProb}</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;

  if (n.is_target) html += `<div class="note-small">${esc(L.targetBenchNote)}</div>`;
  if (n.paired_bench && n.paired_bench.length) {
    html += `<div class="note-small">${L.benchPairedNote}</div>`;
  } else if (ref) {
    html += `<div class="note-small">${L.benchUnpairedNote}</div>`;
  }
  return html;
}

const SERIES_COLORS = ["#0d7680", "#0f5499", "#990f3d", "#c27a00", "#5b4a8f", "#3d8a3f", "#c2567a", "#6b5b4f"];

function renderScalingChart(sc) {
  const L = t();
  const CT = chartTheme();
  const pts = sc.points || [];
  if (!pts.length) return `<div class="empty-state">${L.curveGroupEmpty}</div>`;

  const lrs = sc.lrs || [];
  const bestSet = new Set(sc.best_ids || []);
  const lrColor = lr => CT.series[Math.max(0, lrs.indexOf(lr)) % CT.series.length];
  const fmtLr = lr => lr.toExponential(0).replace("e-0", "e-");

  const logCs = pts.map(p => Math.log10(p.compute));
  const logYs = pts.map(p => Math.log10(p.bpb));
  const minX = Math.min(...logCs) - 0.16;
  const maxX = Math.max(...logCs) + 0.16;
  const minY = Math.min(...logYs) - 0.025;
  const maxY = Math.max(...logYs) + 0.032;

  const W = 388, H = 248, ML = 46, MR = 16, MT = 24, MB = 34;
  const pw = W - ML - MR, ph = H - MT - MB;
  const sx = lc => ML + ((lc - minX) / (maxX - minX)) * pw;
  const sy = ly => MT + (1 - (ly - minY) / (maxY - minY)) * ph;

  let grid = "";
  const bpbTicks = [1.1, 1.2, 1.3, 1.4, 1.5, 1.6].filter(v => {
    const lv = Math.log10(v);
    return lv >= minY - 0.005 && lv <= maxY + 0.005;
  });
  for (const yv of bpbTicks) {
    const yp = sy(Math.log10(yv)).toFixed(1);
    grid += `<line x1="${ML}" y1="${yp}" x2="${W - MR}" y2="${yp}" stroke="${CT.grid}" stroke-width="1"/>`;
    grid += `<text x="${ML - 6}" y="${Number(yp) + 3}" text-anchor="end" font-size="10" fill="${CT.tick}" font-family="var(--mono)">${yv.toFixed(1)}</text>`;
  }
  const minExp = Math.ceil(minX), maxExp = Math.floor(maxX);
  for (let e = minExp; e <= maxExp; e++) {
    const xp = sx(e).toFixed(1);
    grid += `<line x1="${xp}" y1="${MT}" x2="${xp}" y2="${H - MB}" stroke="${CT.gridSub}" stroke-width="1"/>`;
    grid += `<text x="${xp}" y="${H - 14}" text-anchor="middle" font-size="10" fill="${CT.tick}" font-family="var(--mono)">10^${e}</text>`;
  }

  let fitSvg = "";
  if (sc.fit) {
    const x0 = Math.pow(10, minX + 0.04), x1 = Math.pow(10, maxX - 0.04);
    const y0 = sc.fit.a * Math.pow(x0, -sc.fit.b);
    const y1 = sc.fit.a * Math.pow(x1, -sc.fit.b);
    fitSvg = `<line x1="${sx(Math.log10(x0)).toFixed(1)}" y1="${sy(Math.log10(y0)).toFixed(1)}" x2="${sx(Math.log10(x1)).toFixed(1)}" y2="${sy(Math.log10(y1)).toFixed(1)}" stroke="${CT.fit}" stroke-width="1.8" stroke-dasharray="5 4"/>`;
  }

  const bySize = new Map();
  for (const p of pts) {
    if (!bySize.has(p.params)) bySize.set(p.params, []);
    bySize.get(p.params).push(p);
  }
  let sizeLabels = "";
  const bestPts = [];
  for (const [, group] of [...bySize.entries()].sort((a, b) => a[0] - b[0])) {
    const top = group.reduce((a, b) => (a.bpb > b.bpb ? a : b));
    const best = group.reduce((a, b) => (a.bpb < b.bpb ? a : b));
    bestPts.push(best);
    const xp = sx(Math.log10(top.compute)).toFixed(1);
    const yp = Math.max(MT + 2, sy(Math.log10(top.bpb)) - 10).toFixed(1);
    sizeLabels += `<text x="${xp}" y="${yp}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${CT.fit}" font-family="var(--mono)">${top.params_m.toFixed(1)}M</text>`;
  }

  const bestLine = bestPts.length >= 2
    ? `<path d="${bestPts.map((p, i) => `${i === 0 ? "M" : "L"}${sx(Math.log10(p.compute)).toFixed(1)},${sy(Math.log10(p.bpb)).toFixed(1)}`).join(" ")}" fill="none" stroke="${CT.bestLine}" stroke-width="1.6" opacity="0.55"/>`
    : "";

  const dots = pts.map(p => {
    const cx = sx(Math.log10(p.compute)).toFixed(1);
    const cy = sy(Math.log10(p.bpb)).toFixed(1);
    const isBest = bestSet.has(p.id);
    const col = lrColor(p.lr);
    const tip = `${p.id}\n${p.params_m}M params · ${p.tokens_m}M tok\nlr ${fmtLr(p.lr)} · val BPB ${p.bpb.toFixed(4)}`;
    return `${isBest ? `<circle cx="${cx}" cy="${cy}" r="7.2" fill="none" stroke="${CT.bestRing}" stroke-width="1.3" opacity="0.7"/>` : ""}
      <circle cx="${cx}" cy="${cy}" r="${isBest ? 4.8 : 4.0}" fill="${col}" stroke="${CT.dotStroke}" stroke-width="1.5" style="cursor:pointer" data-jump="${esc(p.id)}"><title>${esc(tip)}</title></circle>`;
  }).join("");

  const legend = `<div class="curve-legend">
    ${lrs.map(lr => `<span><span class="curve-dot" style="background:${lrColor(lr)};height:8px;width:8px;border-radius:50%"></span>lr ${fmtLr(lr)}</span>`).join("")}
    ${sc.fit ? `<span><span class="curve-dot" style="background:${CT.fit}"></span>fit</span>` : ""}
  </div>`;

  const fitBanner = sc.fit
    ? `<div class="protocol-box" style="margin-bottom:10px"><strong>${esc(L.scalingFitLabel(sc.fit.a.toPrecision(3), sc.fit.b.toFixed(3), sc.fit.drop_per_2x_pct))}</strong></div>`
    : "";

  const headerCells = lrs.map(lr => `<th>${fmtLr(lr)}</th>`).join("");
  const tableRows = [...bySize.entries()].sort((a, b) => a[0] - b[0]).map(([, group]) => {
    const byLr = {};
    for (const p of group) byLr[p.lr] = p;
    const best = group.reduce((a, b) => (a.bpb < b.bpb ? a : b));
    const cells = lrs.map(lr => {
      const p = byLr[lr];
      if (!p) return `<td style="color:var(--muted)">—</td>`;
      const isBest = p.id === best.id;
      const cls = isBest ? 'style="font-weight:700;color:var(--green-dark)"' : "";
      return `<td><button class="link-btn" ${cls} data-jump="${esc(p.id)}">${p.bpb.toFixed(3)}</button></td>`;
    }).join("");
    return `<tr><td><strong>${best.params_m.toFixed(1)}M</strong></td>${cells}</tr>`;
  }).join("");

  return `${fitBanner}
  <div class="curve-wrap">
    <div style="font-size:12px;font-weight:600;color:var(--ink);margin-bottom:6px">${esc(L.scalingTitle)}</div>
    ${legend}
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      ${grid}
      <line x1="${ML}" y1="${MT}" x2="${ML}" y2="${H - MB}" stroke="${CT.axis}"/>
      <line x1="${ML}" y1="${H - MB}" x2="${W - MR}" y2="${H - MB}" stroke="${CT.axis}"/>
      ${fitSvg}${bestLine}${dots}${sizeLabels}
      <text x="${(ML + W - MR) / 2}" y="${H - 2}" text-anchor="middle" font-size="9.5" fill="${CT.tick}">${esc(L.scalingAxisX)}</text>
    </svg>
    <div class="note-small" style="margin-top:4px">${esc(L.scalingNote)}</div>
  </div>
  <div class="section-h">${esc(L.scalingTableTitle)}</div>
  <table class="data"><thead><tr><th>${esc(L.scalingThSize)}</th>${headerCells}</tr></thead><tbody>${tableRows}</tbody></table>`;
}

function renderGroupCurves(n) {
  const L = t();
  const CT = chartTheme();
  const runs = collectDescRuns(n.id).filter(r => (r.val_curve || []).some(p => p[0] > 0));
  if (!runs.length) return `<div class="empty-state">${L.curveGroupEmpty}</div>`;

  const shown = runs.slice(0, 8);
  const series = shown.map((r, idx) => ({
    run: r,
    color: CT.series[idx % CT.series.length],
    pts: r.val_curve.filter(p => p[0] > 0),
  }));
  const all = series.flatMap(s => s.pts);
  const maxX = Math.max(...all.map(p => p[0]), 1);
  const ys = all.map(p => p[1]);
  const rawMinY = Math.min(...ys), rawMaxY = Math.max(...ys);
  const padY = Math.max((rawMaxY - rawMinY) * 0.12, 0.02);
  const minY = rawMinY - padY, maxY = rawMaxY + padY;

  const W = 384, H = 224, ML = 44, MR = 16, MT = 14, MB = 30;
  const pw = W - ML - MR, ph = H - MT - MB;
  const sx = x => ML + (x / maxX) * pw;
  const sy = y => MT + (1 - (y - minY) / (maxY - minY)) * ph;
  const pathOf = pts => pts.map((p, i) => `${i === 0 ? "M" : "L"}${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join(" ");

  let grid = "";
  for (let i = 0; i <= 4; i++) {
    const yv = minY + (maxY - minY) * (i / 4);
    const yp = sy(yv).toFixed(1);
    grid += `<line x1="${ML}" y1="${yp}" x2="${W - MR}" y2="${yp}" stroke="${CT.grid}" stroke-width="1"/>`;
    grid += `<text x="${ML - 6}" y="${Number(yp) + 3}" text-anchor="end" font-size="10" fill="${CT.tick}" font-family="var(--mono)">${yv.toFixed(2)}</text>`;
  }
  for (let i = 0; i <= 4; i++) {
    const xv = maxX * (i / 4);
    grid += `<text x="${sx(xv).toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="10" fill="${CT.tick}" font-family="var(--mono)">${Math.round(xv)}M</text>`;
  }

  const lines = series.map(s =>
    `<path d="${pathOf(s.pts)}" fill="none" stroke="${s.color}" stroke-width="1.9"/>` +
    s.pts.map(p => `<circle cx="${sx(p[0]).toFixed(1)}" cy="${sy(p[1]).toFixed(1)}" r="2.4" fill="${s.color}"><title>${esc(s.run.id)} @ ${p[0]}M tok: ${p[1]}</title></circle>`).join("")
  ).join("");

  const legend = `<div class="curve-legend">${series.map(s =>
    `<span><span class="curve-dot" style="background:${s.color}"></span><button class="link-btn" style="color:inherit;text-decoration:none" data-jump="${esc(s.run.id)}">${esc(nodeLabel(s.run))} (${fmtBpb(s.run.val_bpb)})</button></span>`
  ).join("")}</div>`;

  return `<div class="curve-wrap">${legend}
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      ${grid}
      <line x1="${ML}" y1="${MT}" x2="${ML}" y2="${H - MB}" stroke="${CT.axis}"/>
      <line x1="${ML}" y1="${H - MB}" x2="${W - MR}" y2="${H - MB}" stroke="${CT.axis}"/>
      ${lines}
    </svg>
    <div class="note-small" style="margin-top:4px">${esc(L.curveGroupNote)}</div>
  </div>`;
}

function renderCurveTab(n) {
  const L = t();
  const CT = chartTheme();
  if (n.scaling_chart) return renderScalingChart(n.scaling_chart);
  if (n.is_group) return renderGroupCurves(n);
  if (n.is_target) return `<div class="empty-state">${esc(L.targetNoRun)}</div>`;
  if (n.is_placeholder) return `<div class="empty-state">${L.placeholderEmpty}</div>`;
  const curPts = (n.val_curve || []).filter(p => p[0] > 0);
  const ref = n.compare_to ? DATA.nodes[n.compare_to] : null;
  const refPts = ref ? (ref.val_curve || []).filter(p => p[0] > 0) : [];
  if (!curPts.length) return `<div class="empty-state">${L.curveEmpty}</div>`;

  const all = curPts.concat(refPts);
  const minX = 0, maxX = Math.max(...all.map(p => p[0]), 1);
  const ys = all.map(p => p[1]);
  const rawMinY = Math.min(...ys), rawMaxY = Math.max(...ys);
  const padY = Math.max((rawMaxY - rawMinY) * 0.12, 0.02);
  const minY = rawMinY - padY, maxY = rawMaxY + padY;

  const W = 384, H = 220, ML = 44, MR = 16, MT = 14, MB = 30;
  const pw = W - ML - MR, ph = H - MT - MB;
  const sx = x => ML + ((x - minX) / (maxX - minX)) * pw;
  const sy = y => MT + (1 - (y - minY) / (maxY - minY)) * ph;

  const pathOf = pts => pts.map((p, i) => `${i === 0 ? "M" : "L"}${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join(" ");

  let grid = "";
  for (let i = 0; i <= 4; i++) {
    const yv = minY + (maxY - minY) * (i / 4);
    const yp = sy(yv).toFixed(1);
    grid += `<line x1="${ML}" y1="${yp}" x2="${W - MR}" y2="${yp}" stroke="${CT.grid}" stroke-width="1"/>`;
    grid += `<text x="${ML - 6}" y="${Number(yp) + 3}" text-anchor="end" font-size="10" fill="${CT.tick}" font-family="var(--mono)">${yv.toFixed(2)}</text>`;
  }
  for (let i = 0; i <= 4; i++) {
    const xv = maxX * (i / 4);
    const xp = sx(xv).toFixed(1);
    grid += `<text x="${xp}" y="${H - 10}" text-anchor="middle" font-size="10" fill="${CT.tick}" font-family="var(--mono)">${Math.round(xv)}M</text>`;
  }

  const refSvg = refPts.length
    ? `<path d="${pathOf(refPts)}" fill="none" stroke="${CT.refLine}" stroke-width="1.8" stroke-dasharray="4 3"/>`
      + refPts.map(p => `<circle cx="${sx(p[0]).toFixed(1)}" cy="${sy(p[1]).toFixed(1)}" r="2.2" fill="${CT.refLine}"><title>${esc(ref.id)} @ ${p[0]}M tok: ${p[1]}</title></circle>`).join("")
    : "";
  const curSvg = `<path d="${pathOf(curPts)}" fill="none" stroke="${CT.curLine}" stroke-width="2.2"/>`
    + curPts.map(p => `<circle cx="${sx(p[0]).toFixed(1)}" cy="${sy(p[1]).toFixed(1)}" r="3" fill="${CT.curLine}"><title>${esc(n.id)} @ ${p[0]}M tok: ${p[1]}</title></circle>`).join("");

  const offsetM = n.token_offset_m || 0;
  const branchGuide = offsetM > 0
    ? `<line x1="${sx(offsetM).toFixed(1)}" y1="${MT}" x2="${sx(offsetM).toFixed(1)}" y2="${H - MB}" stroke="${CT.branchLine}" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
       <text x="${sx(offsetM).toFixed(1)}" y="${MT + 10}" text-anchor="middle" font-size="9.5" font-weight="600" fill="${CT.branchLine}">${esc(L.curveBranchMarker(Math.round(offsetM)))}</text>`
    : "";

  const legend = `<div class="curve-legend">
    <span><span class="curve-dot" style="background:${CT.curLine}"></span>${esc(n.id)} (${fmtBpb(n.val_bpb)})</span>
    ${refPts.length ? `<span><span class="curve-dot" style="background:${CT.refLine}"></span>${L.curveRefPrefix} ${esc(ref.id)} (${fmtBpb(ref.val_bpb)})</span>` : ""}
  </div>`;

  const stepRows = curPts.map(p => `<tr><td>${p[0]}M</td><td>${p[1].toFixed(4)}</td></tr>`).join("");
  const curveFootnote = offsetM > 0 ? L.curveBranchNote(Math.round(offsetM)) : L.curveNote;

  return `<div class="curve-wrap">${legend}
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      ${grid}
      ${branchGuide}
      <line x1="${ML}" y1="${MT}" x2="${ML}" y2="${H - MB}" stroke="${CT.axis}"/>
      <line x1="${ML}" y1="${H - MB}" x2="${W - MR}" y2="${H - MB}" stroke="${CT.axis}"/>
      ${refSvg}${curSvg}
    </svg>
    <div class="note-small" style="margin-top:4px">${esc(curveFootnote)}</div>
  </div>
  <div class="section-h">${L.sectionValPoints}</div>
  <table class="data"><thead><tr><th>Tokens</th><th>val BPB</th></tr></thead><tbody>${stepRows}</tbody></table>`;
}

function renderArtifactsTab(n) {
  const L = t();
  if (n.is_group) return `<div class="empty-state">${L.artifactsGroupEmpty}</div>`;
  if (n.is_target) return `<div class="empty-state">${esc(L.targetNoRun)}</div>`;
  if (n.is_placeholder) return `<div class="empty-state">${L.placeholderEmpty}</div>`;
  const a = n.artifacts || {};
  const parts = [`<div class="section-h">${L.sectionArtifacts}</div>`];
  parts.push(`<div class="artifact-row">
    <span class="artifact-path">${esc(a.ckpt_path || "—")}</span>
    <span class="artifact-status ${a.ckpt_exists ? "ok" : "miss"}">${a.ckpt_exists ? `✓ ${a.ckpt_mb} MB` : L.notFound}</span>
  </div>`);
  parts.push(`<div class="artifact-row">
    <span class="artifact-path">${esc(a.npz_path || "—")}</span>
    <span class="artifact-status ${a.npz_exists ? "ok" : "miss"}">${a.npz_exists ? L.npzOk : L.npzMiss}</span>
  </div>`);
  parts.push(`<div class="artifact-row">
    <span class="artifact-path">${esc(a.samples_path || "—")}</span>
    <span class="artifact-status ${a.samples_exists ? "ok" : "miss"}">${a.samples_exists ? `✓ step ${n.samples.step}` : L.samplesMiss}</span>
  </div>`);

  if (!a.samples_exists) return parts.join("");

  const items = n.samples.items;
  const idx = Math.min(state.sampleIdx, items.length - 1);
  const curItem = items[idx];
  const ref = n.compare_to ? DATA.nodes[n.compare_to] : null;
  const refItem = (ref && ref.samples && ref.samples.items[idx]) ? ref.samples.items[idx] : null;

  const opts = items.map((it, i) => `<option value="${i}" ${i === idx ? "selected" : ""}>#${i + 1} ${esc(trunc(it.prompt, 46))}</option>`).join("");
  parts.push(`<div class="section-h">${L.sectionSamples(n.samples.step)}</div>
    <div class="sample-controls">
      <select id="sample-select">${opts}</select>
      ${refItem ? `<label><input type="checkbox" id="sample-cmp-chk" ${state.compareSamples ? "checked" : ""}> ${esc(L.compareWith(nodeLabel(ref), ref.id))}</label>` : ""}
    </div>`);

  parts.push(`<div class="sample-card">
    <div class="sample-card-head"><span>${esc(n.id)}</span><span>val BPB ${fmtBpb(n.val_bpb)}</span></div>
    <span class="sample-prompt">${esc(curItem.prompt)}</span>${esc(curItem.text)}
  </div>`);

  if (refItem && state.compareSamples) {
    parts.push(`<div class="sample-card sample-ref">
      <div class="sample-card-head"><span>${esc(L.sampleRefHead(ref.id))}</span><span>val BPB ${fmtBpb(ref.val_bpb)}</span></div>
      <span class="sample-prompt">${esc(refItem.prompt)}</span>${esc(refItem.text)}
    </div>`);
  }
  return parts.join("");
}

function collectDescRuns(id) {
  const out = [];
  for (const cid of (DATA.nodes[id]?.children || [])) {
    const c = DATA.nodes[cid];
    if (c.is_group) out.push(...collectDescRuns(cid));
    else out.push(c);
  }
  return out;
}

function applyTransform() {
  const vp = document.getElementById("viewport");
  vp.setAttribute("transform", `translate(${state.pan.x}, ${state.pan.y}) scale(${state.pan.scale})`);
}

function contentBounds() {
  const boxes = Object.values(state.refLayout || {}).map(r => ({ x: r.x, y: r.y - 24, w: r.w, h: r.h + 24 }));
  if (isSephiroth()) {
    for (const p of Object.values(state.layout)) boxes.push({ x: p.x - 140, y: p.y - 34, w: p.w + 280, h: p.h + 78 });
  } else {
    const pad = LAB.LANE_PAD;
    for (const l of state.labLanes || []) boxes.push({ x: l.x - pad, y: l.top - pad, w: l.right - l.x + 2 * pad, h: l.bottom - l.top + 2 * pad });
  }
  if (!boxes.length) return null;
  return {
    minX: Math.min(...boxes.map(b => b.x)), maxX: Math.max(...boxes.map(b => b.x + b.w)),
    minY: Math.min(...boxes.map(b => b.y)), maxY: Math.max(...boxes.map(b => b.y + b.h)),
  };
}

function fitToView() {
  const wrap = document.getElementById("canvas-wrap");
  const b = contentBounds();
  if (!b) return;
  const cw = wrap.clientWidth, ch = wrap.clientHeight;
  const top = (document.getElementById("toolbar")?.offsetHeight || 0) + 22;
  const legend = document.getElementById("canvas-legend");
  const bottom = (legend && legend.offsetParent ? legend.offsetHeight : 0) + 20;
  const side = 24;
  const availW = Math.max(120, cw - 2 * side), availH = Math.max(120, ch - top - bottom);
  const w = b.maxX - b.minX, h = b.maxY - b.minY;
  // Fit the width; shrink for height only down to a readable size, then show the top and let the
  // reader drag down (an expanded lane can be several screens tall).
  const scale = Math.max(0.2, Math.min(1, availW / w, Math.max(availH / h, 0.55)));
  state.pan.scale = scale;
  state.pan.x = side + Math.max(0, (availW - w * scale) / 2) - b.minX * scale;
  state.pan.y = top + Math.max(0, (availH - h * scale) / 2) - b.minY * scale;
  applyTransform();
}

// Pan just enough to bring a node into view (used when jumping to a node from the drawer).
function ensureVisible(id) {
  const p = state.layout[id];
  if (!p) return;
  const wrap = document.getElementById("canvas-wrap");
  const s = state.pan.scale;
  const x0 = p.x * s + state.pan.x, y0 = p.y * s + state.pan.y;
  const x1 = x0 + p.w * s, y1 = y0 + p.h * s;
  const m = 40;
  let dx = 0, dy = 0;
  if (x0 < m) dx = m - x0; else if (x1 > wrap.clientWidth - m) dx = wrap.clientWidth - m - x1;
  if (y0 < m) dy = m - y0; else if (y1 > wrap.clientHeight - m) dy = wrap.clientHeight - m - y1;
  if (dx || dy) {
    state.pan.x += dx;
    state.pan.y += dy;
    applyTransform();
  }
}

function applySkinAttr() {
  if (isSephiroth()) document.documentElement.dataset.skin = "sephiroth";
  else delete document.documentElement.dataset.skin;
}

function setSkin(skin) {
  if (skin !== "lab" && skin !== "sephiroth") return;
  state.skin = skin;
  try { localStorage.setItem("pinwheel-tree-skin", skin); } catch (_) {}
  renderChrome();
  renderTree();
  renderDrawer();
  fitToView();
}

function setLang(lang) {
  if (lang !== "zh" && lang !== "en") return;
  state.lang = lang;
  try { localStorage.setItem("pinwheel-tree-lang", lang); } catch (_) {}
  renderChrome();
  renderTree();
  renderDrawer();
}

function initInteractions() {
  const wrap = document.getElementById("canvas-wrap");
  let dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0;

  wrap.addEventListener("mousedown", e => {
    if (
      e.target.closest(".node-g")
      || e.target.closest(".ref-node-g")
      || e.target.closest(".legend")
      || e.target.closest(".toolbar")
      || e.target.closest("button")
    ) return;
    dragging = true; moved = false; sx = e.clientX; sy = e.clientY; ox = state.pan.x; oy = state.pan.y;
    wrap.classList.add("dragging");
  });
  window.addEventListener("mousemove", e => {
    if (!dragging) return;
    if (Math.hypot(e.clientX - sx, e.clientY - sy) > 4) moved = true;
    state.pan.x = ox + (e.clientX - sx);
    state.pan.y = oy + (e.clientY - sy);
    applyTransform();
  });
  window.addEventListener("mouseup", () => {
    if (dragging && !moved) clearSelection();
    dragging = false; moved = false; wrap.classList.remove("dragging");
  });
  window.addEventListener("keydown", e => {
    if (e.key === "Escape" && document.activeElement?.id !== "search-input") clearSelection();
  });
  wrap.addEventListener("wheel", e => {
    e.preventDefault();
    const rect = wrap.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const factor = e.deltaY < 0 ? 1.12 : 0.89;
    const ns = Math.min(2.2, Math.max(0.28, state.pan.scale * factor));
    state.pan.x = mx - (mx - state.pan.x) * (ns / state.pan.scale);
    state.pan.y = my - (my - state.pan.y) * (ns / state.pan.scale);
    state.pan.scale = ns;
    applyTransform();
  }, { passive: false });

  document.querySelectorAll("#d-tabs .tab").forEach(btn => {
    btn.addEventListener("click", () => { state.activeTab = btn.dataset.tab; renderDrawer(); });
  });

  document.getElementById("btn-trunk").addEventListener("click", e => {
    state.trunkOnly = !state.trunkOnly;
    e.target.classList.toggle("active", state.trunkOnly);
    renderTree(); fitToView();
  });
  document.getElementById("btn-inspire").addEventListener("click", e => {
    state.showInspiration = !state.showInspiration;
    e.target.classList.toggle("active", state.showInspiration);
    renderTree();
  });
  document.getElementById("btn-refs").addEventListener("click", e => {
    state.showRefs = !state.showRefs;
    e.target.classList.toggle("active", state.showRefs);
    renderTree();
  });
  document.getElementById("btn-expand").addEventListener("click", () => {
    for (const id of Object.keys(DATA.nodes)) if (DATA.nodes[id].is_group) state.collapsed[id] = false;
    renderTree(); fitToView();
  });
  document.getElementById("btn-collapse").addEventListener("click", () => {
    for (const id of Object.keys(DATA.nodes)) if (DATA.nodes[id].is_group) state.collapsed[id] = true;
    renderTree(); fitToView();
  });
  document.getElementById("btn-fit").addEventListener("click", fitToView);

  document.querySelectorAll(".skin-switch button").forEach(btn => {
    btn.addEventListener("click", () => setSkin(btn.dataset.skin));
  });
  document.querySelectorAll(".lang-switch button").forEach(btn => {
    btn.addEventListener("click", () => setLang(btn.dataset.lang));
  });

  const search = document.getElementById("search-input");
  search.addEventListener("input", () => {
    state.search = search.value;
    const q = state.search.trim().toLowerCase();
    if (q) {
      const hit = Object.values(DATA.nodes).find(
        n => `${n.id} ${n.label} ${n.label_en} ${n.milestone} ${n.milestone_en}`.toLowerCase().includes(q)
      );
      if (hit) {
        let cur = hit.parent;
        while (cur) { state.collapsed[cur] = false; cur = DATA.nodes[cur].parent; }
      }
    }
    renderTree();
  });
}

renderChrome();
initInteractions();
renderTree();
renderDrawer();
fitToView();
// Card text is truncated by measured width: redraw once the web font has arrived.
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => renderTree());
window.addEventListener("resize", () => fitToView());
</script>
</body>
</html>
